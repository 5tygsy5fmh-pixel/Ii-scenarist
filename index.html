<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cometa AI Studio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
body{margin:0;padding:0;background:#050505;color:#fff;font-family:'Inter',sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column}
*{box-sizing:border-box}
.header{display:flex;align-items:center;justify-content:space-between;padding:10px 15px;background:#000;border-bottom:1px solid #222;z-index:10}
.logo{font-weight:900;font-size:18px;background:linear-gradient(90deg,#10b981,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-controls{display:flex;gap:6px;align-items:center}
.icon-btn{background:#111;border:1px solid #333;color:#fff;padding:8px;border-radius:50%;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;width:34px;height:34px;transition:.2s}
.icon-btn:hover{background:#222}
#loginScreen{display:none;position:fixed;inset:0;z-index:2000;background:#fbc02d;align-items:center;justify-content:center;flex-direction:column;overflow:hidden}
#loginScreen::before{content:'';position:absolute;width:200vw;height:200vh;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.4) 0deg 15deg,transparent 15deg 30deg);animation:rotateRays 30s linear infinite}
@keyframes rotateRays{100%{transform:rotate(360deg)}}
.login-box{position:relative;z-index:2;width:280px;height:200px;background:#dca25c;border:12px solid #3e2723;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .1s}
.login-box:active{transform:scale(.95)}
.box-inner{width:100%;height:100%;display:flex;position:relative;overflow:hidden}
.box-left{width:50%;height:100%;background:#e8c452;border-right:4px solid #b87e3a;display:flex;align-items:center;justify-content:center}
.box-right{width:50%;height:100%;background:#dca25c;display:flex;align-items:center;justify-content:center;position:relative}
.red-mark-top{position:absolute;top:15px;right:15px;width:30px;height:20px;border-top:4px solid #e57373;border-right:4px solid #e57373;border-radius:0 5px 0 0}
.red-mark-bottom{position:absolute;bottom:15px;right:15px;width:30px;height:20px;border-bottom:4px solid #e57373;border-right:4px solid #e57373;border-radius:0 0 5px 0}
.red-exclamation{font-size:40px;font-weight:900;color:#e57373;margin-right:20px}
.broken-glass-svg{width:50px;height:50px;fill:#3e2723}
.skip-btn{position:absolute;top:20px;right:20px;z-index:2;background:rgba(0,0,0,.2);color:#000;border:none;padding:10px 20px;border-radius:20px;font-weight:bold;cursor:pointer;font-size:14px}
#verityContainer{display:none;position:fixed;z-index:3000;width:50px;height:50px;cursor:grab;touch-action:none}
.verity-face{width:50px;height:50px;background:#ffd21e;border-radius:50%;position:relative;box-shadow:0 4px 10px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .3s,opacity .3s,transform .3s,box-shadow .3s}
.verity-eye{width:6px;height:6px;background:#000;border-radius:50%;position:absolute;top:16px;transition:.3s}
.verity-eye.left{left:13px}.verity-eye.right{right:13px}
.verity-mouth{width:16px;height:6px;background:#000;border-radius:0 0 10px 10px;position:absolute;bottom:12px;transition:height .2s}
.verity-face.talking .verity-mouth{animation:talk .2s infinite alternate}
@keyframes talk{0%{height:6px}100%{height:14px}}
.verity-face.sleeping{opacity:.6;transform:scale(.95);animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.95)}50%{transform:scale(1)}}
.verity-face.angry{background:#ff5252!important}
.verity-face.angry .verity-eye{top:20px;transform:rotate(20deg)}
.verity-face.angry .verity-eye.right{transform:rotate(-20deg)}
.verity-face.angry .verity-mouth{height:3px;border-radius:10px 10px 0 0;bottom:15px;width:20px}
.verity-face.blush{background:#ffb8b8!important}
.verity-face.blush::after{content:'';position:absolute;width:30px;height:10px;background:rgba(255,0,0,.3);border-radius:50%;bottom:8px;filter:blur(3px)}
.verity-face.startled{animation:shake .4s;background:#ff5252!important}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.verity-face.typing-pulse{animation:pulse-interest 1.5s infinite}
@keyframes pulse-interest{0%{box-shadow:0 0 0 0 rgba(255,210,30,.7)}70%{box-shadow:0 0 0 15px rgba(255,210,30,0)}100%{box-shadow:0 0 0 0 rgba(255,210,30,0)}}
.verity-face.cat-mode{background:#ffb8b8!important;border-radius:10px 10px 20px 20px}
.verity-face.cat-mode::before,.verity-face.cat-mode::after{content:'';position:absolute;top:-10px;width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:15px solid #ffb8b8;z-index:-1}
.verity-face.cat-mode::before{left:5px;transform:rotate(-15deg)}
.verity-face.cat-mode::after{right:5px;transform:rotate(15deg)}
.verity-face.glitch{animation:glitchAnim .2s infinite;background:#555!important}
@keyframes glitchAnim{0%{transform:translate(0)}20%{transform:translate(-3px,3px)}40%{transform:translate(-3px,-3px)}60%{transform:translate(3px,3px)}80%{transform:translate(3px,-3px)}100%{transform:translate(0)}}
.verity-face.glow-neutral{box-shadow:0 0 20px 5px rgba(255,210,30,.6)}
.verity-face.glow-blush{box-shadow:0 0 20px 5px rgba(255,100,100,.6)}
.verity-face.glow-angry{box-shadow:0 0 20px 8px rgba(255,0,0,.8)}
.particle{position:absolute;pointer-events:none;font-size:16px;animation:floatUp 1s ease-out forwards;z-index:4000}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(.5)}100%{opacity:0;transform:translateY(-40px) scale(1.2)}}
.verity-controls{position:absolute;top:55px;left:-35px;display:flex;gap:8px;opacity:0;transition:.3s}
#verityContainer:hover .verity-controls,#verityContainer.active .verity-controls{opacity:1}
.v-btn{width:30px;height:30px;background:#111;border:1px solid #10b981;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:14px;box-shadow:0 2px 5px rgba(0,0,0,.5)}
.content-area{flex:1;background:#0a0a0a;display:flex;flex-direction:column;overflow-y:auto;position:relative;scroll-behavior:smooth}
#mainLoader{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:140px;height:140px;display:none;z-index:100}
.loader-track{fill:none;stroke:#151515;stroke-width:8;stroke-linecap:round}
.loader-anim{fill:none;stroke:url(#gradient);stroke-width:8;stroke-linecap:round;stroke-dasharray:350;stroke-dashoffset:350;animation:loadDraw 3.5s linear infinite}
.loader-text{fill:#fff;font-family:'Inter',sans-serif;font-weight:900;font-size:36px;text-anchor:middle;opacity:.9}
@keyframes loadDraw{0%{stroke-dashoffset:350}100%{stroke-dashoffset:0}}
.chat-container{padding:15px;display:flex;flex-direction:column;gap:15px;max-width:800px;margin:0 auto;width:100%}
.message-row{display:flex;flex-direction:column;width:100%}
.message-row.user{align-items:flex-end}
.message-row.bot{align-items:flex-start}
.message-bubble{max-width:85%;padding:12px 16px;border-radius:16px;font-size:15px;line-height:1.5;position:relative;word-wrap:break-word}
.message-row.user .message-bubble{background:#3b82f6;color:#fff;border-bottom-right-radius:4px}
.message-row.bot .message-bubble{background:#222;color:#eee;border-bottom-left-radius:4px}
.speaker-name{font-size:11px;margin-bottom:3px;font-weight:bold;display:block}
.message-actions{margin-top:5px;font-size:12px;color:#888;cursor:pointer}
.edit-textarea{width:100%;background:#000;border:1px solid #10b981;color:#fff;padding:10px;border-radius:8px;font-size:14px;resize:vertical;min-height:80px;margin-bottom:5px}
.edit-buttons{display:flex;gap:10px}
.btn-small{padding:5px 10px;border-radius:6px;border:none;cursor:pointer;font-weight:bold;font-size:12px}
.btn-save{background:#10b981;color:#000}.btn-cancel{background:#444;color:#fff}
.script-container{padding:20px;max-width:800px;margin:0 auto;width:100%;display:none;font-size:16px;line-height:1.6;color:#ddd}
.script-container img{width:100%;border-radius:12px;margin:20px 0;box-shadow:0 4px 15px rgba(0,0,0,.5)}
.control-panel{background:#111;border-top:1px solid #333;padding:10px 15px}
.quick-tools{display:flex;gap:8px;margin-bottom:10px;overflow-x:auto}
.tool-btn{background:#1a1a1a;border:1px solid #333;color:#ccc;padding:6px 12px;border-radius:20px;font-size:12px;cursor:pointer;white-space:nowrap}
.tool-btn:hover{border-color:#10b981;color:#fff}
.input-wrapper{display:flex;gap:10px;align-items:flex-end;max-width:800px;margin:0 auto;position:relative}
.reset-btn{position:absolute;left:10px;top:15px;background:none;border:none;color:#666;font-size:16px;cursor:pointer}
textarea{flex:1;height:50px;background:#000;border:1px solid #333;border-radius:12px;color:#fff;padding:14px 14px 14px 35px;font-size:15px;resize:none;outline:none}
.send-btn{width:50px;height:50px;background:linear-gradient(135deg,#10b981,#059669);border:none;border-radius:12px;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:4000;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(5px)}
.modal-content{background:#1a1a2e;border-radius:16px;padding:20px;width:100%;max-width:450px;max-height:85vh;overflow-y:auto;border:1px solid #333}
.modal-header{display:flex;justify-content:space-between;margin-bottom:15px;font-size:18px;font-weight:bold}
.input-field{width:100%;padding:12px;background:#000;border:1px solid #333;border-radius:8px;color:#fff;margin-bottom:15px;font-size:14px}
.genre-category{padding:14px;background:#111;border-radius:10px;margin-bottom:10px;cursor:pointer;border:1px solid #333;font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.genre-list{display:none;margin-top:-5px;margin-bottom:15px;padding:10px;background:#0a0a0a;border-radius:0 0 10px 10px;border:1px solid #333;border-top:none}
.genre-item{padding:10px 12px;background:#1a1a1a;border-radius:6px;margin-bottom:6px;font-size:14px;cursor:pointer;color:#ccc}
.lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lang-item{padding:10px;background:#111;border-radius:8px;cursor:pointer;border:1px solid #222;font-size:13px;text-align:center}
.lang-item:hover{border-color:#10b981}
.audio-player{display:none;padding:10px;background:#000;border-top:1px solid #333;align-items:center;gap:10px}
.btn-primary{width:100%;padding:15px;background:linear-gradient(135deg,#10b981,#059669);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:800;cursor:pointer;margin-bottom:10px}
.btn-secondary{width:100%;padding:12px;background:#333;border:none;border-radius:12px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:10px}
.panel-section{margin-bottom:15px;border-bottom:1px solid #333;padding-bottom:10px}
.panel-section h4{margin:0 0 8px 0;color:#aaa;font-size:14px}
.trigger-row{display:flex;gap:5px;margin-bottom:5px}
.trigger-row input{flex:1;background:#333;border:1px solid #555;color:#fff;padding:6px;border-radius:4px;font-size:12px}
.add-trigger-btn{background:#ff9800;color:#000;border:none;cursor:pointer;padding:0 10px;border-radius:4px;font-weight:bold}
.q-btn{background:#1a1a1a;border:1px solid #333;color:#ccc;padding:6px 12px;border-radius:20px;font-size:12px;cursor:pointer;margin:2px}
.s-btn{background:#222;border:1px solid #444;padding:4px 8px;border-radius:6px;font-size:16px;cursor:pointer;margin:2px}
.character-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(65px,1fr));gap:15px;margin-bottom:15px;margin-top:10px}
.char-avatar{width:65px;height:65px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;cursor:pointer;transition:transform .2s,box-shadow .2s;position:relative;font-size:11px;text-align:center;padding:0 4px;text-transform:uppercase;letter-spacing:.5px;line-height:1.1}
.char-avatar:hover{transform:scale(1.1);box-shadow:0 0 15px rgba(255,255,255,.2)}
.char-avatar.active{border:3px solid #fff;box-shadow:0 0 20px currentColor}
</style>
</head>
<body>
<div id="loginScreen">
<button class="skip-btn" onclick="closeLoginScreen()">Пропустить</button>
<div class="login-box" onclick="summonVerity()">
<div class="box-inner">
<div class="box-left">
<svg class="broken-glass-svg" viewBox="0 0 24 24"><path d="M6 2h12l-1 10a5 5 0 0 1-10 0L6 2z"/><path d="M12 12v8"/><path d="M8 22h8"/><path d="M8 6l8 6" stroke="#e8c452" stroke-width="2"/></svg>
</div>
<div class="box-right">
<div class="red-mark-top"></div><div class="red-exclamation">!</div><div class="red-mark-bottom"></div>
</div>
</div>
</div>
</div>
<div id="verityContainer" style="top:70%;left:80%;">
<div class="verity-face" id="verityFace"><div class="verity-eye left"></div><div class="verity-eye right"></div><div class="verity-mouth"></div></div>
<div class="verity-controls"><div class="v-btn" onclick="startVoiceInput()">🎤</div><div class="v-btn" onclick="openVerityChat()">💬</div><div class="v-btn" onclick="openMusicModal()">📻</div></div>
</div>
<div class="header">
<div class="logo">Cometa AI</div>
<div class="header-controls">
<button class="icon-btn" id="openApiSettingsBtn">🔑</button>
<button class="icon-btn" id="openGenreBtn">🎨</button>
<button class="icon-btn" id="openBroadcastSettingsBtn">⚙️</button>
<button class="icon-btn" id="openLangBtn">🌐</button>
<button class="icon-btn" id="loginBtn" style="width:auto;padding:0 10px;border-radius:20px;font-weight:bold;font-size:12px;">Войти</button>
</div>
</div>
<div class="content-area" id="contentArea">
<svg id="mainLoader" viewBox="0 0 100 100">
<defs><linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4b74ff"/><stop offset="100%" stop-color="#51d5a7"/></linearGradient></defs>
<path class="loader-track" d="M 25 10 L 80 10 A 15 15 0 0 1 95 25 L 95 75 A 15 15 0 0 1 80 90 L 25 90 A 15 15 0 0 1 10 75 L 10 25 A 15 15 0 0 1 25 10 Z"/>
<path class="loader-anim" d="M 25 10 L 80 10 A 15 15 0 0 1 95 25 L 95 75 A 15 15 0 0 1 80 90 L 25 90 A 15 15 0 0 1 10 75 L 10 25 A 15 15 0 0 1 25 10 Z"/>

</div>

</div>

function startDrag(e){isDragging=false;let cx=e.touches?e.touches[0].clientX:e.clientX;let cy=e.touches?e.touches[0].clientY:e.clientY;offsetX=cx-verityContainer.getBoundingClientRect().left;offsetY=cy-verityContainer.getBoundingClientRect().top;document.addEventListener('mousemove',drag);document.addEventListener('touchmove',drag,{passive:false});document.addEventListener('mouseup',stopDrag);document.addEventListener('touchend',stopDrag);}
function drag(e){e.preventDefault();isDragging=true;let cx=e.touches?e.touches[0].clientX:e.clientX;let cy=e.touches?e.touches[0].clientY:e.clientY;verityContainer.style.left=(cx-offsetX)+'px';verityContainer.style.top=(cy-offsetY)+'px';}

function playJingle(){try{const c=new(window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator();const g=c.createGain();o.type='triangle';o.frequency.setValueAtTime(440,c.currentTime);o.frequency.exponentialRampToValueAtTime(880,c.currentTime+0.2);g.gain.setValueAtTime(0.3,c.currentTime);g.gain.exponentialRampToValueAtTime(0.01,c.currentTime+0.8);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+0.8);}catch(e){}}

function speakVerity(text){if('speechSynthesis' in window){window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=selectedLanguage==='ru'?'ru-RU':'en-US';const b=document.getElementById('bgMusic');let ov=b.volume;const h=new Date().getHours();if(h>=23||h<6){u.pitch=0.8;u.volume=0.4;u.rate=0.9;}else{if(activeChar.ageGroup==='child')u.pitch=1.6;else if(activeChar.gender==='female')u.pitch=1.3;else u.pitch=1.0;}u.onstart=()=>{if(!b.paused)b.volume=0.1;verityFace.classList.add('talking');setGlow('glow-neutral');verityFace.style.transform=`rotate(${Math.random()>0.5?5:-5}deg)`;};u.onend=()=>{if(!b.paused)b.volume=ov;verityFace.classList.remove('talking');setGlow(null);verityFace.style.transform='rotate(0deg)';};window.speechSynthesis.speak(u);}}

// --- ЗАПРОС К GROQ ---
async function processVerityRequest(text){
    const box=document.getElementById('verityChatHistory');
    box.scrollTop=box.scrollHeight;
    const lid='ld-'+Date.now();
    box.innerHTML+=`<div id="${lid}" style="font-size:12px;color:#aaa;font-style:italic;">Думает...</div>`;
    const cr=checkTriggers(text);
    if(cr){document.getElementById(lid).remove();box.innerHTML+=`<div style="background:#444;padding:8px;border-radius:8px;align-self:flex-start;font-size:13px;color:#fff;">${cr}</div>`;speakVerity(cr);return;}
    const key=localStorage.getItem('cometa_api_key');
    if(!key){document.getElementById(lid).remove();speakVerity("Добавь API ключ (🔑)!");return;}
    try{
        const traits=getBehaviorTraits(activeChar);
        const sys=`${activeChar.prompt} Особенности: ${traits} ВАЖНО: Не придумывай бытовые драмы. Отвечай на языке: ${selectedLanguageName}.`;
        const res=await fetch("https://api.groq.com/openai/v1/chat/completions",{
            method:'POST',
            headers:{'Content-Type':'application/json','Authorization':`Bearer ${key}`},
            body:JSON.stringify({model:"llama-3.1-70b-versatile",messages:[{role:'system',content:sys},{role:'user',content:text}]})
        });
        const data=await res.json();
        if(data.error) throw new Error(data.error.message);
        const rep=data.choices[0].message.content;
        document.getElementById(lid).remove();
        box.innerHTML+=`<div style="background:#444;padding:8px;border-radius:8px;align-self:flex-start;font-size:13px;color:#fff;">${rep}</div>`;
        box.scrollTop=box.scrollHeight;
        speakVerity(rep);
    }catch(e){
        document.getElementById(lid).remove();
        speakVerity("Запуталась в проводах...");
    }
}

async function sendToAPI(){
    const key=localStorage.getItem('cometa_api_key');
    if(!key){alert("Введите ключ Groq!");document.getElementById('apiSettingsModal').style.display='flex';return;}
    document.getElementById('mainLoader').style.display='block';
    if(verityFace){verityFace.style.transform='rotate(-5deg)';setGlow('glow-neutral');}
    try{
        const traits=getBehaviorTraits(activeChar);
        let sys=`${activeChar.prompt} Особенности: ${traits} ВАЖНО: Не придумывай бытовые драмы. Отвечай на языке: ${selectedLanguageName}.`;
        let msg=[{role:'system',content:sys}];
        chatHistory.forEach(m=>msg.push({role:m.role==='bot'?'assistant':'user',content:m.text}));
        
        const res=await fetch("https://api.groq.com/openai/v1/chat/completions",{
            method:'POST',
            headers:{'Content-Type':'application/json','Authorization':`Bearer ${key}`},
            body:JSON.stringify({model:"llama-3.1-70b-versatile",messages:msg})
        });
        
        if(!res.ok)throw new Error("Ошибка API");
        const data=await res.json();
        if(data.error) throw new Error(data.error.message);
        
        addMessageToChat('bot',data.choices[0].message.content,activeChar.name,activeChar.color);
        chatCount++;
        if(chatCount%EAVESDROP_INTERVAL===0){const p=eavesdroppedPhrases[Math.floor(Math.random()*eavesdroppedPhrases.length)];setTimeout(()=>{addMessageToChat('bot',p,activeChar.name,activeChar.color);speakVerity(p);},2000);}
        if(Math.random()<0.2&&characters.length>1)setTimeout(()=>triggerInterruption(),2000);
    }catch(e){
        if(verityContainer.style.display==='block'){verityFace.classList.add('startled');speakVerity("Ой, я запуталась...");setTimeout(()=>verityFace.classList.remove('startled'),2000);}
        else alert("Ошибка ИИ: "+e.message);
    }finally{
        document.getElementById('mainLoader').style.display='none';
        if(verityFace){verityFace.style.transform='rotate(0deg)';setGlow(null);}
    }
}

async function triggerInterruption(){const o=characters.filter(c=>c.id!==activeChar.id);if(o.length===0)return;const inr=o[Math.floor(Math.random()*o.length)];const key=localStorage.getItem('cometa_api_key');if(!key)return;const oc=verityFace.style.background;verityFace.style.background=inr.color;verityFace.style.transform='scale(0.9)';setTimeout(()=>verityFace.style.transform='scale(1)',100);try{const tr=getBehaviorTraits(inr);const res=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${key}`},body:JSON.stringify({model:"llama-3.1-70b-versatile",messages:[{role:'system',content:`${inr.prompt} Особенности: ${tr} Только что ответил ${activeChar.name}. Вставь 1 предложение.`},{role:'user',content:"..."}]})});const data=await res.json();if(data.error)return;addMessageToChat('bot',data.choices[0].message.content,inr.name,inr.color);speakVerity(data.choices[0].message.content);}catch(e){}setTimeout(()=>{verityFace.style.background=oc;},3000);}

function toggleView(){isChatMode=!isChatMode;document.getElementById('chatContainer').style.display=isChatMode?'flex':'none';document.getElementById('scriptContainer').style.display=isChatMode?'none':'block';if(!isChatMode)generateScriptWithImages();closeModal('apiSettingsModal');}

async function generateScriptWithImages(){document.getElementById('mainLoader').style.display='block';let fh='';const sp=selectedGenre!=="Случайный"?`, стиль: ${selectedGenre}`:'';chatHistory.forEach((m,i)=>{fh+=`<p><strong>${m.speaker||(m.role==='user'?'Вы':'ИИ')}:</strong> ${m.text}</p>`;if((i+1)%10===0||i===0){const iu=`https://image.pollinations.ai/prompt/${encodeURIComponent(m.text.substring(0,100)+sp)}?width=1024&height=1024&nologo=true`;fh+=`<img src="${iu}" loading="lazy" onerror="this.style.display='none'">`;}});setTimeout(()=>{document.getElementById('scriptContainer').innerHTML=fh;document.getElementById('mainLoader').style.display='none';},1500);}

const genres={"Древние / Ритуальные":["Григорианский хорал","Знаменное пение","Византийская","Мадригал","Мотет","Шаманские ритмы","Суфийская каввали"],"Классика / Академическая":["Фуга","Токката","Симфония","Ноктюрн","Импрессионизм","Минимализм","Атональность","Электроакустика"],"Фольклор / Этника":["Русская народная","Кельтская (джига)","Фламенко","Индийская (рага)","Арабская (макам)","Африканские ритмы","Балканский фолк","Японская"],"Вокал":["Бельканто","Горловое пение","Йодль","Скэт","Битбокс","Плачи"],"Джаз / Блюз":["Дельта-блюз","Буги-вуги","Свинг","Бибоп","Кул-джаз","Фри-джаз","Босса-нова"],"Рок":["Рок-н-ролл","Психоделик","Прогрессив","Панк-рок","Готик-рок","Гранж","Шугейз","Мат-рок"],"Метал":["Хэви-метал","Трэш","Дэт-метал","Блэк-метал","Дум-метал","Фолк-метал","Металкор","Пост-метал"],"Поп / Эстрада":["Синти-поп","Европоп","Диско","K-pop","J-pop","Пауэр-баллада"],"Хип-хоп":["Old School","G-funk","Trap","Drill","Lo-fi hip-hop","Phonk","Cloud rap"],"Электроника":["Техно","Хаус","Транс","Драм-н-бейс","Дабстеп","IDM","Эмбиент","Synthwave","Hardstyle","Breakcore"],"Латина":["Регги","Ска","Сальса","Бачата","Кумбия","Самба"],"R&B / Соул":["Классический R&B","Neo-soul","Фанк","Go-go"],"Эксперимент":["Индастриал","Noise","Field recordings","Конкретная музыка"],"Кино / Игры":["Опера","Мюзикл","Саундтрек","Chiptune (8-bit)"]};

function renderGenres(){const c=document.getElementById('genreContainer');c.innerHTML='';for(const[cat,items]of Object.entries(genres)){const d=document.createElement('div');d.className='genre-category';d.innerText=cat;const l=document.createElement('div');l.className='genre-list';items.forEach(i=>{const it=document.createElement('div');it.className='genre-item';it.innerText=i;it.onclick=()=>{selectedGenre=i;setPrompt(`Создай сцену/музыку в стиле: ${i}.`);closeModal('genreModal');};l.appendChild(it);});d.onclick=()=>l.style.display=l.style.display==='block'?'none':'block';c.appendChild(d);c.appendChild(l);}}
renderGenres();document.getElementById('openGenreBtn').onclick=()=>document.getElementById('genreModal').style.display='flex';
function mixGenres(){let ag=[];for(const items of Object.values(genres))ag=ag.concat(items);ag=ag.filter(g=>g!=="Случайный");const g1=ag[Math.floor(Math.random()*ag.length)];let g2=ag[Math.floor(Math.random()*ag.length)];while(g1===g2)g2=ag[Math.floor(Math.random()*ag.length)];document.getElementById('aiPrompt').value=`Напиши сцену в стиле ${g1} + ${g2}.`;closeModal('genreModal');}

function renderLangs(f=""){const l=document.getElementById('langList');l.innerHTML='';const fl=allLangs.filter(x=>x.n.toLowerCase().includes(f.toLowerCase())||x.c.includes(f.toLowerCase()));if(fl.length===0)l.innerHTML='<div style="color:#888;text-align:center;grid-column:span 2;">Ничего не найдено</div>';else fl.forEach(x=>{const d=document.createElement('div');d.className='lang-item';d.innerText=x.n;d.onclick=()=>{selectedLanguage=x.c;selectedLanguageName=x.n;localStorage.setItem('cometa_language',x.c);localStorage.setItem('cometa_language_name',x.n);alert("Язык: "+x.n);closeModal('langModal');if(verityContainer.style.display==='block')speakVerity(getGreeting());};l.appendChild(d);});}
