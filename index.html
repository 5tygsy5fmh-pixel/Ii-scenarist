<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cometa AI Studio</title>
<style>
:root{
  --bg:#050505; --panel:#111; --panel-2:#1a1a1a; --border:#333;
  --green:#10b981; --blue:#3b82f6; --yellow:#ffd21e; --red:#ef4444;
  --text:#fff; --muted:#9ca3af;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Inter,system-ui,-apple-system,sans-serif;
  height:100dvh;display:flex;flex-direction:column;overflow:hidden;
}
button{font-family:inherit}
.topbar{
  display:flex;align-items:center;gap:8px;padding:10px 12px;
  background:#000;border-bottom:1px solid #222;z-index:20;flex-wrap:wrap;
}
.brand{
  font-weight:900;font-size:17px;
  background:linear-gradient(90deg,var(--green),var(--blue));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.spacer{flex:1}
.pill{
  background:var(--panel);border:1px solid var(--border);color:#ddd;
  border-radius:999px;padding:7px 11px;font-size:12px;font-weight:600;
  cursor:pointer;white-space:nowrap;transition:.2s;
}
.pill:hover{border-color:#555;background:#222}
.pill.ok{border-color:rgba(16,185,129,.5);color:#a7f3d0}
.pill.bad{border-color:rgba(239,68,68,.5);color:#fecaca}
.icon-btn{
  width:36px;height:36px;border-radius:50%;background:var(--panel);
  border:1px solid var(--border);color:#fff;cursor:pointer;font-size:15px;
  display:grid;place-items:center;transition:.2s;
}
.icon-btn:hover{background:#222}
.content-area{flex:1;overflow-y:auto;position:relative;scroll-behavior:smooth}
.chat-container{
  max-width:820px;margin:0 auto;padding:16px 14px 24px;
  display:flex;flex-direction:column;gap:14px;width:100%;
}
.message-row{display:flex;flex-direction:column}
.message-row.user{align-items:flex-end}
.message-row.bot{align-items:flex-start}
.message-bubble{
  max-width:86%;padding:12px 15px;border-radius:16px;font-size:15px;
  line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;
}
.message-row.user .message-bubble{background:var(--blue);border-bottom-right-radius:5px}
.message-row.bot .message-bubble{background:#222;border-bottom-left-radius:5px}
.speaker-name{display:block;font-size:11px;font-weight:800;margin-bottom:4px}
.message-actions{
  display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;
}
.action-link{
  background:#181818;border:1px solid #2e2e2e;color:#bbb;border-radius:999px;
  padding:5px 9px;font-size:11px;cursor:pointer;transition:.2s;
}
.action-link:hover{color:#fff;border-color:#444;background:#222}
.composer{
  border-top:1px solid var(--border);background:#0b0b0b;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
}
.quick-actions{
  display:flex;gap:8px;overflow-x:auto;max-width:820px;margin:0 auto 10px;
  padding-bottom:2px;scrollbar-width:none;
}
.quick-actions::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;background:var(--panel-2);border:1px solid var(--border);
  color:#ddd;border-radius:999px;padding:9px 13px;font-size:12.5px;
  font-weight:600;cursor:pointer;transition:.2s;
}
.chip:hover{border-color:var(--green);color:#fff}
.input-wrapper{
  display:flex;gap:8px;align-items:flex-end;max-width:820px;margin:0 auto;
  background:#1e1e1e;border:1px solid #3d3d3d;border-radius:18px;padding:6px;
}
textarea{
  flex:1;min-height:44px;max-height:140px;background:transparent;border:0;
  color:#fff;font-size:15px;padding:11px 12px;resize:none;outline:none;
  font-family:inherit;line-height:1.4;
}
.send-btn,.stop-btn{
  width:44px;height:44px;border:0;border-radius:13px;color:#fff;font-size:18px;
  cursor:pointer;display:grid;place-items:center;flex:0 0 auto;
}
.send-btn{background:linear-gradient(135deg,var(--green),#059669)}
.stop-btn{background:var(--red)}
.speak-btn{
  width:44px;height:44px;border:0;border-radius:13px;background:#333;
  color:#fff;font-size:17px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto;
}
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:1000;
  display:none;align-items:center;justify-content:center;padding:16px;
}
.modal.open{display:flex}
.modal-content{
  width:100%;max-width:460px;max-height:88dvh;overflow-y:auto;
  background:#151522;border:1px solid #333;border-radius:18px;padding:18px;
}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-header h3{margin:0;font-size:18px}
.input-field{
  width:100%;padding:12px;background:#000;border:1px solid #333;color:#fff;
  border-radius:10px;margin-bottom:12px;font-size:14px;
}
.btn{
  width:100%;padding:13px;border:0;border-radius:12px;font-weight:800;
  cursor:pointer;font-size:14px;margin-bottom:9px;
}
.btn-primary{background:linear-gradient(135deg,var(--green),#059669);color:#fff}
.btn-secondary{background:#333;color:#fff}
.btn-danger{background:var(--red);color:#fff}
.genre-category{
  background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:13px;margin-bottom:9px;cursor:pointer;font-weight:700;
}
.genre-list{display:none;padding:8px 0 2px}
.genre-item{
  background:#1d1d1d;border-radius:8px;padding:9px 11px;margin-bottom:6px;
  font-size:13.5px;color:#ccc;cursor:pointer;
}
.genre-item:hover{background:#2c2c2c;color:#fff}
.lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.lang-item{
  background:#161616;border:1px solid #262626;border-radius:9px;padding:10px;
  font-size:12.5px;text-align:center;cursor:pointer;
}
.lang-item:hover{border-color:var(--green)}
.toast-wrap{
  position:fixed;left:50%;bottom:110px;transform:translateX(-50%);
  z-index:3000;display:flex;flex-direction:column;gap:8px;align-items:center;
  pointer-events:none;width:min(92vw,420px);
}
.toast{
  background:#1f2937;border:1px solid #374151;color:#fff;padding:10px 15px;
  border-radius:12px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.5);
  animation:toastIn .2s ease;
}
.toast.success{border-color:rgba(16,185,129,.6)}
.toast.error{border-color:rgba(239,68,68,.6)}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#verityContainer{
  position:fixed;z-index:900;width:52px;height:52px;cursor:grab;touch-action:none;
}
.verity-face{
  width:52px;height:52px;background:var(--yellow);border-radius:50%;
  position:relative;box-shadow:0 5px 16px rgba(0,0,0,.45);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:background .3s,transform .3s,box-shadow .3s;
}
.verity-eye{width:6px;height:6px;background:#000;border-radius:50%;position:absolute;top:17px}
.verity-eye.left{left:14px}.verity-eye.right{right:14px}
.verity-mouth{width:17px;height:6px;background:#000;border-radius:0 0 10px 10px;position:absolute;bottom:13px}
.verity-face.talking .verity-mouth{animation:talk .18s infinite alternate}
@keyframes talk{from{height:6px}to{height:14px}}
.verity-face.sleeping{opacity:.6;animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.96)}50%{transform:scale(1)}}
.verity-face.startled{background:#ff5252!important;animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.verity-face.typing-pulse{animation:pulse 1.5s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,210,30,.65)}70%{box-shadow:0 0 0 15px rgba(255,210,30,0)}100%{box-shadow:0 0 0 0 rgba(255,210,30,0)}}
.verity-controls{
  position:absolute;top:56px;left:-20px;display:flex;gap:7px;opacity:0;transition:.25s;
}
#verityContainer:hover .verity-controls,
#verityContainer.active .verity-controls{opacity:1}
.v-btn{
  width:32px;height:32px;border-radius:50%;background:#111;border:1px solid var(--green);
  color:#fff;cursor:pointer;display:grid;place-items:center;font-size:13px;
}
.script-container{max-width:820px;margin:0 auto;padding:20px 16px;display:none;line-height:1.65;color:#ddd}
.script-container img{width:100%;border-radius:14px;margin:16px 0;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.loader{
  position:absolute;top:50%;left:50%;translate:-50% -50%;display:none;
  font-weight:800;color:var(--muted);font-size:14px;
}
.loader.show{display:block}
.drawer{
  position:fixed;top:0;left:0;bottom:0;width:min(86vw,330px);background:#0d0d0d;
  border-right:1px solid #262626;z-index:1200;transform:translateX(-105%);
  transition:transform .25s ease;padding:16px;overflow-y:auto;
}
.drawer.open{transform:none}
.drawer h3{margin:4px 0 14px}
.history-item{
  background:#161616;border:1px solid #262626;border-radius:11px;padding:11px;
  margin-bottom:8px;cursor:pointer;font-size:13px;
}
.history-item:hover{border-color:#3d3d3d}
@media(max-width:640px){
  .topbar{padding:8px}
  .brand{font-size:15px}
  .pill{font-size:11px;padding:6px 9px}
  .message-bubble{max-width:92%}
}
</style>
</head>
<body>

<header class="topbar">
  <button class="icon-btn" id="menuBtn" aria-label="История и меню">☰</button>
  <div class="brand">Cometa AI</div>
  <div class="spacer"></div>
  <button class="pill" id="characterPill" aria-label="Выбрать персонажа">Веррити ▾</button>
  <button class="pill" id="genrePill" aria-label="Выбрать стиль">Случайный ▾</button>
  <button class="pill" id="languagePill" aria-label="Выбрать язык">RU ▾</button>
  <button class="pill bad" id="apiStatusPill" aria-label="Статус GigaChat">GigaChat: не подключён</button>
  <button class="icon-btn" id="settingsBtn" aria-label="Настройки">⚙️</button>
</header>

<main class="content-area" id="contentArea">
  <div class="loader" id="mainLoader">Веррити придумывает…</div>
  <div class="chat-container" id="chatContainer"></div>
  <div class="script-container" id="scriptContainer"></div>
</main>

<footer class="composer">
  <div class="quick-actions">
    <button class="chip" data-prompt="script">📝 Сценарий</button>
    <button class="chip" data-prompt="song">🎵 Песня</button>
    <button class="chip" data-prompt="ideas">💡 Идеи</button>
    <button class="chip" data-prompt="rewrite">✍️ Переписать</button>
    <button class="chip" data-prompt="continue">➡️ Продолжить</button>
    <button class="chip" id="bookBtn">📖 Книга</button>
  </div>
  <div class="input-wrapper">
    <textarea id="aiPrompt" rows="1" aria-label="Сообщение для ИИ" placeholder="Опишите идею или задайте вопрос…"></textarea>
    <button class="speak-btn" id="speakBtn" aria-label="Озвучить последний ответ">🔊</button>
    <button class="send-btn" id="sendBtn" aria-label="Отправить сообщение">➤</button>
  </div>
</footer>

<aside class="drawer" id="historyDrawer" aria-label="История чатов">
  <h3>История</h3>
  <button class="btn btn-primary" id="newChatBtn">＋ Новый чат</button>
  <div id="historyList"></div>
</aside>

<div class="modal" id="settingsModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>⚙️ Настройки</h3>
      <button class="icon-btn" data-close="settingsModal" aria-label="Закрыть">✕</button>
    </div>
    <label class="pill" style="display:block;margin-bottom:12px">GigaChat Authorization Key</label>
    <input class="input-field" id="apiKeyInput" type="password" placeholder="Вставьте Authorization Key">
    <button class="btn btn-primary" id="saveKeyBtn">Сохранить ключ</button>
    <button class="btn btn-secondary" id="openGenresFromSettings">🎨 Стиль и жанры</button>
    <button class="btn btn-secondary" id="openLangsFromSettings">🌐 Язык</button>
    <button class="btn btn-secondary" id="openStudioFromSettings">🎭 Студия Веррити</button>
    <button class="btn btn-danger" id="clearChatBtn">🗑️ Очистить текущий чат</button>
  </div>
</div>

<div class="modal" id="genreModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>🎨 Стиль и жанры</h3>
      <button class="icon-btn" data-close="genreModal" aria-label="Закрыть">✕</button>
    </div>
    <button class="btn btn-primary" id="mixGenresBtn">🎲 Смешать жанры</button>
    <div id="genreContainer"></div>
  </div>
</div>

<div class="modal" id="langModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>🌐 Язык</h3>
      <button class="icon-btn" data-close="langModal" aria-label="Закрыть">✕</button>
    </div>
    <input class="input-field" id="langSearch" placeholder="Поиск языка…">
    <div class="lang-grid" id="langList"></div>
  </div>
</div>

<div class="modal" id="characterModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>🎭 Персонажи</h3>
      <button class="icon-btn" data-close="characterModal" aria-label="Закрыть">✕</button>
    </div>
    <div id="characterList" style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px"></div>
    <button class="btn btn-secondary" id="addCharacterBtn">➕ Добавить персонажа</button>
    <button class="btn btn-secondary" id="apocalypseBtn">🚨 Апокалипсис эфира</button>
  </div>
</div>

<div class="modal" id="verityChatModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>💬 Чат с Веррити</h3>
      <button class="icon-btn" data-close="verityChatModal" aria-label="Закрыть">✕</button>
    </div>
    <div id="verityChatHistory" style="height:220px;overflow:auto;background:#111;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px"></div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <input class="input-field" id="verityInput" style="margin:0" placeholder="Написать…">
      <button class="btn btn-primary" id="veritySendBtn" style="width:auto;padding:0 16px;margin:0">➤</button>
    </div>
  </div>
</div>

<div id="verityContainer" style="top:72%;left:78%">
  <div class="verity-face" id="verityFace">
    <div class="verity-eye left"></div><div class="verity-eye right"></div><div class="verity-mouth"></div>
  </div>
  <div class="verity-controls">
    <button class="v-btn" id="verityVoiceBtn" aria-label="Голосовой ввод">🎤</button>
    <button class="v-btn" id="verityChatBtn" aria-label="Открыть чат с Веррити">💬</button>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(key, fallback) {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch { return fallback; }
  },
  set(key, value) { localStorage.setItem(key, JSON.stringify(value)); }
};

const state = {
  genre: localStorage.getItem('cometa_genre') || 'Случайный',
  language: localStorage.getItem('cometa_language') || 'ru',
  languageName: localStorage.getItem('cometa_language_name') || 'Русский',
  chat: [],
  lastBotText: '',
  isSending: false,
  abortController: null,
  accessToken: null,
  tokenExpiresAt: 0,
  activeCharacterId: localStorage.getItem('cometa_character') || 'verity',
  characters: store.get('verityCharactersV3', [
    {id:'verity',name:'Веррити',gender:'male',ageGroup:'adult',color:'#FFD700',prompt:'Ты — Веррити, уверенный радиоведущий и креативный ИИ-помощник.',chance:.4},
    {id:'mini',name:'Мини',gender:'male',ageGroup:'child',color:'#FFA500',prompt:'Ты — Мини-Веррити, энергичный маленький напарник. Отвечай живо и с восторгом.',chance:.2},
    {id:'luna',name:'Луна',gender:'female',ageGroup:'adult',color:'#FFC0CB',prompt:'Ты — Луна, внимательная звукорежиссёрка. Замечаешь детали и создаёшь атмосферу.',chance:.25},
    {id:'pixie',name:'Пикси',gender:'female',ageGroup:'child',color:'#FFDAB9',prompt:'Ты — Пикси, добрая маленькая помощница.',chance:.15}
  ]),
  triggers: store.get('verityTriggers', [
    {phrase:'кот',response:'Мяу!'},
    {phrase:'спасибо',response:'Пожалуйста!'}
  ])
};

const genres = {
  'Текстовые жанры':['Фэнтези','Детектив','Фантастика','Ужасы','Любовный роман','Киберпанк','Нуар','Постапокалипсис','Приключения','Мистика'],
  'Музыкальные стили':['Рок','Поп','Джаз','Эмбиент','Хип-хоп','Техно','Классика','Синтвейв','Метал','Блюз']
};

const langStr = 'ru:Русский,en:English,uk:Українська,be:Беларуская,de:Deutsch,fr:Français,es:Español,pt:Português,it:Italiano,pl:Polski,cs:Čeština,sk:Slovenčina,bg:Български,sr:Српски,hr:Hrvatski,sl:Slovenščina,mk:Македонски,ro:Română,hu:Magyar,el:Ελληνικά,tr:Türkçe,az:Azərbaycan,kk:Қазақ,uz:Oʻzbek,ky:Кыргызча,tg:Тоҷикӣ,hy:Հայերեն,ka:ქართული,zh:简体中文,zh_tw:繁體中文,ja:日本語,ko:한국어,vi:Tiếng Việt,th:ไทย,id:Bahasa Indonesia,ms:Melayu,ar:العربية,he:עברית,fa:فارسی,hi:हिन्दी,bn:বাংলা,ta:தமிழ்,te:తెలుగు,ml:മലയാളം,ur:اردو,sv:Svenska,da:Dansk,no:Norsk,fi:Suomi,is:Íslenska,nl:Nederlands,csb:Kashubian,eo:Esperanto';
const allLangs = langStr.split(',').map(x => {
  const [code, ...name] = x.split(':');
  return { code, name: name.join(':') };
});

function toast(text, type='success') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = text;
  $('toastWrap').appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

function openModal(id) { $(id).classList.add('open'); }
function closeModal(id) { $(id).classList.remove('open'); }

document.querySelectorAll('[data-close]').forEach(btn => {
  btn.addEventListener('click', () => closeModal(btn.dataset.close));
});
document.querySelectorAll('.modal').forEach(modal => {
  modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });
});

function activeCharacter() {
  return state.characters.find(c => c.id === state.activeCharacterId) || state.characters[0];
}

function updatePills() {
  const char = activeCharacter();
  $('characterPill').textContent = `${char.name} ▾`;
  $('genrePill').textContent = `${state.genre} ▾`;
  $('languagePill').textContent = `${state.language.toUpperCase()} ▾`;
  const hasKey = !!localStorage.getItem('cometa_api_key');
  const pill = $('apiStatusPill');
  pill.textContent = hasKey ? 'GigaChat: готов' : 'GigaChat: не подключён';
  pill.classList.toggle('ok', hasKey);
  pill.classList.toggle('bad', !hasKey);
}

function buildSystemPrompt({ includeGenre = true, extra = '' } = {}) {
  const c = activeCharacter();
  const traits = [];
  traits.push(c.ageGroup === 'child' ? 'говорит быстро и эмоционально' : 'говорит ясно и уверенно');
  traits.push(c.gender === 'male' ? 'использует аналогии с техникой' : 'использует аналогии с природой');
  const genre = includeGenre && state.genre !== 'Случайный' ? ` Жанр: ${state.genre}.` : '';
  return `${c.prompt} Особенности: ${traits.join('; ')}. ВАЖНО: не придумывай бытовые драмы. Отвечай на языке: ${state.languageName}.${genre} ${extra}`;
}

async function getGigaToken() {
  const authKey = localStorage.getItem('cometa_api_key');
  if (!authKey) throw new Error('Сначала добавьте ключ GigaChat в настройках.');

  if (state.accessToken && Date.now() < state.tokenExpiresAt - 60_000) {
    return state.accessToken;
  }

  const res = await fetch('https://ngw.devices.sberbank.ru:9443/api/v2/oauth', {
    method:'POST',
    headers:{
      'Content-Type':'application/x-www-form-urlencoded',
      Accept:'application/json',
      RqUID: crypto.randomUUID(),
      Authorization:`Basic ${authKey}`
    },
    body:'scope=GIGACHAT_API_PERS'
  });

  if (!res.ok) throw new Error(`Ошибка авторизации GigaChat: HTTP ${res.status}`);
  const data = await res.json();
  state.accessToken = data.access_token;
  state.tokenExpiresAt = data.expires_at || Date.now() + 25 * 60 * 1000;
  return state.accessToken;
}

async function requestGiga(messages) {
  const token = await getGigaToken();
  const controller = new AbortController();
  state.abortController = controller;
  const timer = setTimeout(() => controller.abort(), 45000);

  try {
    const res = await fetch('https://api.giga.chat/v1/chat/completions', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', Authorization:`Bearer ${token}` },
      body: JSON.stringify({ model:'GigaChat', messages }),
      signal: controller.signal
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error?.message || `HTTP ${res.status}`);
    }

    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    return data.choices?.[0]?.message?.content || 'Пустой ответ модели.';
  } finally {
    clearTimeout(timer);
    state.abortController = null;
  }
}

function createMessageRow(message, index) {
  const row = document.createElement('div');
  row.className = `message-row ${message.role}`;

  const bubble = document.createElement('div');
  bubble.className = 'message-bubble';
  bubble.textContent = message.text;

  if (message.role === 'bot' && message.speaker) {
    const name = document.createElement('span');
    name.className = 'speaker-name';
    name.textContent = message.speaker;
    name.style.color = message.color || '#fff';
    bubble.prepend(name);
  }

  row.appendChild(bubble);

  if (message.role === 'bot') {
    const actions = document.createElement('div');
    actions.className = 'message-actions';

    const copy = document.createElement('button');
    copy.className = 'action-link';
    copy.textContent = '📋 Копировать';
    copy.addEventListener('click', async () => {
      await navigator.clipboard.writeText(message.text);
      toast('Скопировано');
    });

    const again = document.createElement('button');
    again.className = 'action-link';
    again.textContent = '🔄 Ещё вариант';
    again.addEventListener('click', () => regenerate(index));

    const shorter = document.createElement('button');
    shorter.className = 'action-link';
    shorter.textContent = '✂️ Короче';
    shorter.addEventListener('click', () => rewriteMessage(index, 'Сделай ответ значительно короче, сохрани смысл.'));

    actions.append(copy, again, shorter);
    row.appendChild(actions);
  }

  return row;
}

function renderChat() {
  const container = $('chatContainer');
  container.replaceChildren();
  state.chat.forEach((message, index) => container.appendChild(createMessageRow(message, index)));
  $('contentArea').scrollTop = $('contentArea').scrollHeight;
}

function addMessage(role, text, speaker = null, color = null) {
  state.chat.push({ role, text, speaker, color });
  if (role === 'bot') state.lastBotText = text;
  renderChat();
  saveCurrentChat();
}

function setSending(value) {
  state.isSending = value;
  const btn = $('sendBtn');
  btn.className = value ? 'stop-btn' : 'send-btn';
  btn.textContent = value ? '■' : '➤';
  btn.setAttribute('aria-label', value ? 'Остановить генерацию' : 'Отправить сообщение');
  $('mainLoader').classList.toggle('show', value);
}

function messagesForApi(extraSystem = '') {
  return [
    { role:'system', content: buildSystemPrompt({ extra: extraSystem }) },
    ...state.chat.map(m => ({ role: m.role === 'bot' ? 'assistant' : 'user', content: m.text }))
  ];
}

async function sendToApi() {
  if (state.isSending) return;
  setSending(true);

  try {
    const reply = await requestGiga(messagesForApi());
    addMessage('bot', reply, activeCharacter().name, activeCharacter().color);
    speak(reply);
  } catch (error) {
    if (error.name === 'AbortError') toast('Генерация остановлена', 'error');
    else {
      addMessage('bot', `Ошибка: ${error.message}`);
      toast(error.message, 'error');
    }
  } finally {
    setSending(false);
  }
}

async function regenerate(index) {
  if (state.isSending) return;
  state.chat = state.chat.slice(0, index);
  renderChat();
  setSending(true);
  try {
    const reply = await requestGiga(messagesForApi('Дай другой, более интересный вариант.'));
    addMessage('bot', reply, activeCharacter().name, activeCharacter().color);
    speak(reply);
  } catch (error) {
    toast(error.message, 'error');
  } finally {
    setSending(false);
  }
}

async function rewriteMessage(index, instruction) {
  if (state.isSending) return;
  const original = state.chat[index]?.text;
  if (!original) return;
  setSending(true);
  try {
    const reply = await requestGiga([
      { role:'system', content: buildSystemPrompt({ includeGenre:false }) },
      { role:'user', content:`Перепиши этот текст.\n\n${original}\n\nИнструкция: ${instruction}` }
    ]);
    state.chat[index].text = reply;
    state.lastBotText = reply;
    renderChat();
    saveCurrentChat();
    speak(reply);
  } catch (error) {
    toast(error.message, 'error');
  } finally {
    setSending(false);
  }
}

function checkTriggers(text) {
  const lower = text.toLowerCase();
  return state.triggers.find(t => lower.includes(t.phrase.toLowerCase()))?.response || null;
}

function sendMessage() {
  if (state.isSending) return;
  const input = $('aiPrompt');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  autoGrow(input);
  addMessage('user', text);

  const trigger = checkTriggers(text);
  if (trigger) {
    setTimeout(() => {
      addMessage('bot', trigger, activeCharacter().name, activeCharacter().color);
      speak(trigger);
    }, 350);
    return;
  }

  sendToApi();
}

function autoGrow(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 140) + 'px';
}

function speak(text) {
  if (!('speechSynthesis' in window) || !text) return;
  speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = state.language === 'ru' ? 'ru-RU' : 'en-US';
  const face = $('verityFace');
  utterance.onstart = () => face.classList.add('talking');
  utterance.onend = () => face.classList.remove('talking');
  speechSynthesis.speak(utterance);
}

function saveCurrentChat() {
  if (!state.chat.length) return;
  const chats = store.get('cometa_chats', []);
  const title = state.chat.find(m => m.role === 'user')?.text.slice(0, 48) || 'Новый чат';
  const existing = chats.find(c => c.id === state.currentChatId);

  if (existing) {
    existing.messages = state.chat;
    existing.updatedAt = Date.now();
  } else {
    state.currentChatId = 'chat_' + Date.now();
    chats.unshift({
      id: state.currentChatId,
      title,
      updatedAt: Date.now(),
      messages: state.chat
    });
  }

  store.set('cometa_chats', chats.slice(0, 30));
  renderHistory();
}

function renderHistory() {
  const chats = store.get('cometa_chats', []);
  const list = $('historyList');
  list.replaceChildren();

  if (!chats.length) {
    const empty = document.createElement('div');
    empty.textContent = 'Пока нет сохранённых чатов.';
    empty.style.color = '#777';
    list.appendChild(empty);
    return;
  }

  chats.forEach(chat => {
    const item = document.createElement('div');
    item.className = 'history-item';
    item.textContent = chat.title;
    item.addEventListener('click', () => {
      state.currentChatId = chat.id;
      state.chat = chat.messages || [];
      renderChat();
      $('historyDrawer').classList.remove('open');
      toast('Чат открыт');
    });
    list.appendChild(item);
  });
}

function renderGenres() {
  const container = $('genreContainer');
  container.replaceChildren();

  Object.entries(genres).forEach(([category, items]) => {
    const cat = document.createElement('div');
    cat.className = 'genre-category';
    cat.textContent = category;

    const list = document.createElement('div');
    list.className = 'genre-list';

    items.forEach(genre => {
      const item = document.createElement('div');
      item.className = 'genre-item';
      item.textContent = genre;
      item.addEventListener('click', () => {
        state.genre = genre;
        localStorage.setItem('cometa_genre', genre);
        updatePills();
        closeModal('genreModal');
        toast(`Стиль выбран: ${genre}`);
      });
      list.appendChild(item);
    });

    cat.addEventListener('click', () => {
      list.style.display = list.style.display === 'block' ? 'none' : 'block';
    });

    container.append(cat, list);
  });
}

function renderLangs(filter = '') {
  const list = $('langList');
  list.replaceChildren();
  const query = filter.toLowerCase();

  allLangs
    .filter(lang => lang.name.toLowerCase().includes(query) || lang.code.includes(query))
    .forEach(lang => {
      const item = document.createElement('div');
      item.className = 'lang-item';
      item.textContent = lang.name;
      item.addEventListener('click', () => {
        state.language = lang.code;
        state.languageName = lang.name;
        localStorage.setItem('cometa_language', lang.code);
        localStorage.setItem('cometa_language_name', lang.name);
        updatePills();
        closeModal('langModal');
        toast(`Язык: ${lang.name}`);
      });
      list.appendChild(item);
    });
}

function renderCharacters() {
  const list = $('characterList');
  list.replaceChildren();

  state.characters.forEach(character => {
    const el = document.createElement('button');
    el.className = 'pill';
    el.style.background = character.color;
    el.style.color = '#000';
    el.style.border = character.id === state.activeCharacterId ? '2px solid #fff' : '1px solid #0003';
    el.textContent = character.name;
    el.addEventListener('click', () => {
      state.activeCharacterId = character.id;
      localStorage.setItem('cometa_character', character.id);
      $('verityFace').style.background = character.color;
      updatePills();
      renderCharacters();
      toast(`Выбран: ${character.name}`);
    });
    list.appendChild(el);
  });
}

function renderVerityChat(text, role) {
  const box = $('verityChatHistory');
  const bubble = document.createElement('div');
  bubble.style.cssText = `padding:8px 10px;border-radius:10px;font-size:13px;max-width:85%;white-space:pre-wrap;${role === 'user' ? 'align-self:flex-end;background:#3b82f6;color:#fff' : 'align-self:flex-start;background:#333'}`;
  bubble.textContent = text;
  box.appendChild(bubble);
  box.scrollTop = box.scrollHeight;
}

async function processVerityRequest(text) {
  renderVerityChat(text, 'user');

  const trigger = checkTriggers(text);
  if (trigger) {
    renderVerityChat(trigger, 'bot');
    speak(trigger);
    return;
  }

  const loading = document.createElement('div');
  loading.textContent = 'Думает…';
  loading.style.cssText = 'font-size:12px;color:#999;font-style:italic';
  $('verityChatHistory').appendChild(loading);

  try {
    const reply = await requestGiga([
      { role:'system', content: buildSystemPrompt({ includeGenre:false }) },
      { role:'user', content:text }
    ]);
    loading.remove();
    renderVerityChat(reply, 'bot');
    speak(reply);
  } catch (error) {
    loading.remove();
    renderVerityChat(`Ошибка: ${error.message}`, 'bot');
    toast(error.message, 'error');
  }
}

async function generateBook() {
  if (!state.chat.length) {
    toast('Сначала создайте диалог', 'error');
    return;
  }

  setSending(true);
  const container = $('scriptContainer');
  container.replaceChildren();
  container.style.display = 'block';
  $('chatContainer').style.display = 'none';

  const heading = document.createElement('h2');
  heading.textContent = `Жанр: ${state.genre}`;
  heading.style.color = 'var(--green)';
  container.appendChild(heading);

  const total = state.chat.length;
  const step = total > 100 ? 100 : total > 10 ? 10 : 1;
  const styleSuffix = state.genre !== 'Случайный' ? `, стиль: ${state.genre}` : '';

  state.chat.forEach((message, index) => {
    const paragraph = document.createElement('p');
    const author = document.createElement('strong');
    author.textContent = `${message.speaker || (message.role === 'user' ? 'Вы' : 'ИИ')}: `;
    paragraph.appendChild(author);
    paragraph.appendChild(document.createTextNode(message.text));
    container.appendChild(paragraph);

    if (index === 0 || index % step === 0) {
      const image = document.createElement('img');
      image.loading = 'lazy';
      image.alt = 'Иллюстрация к сцене';
      image.src = `https://image.pollinations.ai/prompt/${encodeURIComponent(message.text.slice(0, 120) + styleSuffix)}?width=1024&height=1024&nologo=true`;
      image.addEventListener('error', () => image.remove());
      container.appendChild(image);
    }
  });

  setSending(false);
  toast('Книга готова');
}

const promptTemplates = {
  script: () => `Напиши сценарий короткометражки в жанре «${state.genre}». Тема: `,
  song: () => `Создай текст песни в стиле «${state.genre}». Тема: `,
  ideas: () => `Придумай 10 нестандартных идей в жанре «${state.genre}» на тему: `,
  rewrite: () => 'Перепиши последний ответ: сделай его яснее, живее и полезнее.',
  continue: () => 'Продолжи предыдущий ответ естественно и по делу.'
};

$('sendBtn').addEventListener('click', () => {
  if (state.isSending) {
    state.abortController?.abort();
    return;
  }
  sendMessage();
});

$('aiPrompt').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
$('aiPrompt').addEventListener('input', e => {
  autoGrow(e.target);
  $('verityFace').classList.add('typing-pulse');
  clearTimeout(window.__typingTimer);
  window.__typingTimer = setTimeout(() => $('verityFace').classList.remove('typing-pulse'), 1200);
});

document.querySelectorAll('.chip[data-prompt]').forEach(chip => {
  chip.addEventListener('click', () => {
    const input = $('aiPrompt');
    input.value = promptTemplates[chip.dataset.prompt]();
    input.focus();
    autoGrow(input);
  });
});

$('bookBtn').addEventListener('click', generateBook);
$('speakBtn').addEventListener('click', () => speak(state.lastBotText));
$('menuBtn').addEventListener('click', () => $('historyDrawer').classList.toggle('open'));
$('newChatBtn').addEventListener('click', () => {
  state.currentChatId = null;
  state.chat = [];
  renderChat();
  $('historyDrawer').classList.remove('open');
  $('scriptContainer').style.display = 'none';
  $('chatContainer').style.display = 'flex';
  toast('Новый чат создан');
});
$('settingsBtn').addEventListener('click', () => {
  $('apiKeyInput').value = localStorage.getItem('cometa_api_key') || '';
  openModal('settingsModal');
});
$('saveKeyBtn').addEventListener('click', () => {
  const key = $('apiKeyInput').value.trim();
  if (key.length < 10) return toast('Ключ слишком короткий', 'error');
  localStorage.setItem('cometa_api_key', key);
  state.accessToken = null;
  state.tokenExpiresAt = 0;
  updatePills();
  toast('Ключ сохранён');
  closeModal('settingsModal');
});
$('clearChatBtn').addEventListener('click', () => {
  state.chat = [];
  renderChat();
  closeModal('settingsModal');
  toast('Чат очищен');
});
$('characterPill').addEventListener('click', () => { renderCharacters(); openModal('characterModal'); });
$('genrePill').addEventListener('click', () => openModal('genreModal'));
$('languagePill').addEventListener('click', () => { renderLangs(); openModal('langModal'); });
$('apiStatusPill').addEventListener('click', () => {
  $('apiKeyInput').value = localStorage.getItem('cometa_api_key') || '';
  openModal('settingsModal');
});
$('openGenresFromSettings').addEventListener('click', () => { closeModal('settingsModal'); openModal('genreModal'); });
$('openLangsFromSettings').addEventListener('click', () => { closeModal('settingsModal'); renderLangs(); openModal('langModal'); });
$('openStudioFromSettings').addEventListener('click', () => { closeModal('settingsModal'); renderCharacters(); openModal('characterModal'); });
$('mixGenresBtn').addEventListener('click', () => {
  const all = Object.values(genres).flat();
  if (all.length < 2) return;
  const a = all[Math.floor(Math.random() * all.length)];
  let b = all[Math.floor(Math.random() * all.length)];
  while (b === a) b = all[Math.floor(Math.random() * all.length)];
  state.genre = `${a} + ${b}`;
  localStorage.setItem('cometa_genre', state.genre);
  updatePills();
  closeModal('genreModal');
  toast(`Случайный стиль: ${state.genre}`);
});
$('addCharacterBtn').addEventListener('click', () => {
  const name = prompt('Имя персонажа:');
  if (!name) return;
  const color = prompt('Цвет в HEX:', '#9c27b0') || '#9c27b0';
  const promptText = prompt('Характер:', 'Дружелюбный и любопытный помощник.') || 'Дружелюбный помощник.';
  state.characters.push({
    id: name.toLowerCase().replace(/\s+/g, '-') + '-' + Date.now(),
    name, gender:'male', ageGroup:'adult', color, prompt:promptText, chance:.1
  });
  store.set('verityCharactersV3', state.characters);
  renderCharacters();
  toast('Персонаж добавлен');
});
$('apocalypseBtn').addEventListener('click', () => {
  const phrases = ['Внимание! Налоговая требует лицензию!', 'Моё имущество арестовано!', 'Суд постановил: эфир прекращён!', 'Переходим на аналоговый сигнал!'];
  const phrase = phrases[Math.floor(Math.random() * phrases.length)];
  $('verityFace').classList.add('startled');
  addMessage('bot', phrase, activeCharacter().name, activeCharacter().color);
  speak(phrase);
  setTimeout(() => $('verityFace').classList.remove('startled'), 1500);
  closeModal('characterModal');
});
$('verityChatBtn').addEventListener('click', () => openModal('verityChatModal'));
$('veritySendBtn').addEventListener('click', () => {
  const input = $('verityInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  processVerityRequest(text);
});
$('verityInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); $('veritySendBtn').click(); }
});
$('verityVoiceBtn').addEventListener('click', () => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return toast('Распознавание речи недоступно', 'error');
  const recognition = new SR();
  recognition.lang = state.language === 'ru' ? 'ru-RU' : 'en-US';
  recognition.onresult = e => processVerityRequest(e.results[0][0].transcript);
  recognition.start();
  toast('Слушаю…');
});

$('langSearch').addEventListener('input', e => renderLangs(e.target.value));

let dragOffset = { x:0, y:0 }, isDragging = false;
const verity = $('verityContainer');

function startDrag(e) {
  const point = e.touches?.[0] || e;
  const rect = verity.getBoundingClientRect();
  dragOffset = { x: point.clientX - rect.left, y: point.clientY - rect.top };
  isDragging = false;
  document.addEventListener('mousemove', drag);
  document.addEventListener('touchmove', drag, { passive:false });
  document.addEventListener('mouseup', stopDrag);
  document.addEventListener('touchend', stopDrag);
}
function drag(e) {
  e.preventDefault();
  isDragging = true;
  const point = e.touches?.[0] || e;
  verity.style.left = (point.clientX - dragOffset.x) + 'px';
  verity.style.top = (point.clientY - dragOffset.y) + 'px';
}
function stopDrag() {
  document.removeEventListener('mousemove', drag);
  document.removeEventListener('touchmove', drag);
  document.removeEventListener('mouseup', stopDrag);
  document.removeEventListener('touchend', stopDrag);
}
verity.addEventListener('mousedown', startDrag);
verity.addEventListener('touchstart', startDrag, { passive:true });

$('verityFace').addEventListener('click', () => {
  if (isDragging) return;
  $('verityFace').classList.add('startled');
  speak('Хи-хи! Щекотно.');
  setTimeout(() => $('verityFace').classList.remove('startled'), 800);
});

renderGenres();
renderLangs();
renderHistory();
updatePills();
renderCharacters();
$('verityFace').style.background = activeCharacter().color;
addMessage('bot', 'Привет! Я Cometa AI. Добавьте ключ GigaChat в ⚙️, выберите стиль — и начнём.', 'Cometa', '#10b981');
</script>
</body>
</html>
