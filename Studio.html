<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cometa AI Studio</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body { margin: 0; padding: 0; background-color: #050505; color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); }
        * { box-sizing: border-box; }
        
        .header { display: flex; align-items: center; justify-content: space-between; padding: 10px 15px; background: #000; border-bottom: 1px solid #222; z-index: 10; }
        .logo { font-weight: 900; font-size: 18px; background: linear-gradient(90deg, #10b981, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-controls { display: flex; gap: 6px; align-items: center; }
        .icon-btn { background: #111; border: 1px solid #333; color: #fff; padding: 8px; border-radius: 50%; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; }
        
        /* ЭКРАН ВХОДА И ЛОАДЕР */
        #loginScreen { display: none; position: fixed; inset: 0; z-index: 2000; background: #fbc02d; align-items: center; justify-content: center; flex-direction: column; overflow: hidden; }
        #loginScreen::before { content: ''; position: absolute; width: 200vw; height: 200vh; background: repeating-conic-gradient(from 0deg, rgba(255,255,255,0.4) 0deg 15deg, transparent 15deg 30deg); animation: rotateRays 30s linear infinite; }
        @keyframes rotateRays { 100% { transform: rotate(360deg); } }
        .login-box { position: relative; z-index: 2; width: 280px; height: 200px; background: #dca25c; border: 12px solid #3e2723; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .box-inner { width: 100%; height: 100%; display: flex; position: relative; overflow: hidden; }
        .box-left { width: 50%; height: 100%; background: #e8c452; border-right: 4px solid #b87e3a; display: flex; align-items: center; justify-content: center; }
        .box-right { width: 50%; height: 100%; background: #dca25c; display: flex; align-items: center; justify-content: center; position: relative; }
        .red-mark-top { position: absolute; top: 15px; right: 15px; width: 30px; height: 20px; border-top: 4px solid #e57373; border-right: 4px solid #e57373; border-radius: 0 5px 0 0; }
        .red-mark-bottom { position: absolute; bottom: 15px; right: 15px; width: 30px; height: 20px; border-bottom: 4px solid #e57373; border-right: 4px solid #e57373; border-radius: 0 0 5px 0; }
        .red-exclamation { font-size: 40px; font-weight: 900; color: #e57373; margin-right: 20px; }
        .broken-glass-svg { width: 50px; height: 50px; fill: #3e2723; }
        .skip-btn { position: absolute; top: 20px; right: 20px; z-index: 2; background: rgba(0,0,0,0.2); color: #000; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; }

        /* ТВОЙ ЛОАДЕР */
        #mainLoader { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 120px; height: 120px; display: none; z-index: 100; }
        .loader-track { fill: none; stroke: #151515; stroke-width: 8; stroke-linecap: round; }
        .loader-anim { fill: none; stroke: url(#gradient); stroke-width: 8; stroke-linecap: round; stroke-dasharray: 350; stroke-dashoffset: 350; animation: loadDraw 3.5s linear infinite; }
        .loader-text { fill: #fff; font-family: 'Inter', sans-serif; font-weight: 900; font-size: 36px; text-anchor: middle; opacity: 0.9; }
        @keyframes loadDraw { 0% { stroke-dashoffset: 350; } 100% { stroke-dashoffset: 0; } }

        /* ВЕРРИТИ */
        #verityContainer { display: none; position: fixed; z-index: 3000; width: 50px; height: 50px; cursor: grab; touch-action: none; }
        .verity-face { width: 50px; height: 50px; background: #ffd21e; border-radius: 50%; position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.4); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: background 0.3s, transform 0.3s; }
        .verity-eye { width: 6px; height: 6px; background: #000; border-radius: 50%; position: absolute; top: 16px; }
        .verity-eye.left { left: 13px; } .verity-eye.right { right: 13px; }
        .verity-mouth { width: 16px; height: 6px; background: #000; border-radius: 0 0 10px 10px; position: absolute; bottom: 12px; transition: height 0.2s; }
        .verity-face.talking .verity-mouth { animation: talk 0.2s infinite alternate; }
        @keyframes talk { 0% { height: 6px; } 100% { height: 14px; } }
        .verity-face.sleeping { opacity: 0.6; transform: scale(0.95); }
        .verity-face.angry { background: #ff5252 !important; }
        .verity-controls { position: absolute; top: 55px; left: -35px; display: flex; gap: 8px; opacity: 0; transition: 0.3s; }
        #verityContainer:hover .verity-controls, #verityContainer.active .verity-controls { opacity: 1; }
        .v-btn { width: 30px; height: 30px; background: #111; border: 1px solid #10b981; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; font-size: 14px; }

        /* ОСНОВНОЙ КОНТЕНТ */
        .content-area { flex: 1; background: #0a0a0a; display: flex; flex-direction: column; overflow-y: auto; position: relative; padding-bottom: 20px; }
        
        /* МЕНЮ НАСТРОЙКИ РОЛИ */
        #setupScreen { display: flex; flex-direction: column; padding: 20px; max-width: 800px; margin: 0 auto; width: 100%; height: 100%; justify-content: center; }
        .setup-title { font-size: 24px; font-weight: 900; margin-bottom: 20px; text-align: center; color: #10b981; }
        .setup-group { margin-bottom: 15px; }
        .setup-group label { display: block; font-size: 13px; color: #aaa; margin-bottom: 5px; font-weight: bold; }
        .setup-group textarea { width: 100%; height: 80px; background: #111; border: 1px solid #333; border-radius: 12px; color: #fff; padding: 12px; font-size: 14px; resize: none; outline: none; }
        .setup-group textarea:focus { border-color: #3b82f6; }
        .btn-start { width: 100%; padding: 15px; background: linear-gradient(135deg, #3b82f6, #2563eb); border: none; border-radius: 12px; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }

        /* ЧАТ */
        #chatContainer { display: none; padding: 15px; flex-direction: column; gap: 15px; max-width: 800px; margin: 0 auto; width: 100%; }
        .message-row { display: flex; flex-direction: column; width: 100%; margin-bottom: 10px; }
        .message-row.user { align-items: flex-end; }
        .message-row.bot { align-items: flex-start; }
        .message-bubble { max-width: 85%; padding: 12px 16px; border-radius: 16px; font-size: 15px; line-height: 1.5; word-wrap: break-word; }
        .message-row.user .message-bubble { background: #3b82f6; color: #fff; border-bottom-right-radius: 4px; }
        .message-row.bot .message-bubble { background: #222; color: #eee; border-bottom-left-radius: 4px; }
        .message-actions { margin-top: 5px; font-size: 12px; color: #888; cursor: pointer; display: none; }
        .message-row.bot .message-actions { display: block; } /* Кнопка только под ботом */

        /* КНИГА */
        #bookContainer { display: none; padding: 20px; max-width: 800px; margin: 0 auto; width: 100%; }
        #bookContainer img { width: 100%; border-radius: 12px; margin: 15px 0; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        #bookContainer p { line-height: 1.6; margin-bottom: 15px; color: #ddd; }

        /* НИЖНЯЯ ПАНЕЛЬ */
        .control-panel { background: #111; border-top: 1px solid #333; padding: 10px 15px; }
        .tool-tabs { display: flex; gap: 5px; margin-bottom: 10px; overflow-x: auto; }
        .tab-btn { background: #1a1a1a; border: 1px solid #333; color: #aaa; padding: 8px 15px; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer; white-space: nowrap; }
        .tab-btn.active { background: #3b82f6; color: #fff; border-color: #3b82f6; }
        
        .sub-tools { display: none; gap: 8px; margin-bottom: 10px; overflow-x: auto; }
        .sub-tools.active { display: flex; }
        .sub-btn { background: #222; border: 1px solid #444; color: #ccc; padding: 6px 12px; border-radius: 10px; font-size: 12px; cursor: pointer; white-space: nowrap; }
        .sub-btn:hover { background: #333; }
        
        .input-wrapper { display: flex; gap: 10px; align-items: flex-end; max-width: 800px; margin: 0 auto; }
        textarea { flex: 1; height: 50px; background: #000; border: 1px solid #333; border-radius: 12px; color: #fff; padding: 14px; font-size: 15px; resize: none; outline: none; }
        .send-btn { width: 50px; height: 50px; background: linear-gradient(135deg, #10b981, #059669); border: none; border-radius: 12px; color: #fff; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* МОДАЛКИ */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 4000; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(5px); }
        .modal-content { background: #1a1a2e; border-radius: 16px; padding: 20px; width: 100%; max-width: 450px; max-height: 85vh; overflow-y: auto; border: 1px solid #333; }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 18px; font-weight: bold; }
        .input-field { width: 100%; padding: 12px; background: #000; border: 1px solid #333; border-radius: 8px; color: #fff; margin-bottom: 15px; font-size: 14px; }
        .btn-primary { width: 100%; padding: 15px; background: linear-gradient(135deg, #10b981, #059669); border: none; border-radius: 12px; color: #fff; font-size: 15px; font-weight: 800; cursor: pointer; margin-bottom: 10px; }
        .btn-secondary { width: 100%; padding: 12px; background: #333; border: none; border-radius: 12px; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 10px; }
        .help-box { background: rgba(16, 185, 129, 0.1); border-left: 4px solid #10b981; padding: 10px; margin-bottom: 15px; font-size: 13px; line-height: 1.5; color: #ddd; display: none; border-radius: 4px; }
        
        .lang-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .lang-item { padding: 10px; background: #111; border-radius: 8px; cursor: pointer; border: 1px solid #222; font-size: 13px; text-align: center; }
    </style>
</head>
<body>

    <div id="loginScreen">
        <button class="skip-btn" onclick="closeLoginScreen()">Пропустить</button>
        <div class="login-box" onclick="summonVerity()">
            <div class="box-inner">
                <div class="box-left">
                    <svg class="broken-glass-svg" viewBox="0 0 24 24"><path d="M6 2h12l-1 10a5 5 0 0 1-10 0L6 2z" /><path d="M12 12v8" /><path d="M8 22h8" /><path d="M8 6l8 6" stroke="#e8c452" stroke-width="2"/></svg>
                </div>
                <div class="box-right"><div class="red-mark-top"></div><div class="red-exclamation">!</div><div class="red-mark-bottom"></div></div>
            </div>
        </div>
    </div>

    <div id="verityContainer" style="top: 70%; left: 80%;">
        <div class="verity-face" id="verityFace"><div class="verity-eye left"></div><div class="verity-eye right"></div><div class="verity-mouth"></div></div>
        <div class="verity-controls">
            <div class="v-btn" onclick="startVoiceInput()">🎤</div>
            <div class="v-btn" onclick="playRadio()">📻</div>
        </div>
    </div>

    <div class="header">
        <div class="logo">Cometa AI</div>
        <div class="header-controls">
            <button class="icon-btn" id="openApiSettingsBtn">🔑</button>
            <button class="icon-btn" id="openLangBtn">🌐</button>
            <button class="icon-btn" onclick="document.getElementById('loginScreen').style.display = 'flex'">☰</button>
        </div>
    </div>

    <div class="content-area" id="contentArea">
        
        <!-- ЛОАДЕР -->
        <svg id="mainLoader" viewBox="0 0 100 100">
            <defs>
                <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#4b74ff" /><stop offset="100%" stop-color="#51d5a7" />
                </linearGradient>
            </defs>
            <path class="loader-track" d="M 25 10 L 80 10 A 15 15 0 0 1 95 25 L 95 75 A 15 15 0 0 1 80 90 L 25 90 A 15 15 0 0 1 10 75 L 10 25 A 15 15 0 0 1 25 10 Z" />
            <path class="loader-anim" d="M 25 10 L 80 10 A 15 15 0 0 1 95 25 L 95 75 A 15 15 0 0 1 80 90 L 25 90 A 15 15 0 0 1 10 75 L 10 25 A 15 15 0 0 1 25 10 Z" />
            <text x="50" y="62" class="loader-text">AI</text>
        </svg>

        <!-- МЕНЮ НАСТРОЙКИ -->
        <div id="setupScreen">
            <div class="setup-title">Настройка роли</div>
            <div class="setup-group">
                <label>Фон и вступление</label>
                <textarea id="setupBackground" placeholder="Например: Ты - дерзкий киберпанк-хакер. Мы в баре..."></textarea>
            </div>
            <div class="setup-group">
                <label>Приветствие бота</label>
                <textarea id="setupGreeting" placeholder="Например: *поправляя очки* Ну что, готов взломать корпорацию?"></textarea>
            </div>
            <button class="btn-start" onclick="startRoleplay()">Начать общение</button>
        </div>

        <div id="chatContainer"></div>
        <div id="bookContainer"></div>
    </div>

    <div class="control-panel">
        <div class="tool-tabs">
            <button class="tab-btn active" onclick="switchTool('chat', this)">💬 Чат с ИИ</button>
            <button class="tab-btn" onclick="switchTool('writer', this)">✍️ Писатель</button>
            <button class="tab-btn" onclick="switchTool('music', this)">🎼 Музыка</button>
        </div>

        <!-- ЧАТ -->
        <div class="sub-tools active" id="sub-tools-chat">
            <button class="sub-btn" onclick="insertPrompt('threeAngles')">🎭 3 угла</button>
            <button class="sub-btn" onclick="resetToSetup()" style="color:#ef4444; border-color:#ef4444;">🗑️ Очистить чат</button>
            <button class="sub-btn" onclick="convertToBook()">📖 Перевести в книгу</button>
        </div>

        <!-- ПИСАТЕЛЬ -->
        <div class="sub-tools" id="sub-tools-writer">
            <button class="sub-btn" onclick="generatePrompt('writer', 'Фэнтези')">🐉 Фэнтези</button>
            <button class="sub-btn" onclick="generatePrompt('writer', 'Детектив')">🕵️ Детектив</button>
            <button class="sub-btn" onclick="generatePrompt('writer', 'Фантастика')">🚀 Фантастика</button>
            <button class="sub-btn" onclick="generatePrompt('writer', 'Ужасы')">👻 Ужасы</button>
            <button class="sub-btn" onclick="generatePrompt('writer', 'Любовный роман')">❤️ Роман</button>
        </div>

        <!-- МУЗЫКА -->
        <div class="sub-tools" id="sub-tools-music">
            <button class="sub-btn" onclick="generatePrompt('music', 'Рок')">🎸 Рок</button>
            <button class="sub-btn" onclick="generatePrompt('music', 'Поп')">🎤 Поп</button>
            <button class="sub-btn" onclick="generatePrompt('music', 'Джаз')">🎷 Джаз</button>
            <button class="sub-btn" onclick="generatePrompt('music', 'Эмбиент')">🌌 Эмбиент</button>
            <button class="sub-btn" onclick="generatePrompt('music', 'Хип-хоп')">🎧 Хип-хоп</button>
        </div>

        <div class="input-wrapper">
            <textarea id="aiPrompt" placeholder="Напиши сообщение..." rows="1" onkeypress="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(); }"></textarea>
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <div class="modal" id="apiSettingsModal">
        <div class="modal-content">
            <div class="modal-header"><span>🔑 API Ключ (NVIDIA)</span><button onclick="closeModal('apiSettingsModal')" style="background:none;border:none;color:#fff;">✕</button></div>
            <input type="password" id="apiKeyInput" class="input-field" placeholder="nvapi-...">
            <div style="display:flex; gap:10px; margin-bottom:10px;">
                <button class="btn-primary" onclick="saveApiKey()" style="margin:0;">Сохранить</button>
                <button class="btn-secondary" onclick="toggleHelp()" style="margin:0; flex:0.5; background:#3b82f6;">Помощь 🤖</button>
            </div>
            <div class="help-box" id="helpBox">
                <b>Где взять ключ NVIDIA?</b><br><br>
                1. Зайди на <b>build.nvidia.com</b>.<br>
                2. Войди через Google.<br>
                3. В правом верхнем углу нажми <b>API Keys</b>.<br>
                4. Создай ключ и скопируй его (начинается на <b>nvapi-</b>).
            </div>
        </div>
    </div>

    <div class="modal" id="langModal">
        <div class="modal-content">
            <div class="modal-header"><span>🌐 Языки</span><button onclick="closeModal('langModal')" style="background:none;border:none;color:#fff;">✕</button></div>
            <div id="langList" class="lang-grid"></div>
        </div>
    </div>

    <script>
        window.onerror = function(msg) { console.warn("Ошибка JS: ", msg); return true; };
        let chatHistory = [];
        let selectedLanguage = 'ru';
        let systemPrompt = "";
        let firstGreeting = "";

        let verityContainer = document.getElementById('verityContainer');
        let verityFace = document.getElementById('verityFace');
        let idleTimer;

        function closeLoginScreen() { document.getElementById('loginScreen').style.display = 'none'; }
        function summonVerity() {
            closeLoginScreen();
            verityContainer.style.display = 'block';
            speakVerity("Привет! Настрой меня в меню и давай начнем!");
            resetIdle();
        }

        function resetIdle() {
            clearTimeout(idleTimer);
            verityFace.classList.remove('sleeping');
            idleTimer = setTimeout(() => {
                if(verityContainer.style.display === 'block') {
                    verityFace.classList.add('sleeping');
                    speakVerity("Я вздремну...");
                }
            }, 180000);
        }

        let isDragging = false, offsetX, offsetY;
        verityContainer.addEventListener('mousedown', (e) => startDrag(e));
        verityContainer.addEventListener('touchstart', (e) => startDrag(e), {passive: false});
        function startDrag(e) {
            isDragging = false;
            let cx = e.touches ? e.touches[0].clientX : e.clientX;
            let cy = e.touches ? e.touches[0].clientY : e.clientY;
            offsetX = cx - verityContainer.getBoundingClientRect().left;
            offsetY = cy - verityContainer.getBoundingClientRect().top;
            document.addEventListener('mousemove', drag);
            document.addEventListener('touchmove', drag, {passive: false});
            document.addEventListener('mouseup', stopDrag);
            document.addEventListener('touchend', stopDrag);
        }
        function drag(e) {
            e.preventDefault(); isDragging = true; resetIdle();
            let cx = e.touches ? e.touches[0].clientX : e.clientX;
            let cy = e.touches ? e.touches[0].clientY : e.clientY;
            verityContainer.style.left = (cx - offsetX) + 'px';
            verityContainer.style.top = (cy - offsetY) + 'px';
        }
        function stopDrag() {
            document.removeEventListener('mousemove', drag);
            document.removeEventListener('touchmove', drag);
            document.removeEventListener('mouseup', stopDrag);
            document.removeEventListener('touchend', stopDrag);
        }

        function speakVerity(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                const u = new SpeechSynthesisUtterance(text);
                u.lang = selectedLanguage === 'ru' ? 'ru-RU' : 'en-US'; 
                u.onstart = () => verityFace.classList.add('talking');
                u.onend = () => verityFace.classList.remove('talking');
                window.speechSynthesis.speak(u);
            }
        }

        function startVoiceInput() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) { alert("Микрофон не поддерживается."); return; }
            const r = new SR();
            r.lang = selectedLanguage === 'ru' ? 'ru-RU' : 'en-US';
            r.onstart = () => { speakVerity("Я слушаю..."); resetIdle(); };
            r.onresult = (e) => { 
                const text = e.results[0][0].transcript;
                document.getElementById('aiPrompt').value = text;
                sendMessage();
            };
            r.start();
        }

        function switchTool(tool, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.sub-tools').forEach(t => t.classList.remove('active'));
            document.getElementById(`sub-tools-${tool}`).classList.add('active');
            
            if (tool === 'chat' && chatHistory.length === 0) {
                document.getElementById('setupScreen').style.display = 'flex';
                document.getElementById('chatContainer').style.display = 'none';
            } else if (tool === 'chat' && chatHistory.length > 0) {
                document.getElementById('setupScreen').style.display = 'none';
                document.getElementById('chatContainer').style.display = 'flex';
            } else {
                document.getElementById('setupScreen').style.display = 'none';
                document.getElementById('chatContainer').style.display = 'flex';
            }
        }

        function startRoleplay() {
            systemPrompt = document.getElementById('setupBackground').value.trim();
            firstGreeting = document.getElementById('setupGreeting').value.trim();
            if(!firstGreeting) firstGreeting = "Привет! Я готов к общению. О чем поговорим?";
            
            chatHistory = [];
            addMessageToChat('bot', firstGreeting);
            
            document.getElementById('setupScreen').style.display = 'none';
            document.getElementById('chatContainer').style.display = 'flex';
            speakVerity(firstGreeting);
        }

        function resetToSetup() {
            chatHistory = [];
            document.getElementById('chatContainer').innerHTML = '';
            document.getElementById('setupScreen').style.display = 'flex';
            document.getElementById('chatContainer').style.display = 'none';
            document.getElementById('bookContainer').style.display = 'none';
            document.getElementById('setupBackground').value = '';
            document.getElementById('setupGreeting').value = '';
        }

        function generatePrompt(type, genre) {
            let promptText = "";
            if (type === 'writer') {
                promptText = `Вот промпт для написания книги в жанре "${genre}":\n\n"Напиши захватывающий сценарий в жанре ${genre} о... (допиши свою идею). Сделай акцент на атмосфере и диалогах."`;
            } else if (type === 'music') {
                promptText = `Вот промпт для генерации музыки в стиле "${genre}":\n\n"Создай музыкальный трек в стиле ${genre}. Настроение: динамичное. Основные инструменты: ... (допиши свои пожелания)."`;
            }
            addMessageToChat('bot', promptText);
            speakVerity(`Я подготовила промпт для ${genre}. Посмотри в чате!`);
        }

        function insertPrompt(type) {
            const i = document.getElementById('aiPrompt');
            if(type === 'threeAngles') i.value = `[СЫЩИК]: \n[ЗЛОДЕЙ]: \n[ПРОХОЖИЙ]: `;
            i.focus();
        }

        document.getElementById('openApiSettingsBtn').onclick = () => { 
            document.getElementById('apiKeyInput').value = localStorage.getItem('cometa_api_key') || '';
            document.getElementById('apiSettingsModal').style.display = 'flex'; 
        };
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        
        function toggleHelp() {
            const h = document.getElementById('helpBox');
            h.style.display = h.style.display === 'block' ? 'none' : 'block';
        }

        function saveApiKey() { 
            const key = document.getElementById('apiKeyInput').value.trim(); 
            if (key.length > 10) { 
                localStorage.setItem('cometa_api_key', key); 
                alert("Ключ сохранен!"); 
                closeModal('apiSettingsModal'); 
            } 
        }

        document.getElementById('openLangBtn').onclick = () => { 
            document.getElementById('langModal').style.display = 'flex'; 
        };

        function renderChat() {
            const c = document.getElementById('chatContainer'); c.innerHTML = '';
            chatHistory.forEach((m, i) => {
                const r = document.createElement('div'); r.className = `message-row ${m.role}`;
                const b = document.createElement('div'); b.className = 'message-bubble';
                b.innerHTML = m.text.replace(/\n/g, '<br>');
                r.appendChild(b);
                
                if (m.role === 'bot' && i === chatHistory.length - 1) {
                    const a = document.createElement('div'); a.className = 'message-actions';
                    a.innerHTML = `<span onclick="editMessage(${i})">✏️ Редактировать</span>`;
                    r.appendChild(a);
                }
                c.appendChild(r);
            });
            document.getElementById('contentArea').scrollTop = document.getElementById('contentArea').scrollHeight;
        }

        function addMessageToChat(role, text) { 
            chatHistory.push({ role, text }); 
            renderChat(); 
        }

        function editMessage(i) {
            const m = chatHistory[i]; 
            const r = document.getElementById('chatContainer').querySelectorAll('.message-row');
            r[i].innerHTML = `<textarea class="input-field" id="editInput-${i}" style="min-height:80px; margin-bottom:5px;">${m.text}</textarea><div style="display:flex; gap:10px;"><button class="btn-primary" onclick="saveEditedMessage(${i})" style="padding:5px 10px;">Сохранить</button><button class="btn-secondary" onclick="renderChat()" style="padding:5px 10px;">Отмена</button></div>`;
        }
        
        function saveEditedMessage(i) { 
            chatHistory[i].text = document.getElementById('editInput-' + i).value; 
            renderChat(); 
        }

        function convertToBook() {
            if(chatHistory.length === 0) { alert("Чат пуст."); return; }
            
            document.getElementById('chatContainer').style.display = 'none';
            document.getElementById('setupScreen').style.display = 'none';
            const bookDiv = document.getElementById('bookContainer');
            bookDiv.style.display = 'block';
            bookDiv.innerHTML = '<div style="text-align:center; padding:20px;">Генерация книги...</div>';
            document.getElementById('mainLoader').style.display = 'block';

            let bookHTML = `<h2 style="text-align:center; color:#10b981; margin-bottom:20px;">Твоя история</h2>`;
            
            chatHistory.forEach((m, i) => {
                if(m.role === 'bot') {
                    bookHTML += `<p style="font-style:italic;">${m.text}</p>`;
                } else {
                    bookHTML += `<p style="color:#aaa;">— ${m.text}</p>`;
                }
                
                if (i > 0 && i % 3 === 0) {
                    const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(m.text.substring(0, 100))}?width=1024&height=1024&nologo=true`;
                    bookHTML += `<img src="${imgUrl}">`;
                }
            });
            
            setTimeout(() => { 
                bookDiv.innerHTML = bookHTML; 
                document.getElementById('mainLoader').style.display = 'none';
            }, 1500);
        }

        async function sendMessage() {
            const i = document.getElementById('aiPrompt'); 
            const t = i.value.trim(); 
            if (!t) return;
            
            resetIdle();
            addMessageToChat('user', t); 
            i.value = ''; 
            
            const key = localStorage.getItem('cometa_api_key'); 
            if (!key) { 
                alert("Введите API ключ (🔑)!"); 
                document.getElementById('apiSettingsModal').style.display = 'flex'; 
                return; 
            }

            document.getElementById('mainLoader').style.display = 'block';
            document.getElementById('verityFace').style.transform = 'rotate(-5deg)';

            try {
                let sysMsg = systemPrompt ? systemPrompt : "Ты полезный ИИ-помощник.";
                sysMsg += ` Отвечай на языке: ${selectedLanguage === 'ru' ? 'Русский' : 'English'}.`;

                const res = await fetch("https://integrate.api.nvidia.com/v1/chat/completions", { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` }, 
                    body: JSON.stringify({ 
                        model: "meta/llama-3.1-70b-instruct", 
                        messages: [
                            { role: 'system', content: sysMsg },
                            ...chatHistory
                        ] 
                    }) 
                });
                
                if (!res.ok) throw new Error("Ошибка сети или ключа");
                const data = await res.json(); 
                if (data.error) throw new Error(data.error.message);
                
                const reply = data.choices[0].message.content;
                addMessageToChat('bot', reply);
                speakVerity(reply);

            } catch (e) { 
                addMessageToChat('bot', `Ошибка: ${e.message}`); 
                speakVerity("Ой, я запуталась в проводах."); 
            } finally { 
                document.getElementById('mainLoader').style.display = 'none';
                document.getElementById('verityFace').style.transform = 'rotate(0deg)'; 
            }
        }

        function playRadio() {
            let bgMusic = document.getElementById('bgMusic');
            if(!bgMusic) {
                const audio = document.createElement('audio');
                audio.id = 'bgMusic'; audio.loop = true;
                document.body.appendChild(audio);
                bgMusic = document.getElementById('bgMusic');
            }
            bgMusic.src = "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3";
            bgMusic.volume = 0.3;
            bgMusic.play();
            speakVerity("Включаю эфир! Тема сегодняшнего дня: Город после дождя.");
        }
