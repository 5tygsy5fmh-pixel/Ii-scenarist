<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Studio PRO</title>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
    
    <!-- Puter.js (ИИ прямо в браузере) -->
    <script src="https://js.puter.com/v2/"></script>

    <!-- Leaflet (Карты) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css" />
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>

    <!-- Three.js (3D) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        /* Строгий дизайн */
        :root {
            --bg: #050505;
            --surface: #121212;
            --border: #333333;
            --text: #ffffff;
            --text-secondary: #888888;
            --accent: #10b981;
            --radius-card: 0px;
            --radius-btn: 8px;
        }

        body { 
            margin: 0; padding: 0; background-color: var(--bg); color: var(--text); 
            font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; 
            display: flex; flex-direction: column; 
        }
        * { box-sizing: border-box; }
        
        /* Шапка */
        .header { 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 16px 20px; background: var(--bg); border-bottom: 1px solid var(--border); 
            z-index: 10; 
        }
        .logo { font-weight: 700; font-size: 16px; letter-spacing: 1px; text-transform: uppercase; }
        .header-controls { display: flex; gap: 10px; align-items: center; }
        .user-btn { 
            background: var(--surface); border: 1px solid var(--border); color: var(--text); 
            padding: 8px 16px; border-radius: var(--radius-btn); font-size: 13px; 
            font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        
        /* Зона предпросмотра */
        .preview-area { 
            flex: 1; background: var(--bg); display: flex; flex-direction: column; 
            align-items: center; justify-content: center; position: relative; overflow: hidden; 
        }
        .preview-placeholder { text-align: center; color: var(--text-secondary); font-size: 14px; font-weight: 500; }
        
        /* Панель управления */
        .control-panel { background: var(--bg); border-top: 1px solid var(--border); display: flex; flex-direction: column; }
        .tools { display: flex; padding: 12px 20px; gap: 8px; overflow-x: auto; border-bottom: 1px solid var(--border); }
        .tools::-webkit-scrollbar { display: none; }
        .tool-btn { 
            flex: 0 0 auto; background: var(--surface); border: 1px solid var(--border); 
            color: var(--text-secondary); padding: 10px 16px; border-radius: var(--radius-btn); 
            font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .tool-btn.active { background: var(--text); color: var(--bg); border-color: var(--text); }
        
        .input-area { padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
        textarea { 
            width: 100%; height: 60px; background: var(--surface); border: 1px solid var(--border); 
            border-radius: var(--radius-btn); color: var(--text); padding: 12px; font-size: 14px; 
            resize: none; outline: none; font-family: 'Inter', sans-serif; transition: 0.2s;
        }
        textarea:focus { border-color: var(--accent); }
        
        .action-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn-primary { 
            flex: 1; padding: 14px; background: var(--accent); border: none; 
            border-radius: var(--radius-btn); color: var(--bg); font-size: 14px; 
            font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center;
        }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* Оверлеи */
        #galleryOverlay, #trashOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 999; flex-direction: column; }
        .gallery-header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .gallery-grid { padding: 20px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; overflow-y: auto; flex: 1; align-content: start; }
        .gallery-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card); position: relative; aspect-ratio: 1; cursor: pointer; overflow: hidden; }
        .gallery-item img, .gallery-item video { width: 100%; height: 100%; object-fit: cover; }
        
        .loader { display: none; width: 24px; height: 24px; border: 2px solid var(--border); border-top: 2px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Карта и 3D */
        #mapContainer, #threeContainer { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 5; }
        #map { width: 100%; height: 100%; }
        #canvas3d { width: 100%; height: 100%; background: #000; }
        
        /* Таймлайн */
        .timeline { height: 80px; background: var(--bg); border-top: 1px solid var(--border); display: flex; flex-direction: column; }
        .timeline-header { padding: 8px 20px; font-size: 10px; color: var(--text-secondary); font-weight: 600; letter-spacing: 1px; }
        .track { height: 24px; margin-bottom: 2px; padding-left: 20px; display: flex; align-items: center; border-bottom: 1px solid var(--border); font-size: 10px; color: var(--text-secondary); }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">STUDIO PRO</div>
        <div class="header-controls">
            <button class="user-btn" id="openGalleryBtn" style="display: none;">📁</button>
            <button class="user-btn" id="openTrashBtn" style="display: none;">🗑️</button>
            <button class="user-btn" id="loginBtn">Войти</button>
        </div>
    </div>

    <div id="galleryOverlay">
        <div class="gallery-header"><h2 style="margin: 0; font-size: 16px;">Проекты</h2><button id="closeGalleryBtn" style="background: transparent; border: none; font-size: 20px; color: var(--text); cursor: pointer;">✕</button></div>
        <div id="galleryGrid" class="gallery-grid"></div>
    </div>
    
    <div id="trashOverlay">
        <div class="gallery-header"><h2 style="margin: 0; font-size: 16px; color: #ef4444;">Корзина</h2><button id="closeTrashBtn" style="background: transparent; border: none; font-size: 20px; color: var(--text); cursor: pointer;">✕</button></div>
        <div id="trashGrid" class="gallery-grid"></div>
    </div>

    <div class="preview-area" id="previewArea">
        <div class="preview-placeholder" id="previewText">Здесь появится ваша сцена</div>
        <div class="loader" id="mainLoader"></div>
        
        <video id="videoPlayer" style="display:none; width:100%; height:100%; object-fit:contain;" controls></video>
        <img id="imageResult" style="display:none; width:100%; height:100%; object-fit:contain;">
        
        <div id="formatSelector" style="display:none; margin: 16px auto; width: 90%; max-width: 300px;">
            <select id="videoFormat" style="width: 100%; padding: 12px; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius-btn); outline: none; font-family: 'Inter';">
                <option value="mp4">MP4 (Видео)</option>
                <option value="webm">WebM (Для сайтов)</option>
            </select>
        </div>
        <button id="saveBtn" class="btn-primary" style="display:none; margin: 16px auto; width: 90%; max-width: 300px;">💾 Сохранить проект</button>

        <!-- 2D Карта -->
        <div id="mapContainer">
            <div id="map"></div>
            <button id="generate3dBtn" class="btn-primary" style="position:absolute; bottom:24px; left:5%; width:90%; z-index:10;">Создать 3D-сцену</button>
        </div>

        <!-- 3D Сцена -->
        <div id="threeContainer">
            <div id="canvas3d"></div>
            <button id="backToMapBtn" style="display: block; position:absolute; top:24px; left:24px; width:auto; padding: 10px 16px; z-index: 10; background: rgba(0,0,0,0.6); border: 1px solid var(--border); color: white; border-radius: 8px;">Назад</button>
            
            <div id="directorPanel" style="position:absolute; bottom:24px; left:24px; right:24px; z-index:10; display:none; gap:10px; background: rgba(18,18,18,0.9); border: 1px solid var(--border); padding: 12px; border-radius: var(--radius-btn);">
                <button id="addActorBtn" class="btn-primary" style="flex:1; padding: 10px; font-size: 12px;">+ Актер</button>
                <input type="text" id="directorPrompt" placeholder="Действие (напр: Идет к ручке)" style="flex:2; padding:10px; border-radius: var(--radius-btn); border: 1px solid var(--border); background:var(--bg); color:var(--text); font-size: 12px; outline: none;">
                <button id="playSceneBtn" class="btn-primary" style="flex:1; padding: 10px; font-size: 12px;">▶ Играть</button>
            </div>
        </div>
    </div>

    <div class="control-panel">
        <div class="tools">
            <button class="tool-btn active" onclick="switchTool('script', this)">Сценарий</button>
            <button class="tool-btn" onclick="switchTool('image', this)">Фото</button>
            <button class="tool-btn" onclick="switchTool('video', this)">Видео</button>
            <button class="tool-btn" onclick="switchTool('map', this)">3D Карта</button>
        </div>

        <div class="input-area">
            <textarea id="aiPrompt" placeholder="Опишите вашу идею..."></textarea>
            <div class="action-buttons">
                <button class="btn-primary" id="generateBtn">Сгенерировать</button>
            </div>
        </div>
    </div>

    <div class="timeline">
        <div class="timeline-header">ТАЙМЛАЙН</div>
        <div class="track">ВИДЕО</div>
        <div class="track">АУДИО</div>
    </div>

    <script>
        // 1. FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyAUIrQTOW_aDL6ziFVpXerHf6pPD6waRI8",
            authDomain: "fake-strim.firebaseapp.com",
            projectId: "fake-strim",
            storageBucket: "fake-strim.firebasestorage.app",
            messagingSenderId: "838988558430",
            appId: "1:838988558430:web:579a441e92556fb4d384cf"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();

        // 2. ПЕРЕМЕННЫЕ
        let currentTool = 'script';
        let map = null;
        let scene3D, camera3D, renderer3D;
        let sceneObjects = {}; 
        let objectCounter = 0;

        // 3. АВТОРИЗАЦИЯ
        document.getElementById('loginBtn').onclick = () => {
            if (auth.currentUser) auth.signOut();
            else auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => alert(e.message));
        };

        auth.onAuthStateChanged(user => {
            const btn = document.getElementById('loginBtn');
            if (user) {
                btn.innerText = user.displayName ? user.displayName.split(' ')[0] : 'Выйти';
                document.getElementById('openGalleryBtn').style.display = 'block';
                document.getElementById('openTrashBtn').style.display = 'block';
            } else {
                btn.innerText = 'Войти';
                document.getElementById('openGalleryBtn').style.display = 'none';
                document.getElementById('openTrashBtn').style.display = 'none';
                document.getElementById('galleryOverlay').style.display = 'none';
                document.getElementById('trashOverlay').style.display = 'none';
            }
        });

        // 4. ИНТЕРФЕЙС
        function switchTool(tool, btn) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            document.getElementById('videoPlayer').style.display = 'none';
            document.getElementById('imageResult').style.display = 'none';
            document.getElementById('saveBtn').style.display = 'none';
            document.getElementById('formatSelector').style.display = 'none';
            document.getElementById('mapContainer').style.display = 'none';
            document.getElementById('threeContainer').style.display = 'none';
            document.getElementById('previewText').style.display = 'block';
            
            const promptInput = document.getElementById('aiPrompt');
            if (tool === 'script') promptInput.placeholder = "Напишите идею для видео...";
            else if (tool === 'image') promptInput.placeholder = "Опишите картинку...";
            else if (tool === 'video') promptInput.placeholder = "Опишите видео...";
            else if (tool === 'map') {
                promptInput.placeholder = "Выделите область на карте...";
                document.getElementById('previewText').style.display = 'none';
                document.getElementById('mapContainer').style.display = 'block';
                initMap();
            }
        }

        // 5. ГЕНЕРАЦИЯ
        document.getElementById('generateBtn').onclick = async function() {
            if (currentTool === 'map') return;
            const prompt = document.getElementById('aiPrompt').value;
            if (!prompt) { alert("Введите текст!"); return; }

            document.getElementById('mainLoader').style.display = 'block';
            document.getElementById('previewText').style.display = 'none';
            this.innerText = 'Генерация...';
            this.disabled = true;

            // --- СЦЕНАРИЙ (Напрямую через Puter.js) ---
            if (currentTool === 'script') {
                try {
                    const response = await puter.ai.chat(`Напиши кинематографичный сценарий для видео на тему: ${prompt}. Опиши свет и ракурсы.`);
                    const text = response.message?.content || response.text || response;
                    
                    document.getElementById('previewText').style.display = 'block';
                    document.getElementById('previewText').innerHTML = `<div style="text-align:left; font-size:14px; line-height:1.6; color: var(--text-secondary); overflow-y:auto; max-height: 100%; padding: 20px;">${text.replace(/\n/g, '<br>')}</div>`;
                } catch (error) {
                    alert("Ошибка: " + error.message);
                    document.getElementById('previewText').style.display = 'block';
                } finally {
                    document.getElementById('mainLoader').style.display = 'none';
                    this.innerText = 'Сгенерировать';
                    this.disabled = false;
                }
            } 
            // --- ФОТО ---
            else if (currentTool === 'image') {
                const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1024&height=1024&nologo=true&seed=${Math.floor(Math.random() * 100000)}`;
                const imgElement = document.getElementById('imageResult');
                imgElement.onload = () => {
                    document.getElementById('mainLoader').style.display = 'none';
                    imgElement.style.display = 'block';
                    document.getElementById('saveBtn').style.display = 'block';
                    this.innerText = 'Сгенерировать';
                    this.disabled = false;
                };
                imgElement.onerror = () => { alert("Ошибка фото."); document.getElementById('mainLoader').style.display = 'none'; this.innerText = 'Сгенерировать'; this.disabled = false; };
                imgElement.src = imageUrl;
            }
            // --- ВИДЕО (Puter.js + Canvas) ---
            else if (currentTool === 'video') {
                try {
                    const baseImageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1024&height=1024&nologo=true&seed=${Math.floor(Math.random() * 100000)}`;
                    const img = new Image();
                    img.crossOrigin = "Anonymous"; 
                    img.onload = async () => {
                        try {
                            const canvas = document.createElement('canvas');
                            canvas.width = 1920; canvas.height = 1080;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            const upscaledBase64 = canvas.toDataURL('image/jpeg', 0.95);

                            const videoElement = await puter.ai.txt2vid(prompt, {
                                model: "google/veo-2.0", 
                                input_reference: upscaledBase64, 
                                duration: 5, 
                                size: "1280x720" 
                            });

                            const videoPlayer = document.getElementById('videoPlayer');
                            videoPlayer.src = videoElement.src;
                            videoPlayer.style.display = 'block';
                            videoPlayer.play();
                            
                            document.getElementById('mainLoader').style.display = 'none';
                            document.getElementById('formatSelector').style.display = 'block';
                            document.getElementById('saveBtn').style.display = 'block';
                            document.getElementById('generateBtn').innerText = 'Сгенерировать';
                            document.getElementById('generateBtn').disabled = false;
                        } catch (innerError) { throw new Error("Ошибка видео: " + innerError.message); }
                    };
                    img.onerror = () => { throw new Error("Ошибка картинки."); };
                    img.src = baseImageUrl;
                } catch (error) {
                    alert(error.message);
                    document.getElementById('mainLoader').style.display = 'none';
                    document.getElementById('generateBtn').innerText = 'Сгенерировать';
                    document.getElementById('generateBtn').disabled = false;
                }
            }
        };

        // 6. СОХРАНЕНИЕ В БАЗУ
        document.getElementById('saveBtn').onclick = async function() {
            const user = auth.currentUser;
            if (!user) { alert("Войдите!"); return; }
            const btn = this; btn.innerText = 'Сохранение...'; btn.disabled = true;
            try {
                let fileUrl = '', fileExtension = '', blob;
                if (currentTool === 'image') { fileUrl = document.getElementById('imageResult').src; fileExtension = 'png'; }
                else if (currentTool === 'video') { fileUrl = document.getElementById('videoPlayer').src; fileExtension = document.getElementById('videoFormat').value; }
                const response = await fetch(fileUrl);
                blob = await response.blob();
                const filename = `ai_${Date.now()}.${fileExtension}`;
                const storageRef = storage.ref(`users/${user.uid}/${filename}`);
                const snapshot = await storageRef.put(blob);
                const downloadURL = await snapshot.ref.getDownloadURL();
                await db.collection('projects').add({ userId: user.uid, type: currentTool, format: fileExtension, prompt: document.getElementById('aiPrompt').value, fileUrl: downloadURL, createdAt: firebase.firestore.FieldValue.serverTimestamp(), isDeleted: false });
                const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click();
                btn.innerText = 'Сохранено!'; setTimeout(() => { btn.innerText = '💾 Сохранить проект'; btn.disabled = false; }, 2000);
            } catch (error) { alert("Ошибка: " + error.message); btn.innerText = '💾 Сохранить проект'; btn.disabled = false; }
        };

        // 7. ГАЛЕРЕЯ
        document.getElementById('openGalleryBtn').onclick = async () => {
            document.getElementById('galleryOverlay').style.display = 'flex';
            const grid = document.getElementById('galleryGrid'); grid.innerHTML = 'Загрузка...';
            try {
                const snapshot = await db.collection('projects').where('userId', '==', auth.currentUser.uid).get();
                const projects = []; snapshot.forEach(doc => { if (doc.data().isDeleted !== true) projects.push({ id: doc.id, ...doc.data() }); });
                grid.innerHTML = ''; if (projects.length === 0) { grid.innerHTML = '<div style="color:#888;">Пусто</div>'; return; }
                projects.forEach(proj => {
                    const item = document.createElement('div'); item.className = 'gallery-item';
                    item.innerHTML = proj.type === 'image' ? `<img src="${proj.fileUrl}">` : `<video src="${proj.fileUrl}" muted loop onmouseover="this.play()" onmouseout="this.pause()"></video>`;
                    const delBtn = document.createElement('button'); delBtn.innerText = '🗑️'; delBtn.style.cssText = 'position:absolute; bottom:8px; right:8px; background:rgba(0,0,0,0.8); border:none; color:#fff; padding:8px; border-radius:4px; cursor:pointer;';
                    delBtn.onclick = async (e) => { e.stopPropagation(); await db.collection('projects').doc(proj.id).update({ isDeleted: true }); item.remove(); };
                    item.appendChild(delBtn); grid.appendChild(item);
                });
            } catch (error) { grid.innerHTML = `Ошибка: ${error.message}`; }
        };
        document.getElementById('closeGalleryBtn').onclick = () => document.getElementById('galleryOverlay').style.display = 'none';

        // 8. КОРЗИНА
        document.getElementById('openTrashBtn').onclick = async () => {
            document.getElementById('trashOverlay').style.display = 'flex';
            const grid = document.getElementById('trashGrid'); grid.innerHTML = 'Загрузка...';
            try {
                const snapshot = await db.collection('projects').where('userId', '==', auth.currentUser.uid).get();
                const deleted = []; snapshot.forEach(doc => { if (doc.data().isDeleted === true) deleted.push({ id: doc.id, ...doc.data() }); });
                grid.innerHTML = ''; if (deleted.length === 0) { grid.innerHTML = '<div style="color:#888;">Пусто</div>'; return; }
                deleted.forEach(proj => {
                    const item = document.createElement('div'); item.className = 'gallery-item';
                    item.innerHTML = `<img src="${proj.fileUrl}" style="filter: grayscale(80%);">`;
                    const actions = document.createElement('div'); actions.style.cssText = 'position:absolute; bottom:0; left:0; width:100%; display:flex; justify-content:space-between; padding:8px; background:rgba(0,0,0,0.8);';
                    const restore = document.createElement('button'); restore.innerText = '↺'; restore.style.cssText = 'background:var(--accent); color:#000; border:none; border-radius:4px; padding:6px 12px; cursor:pointer;';
                    restore.onclick = async () => { await db.collection('projects').doc(proj.id).update({ isDeleted: false }); item.remove(); };
                    const del = document.createElement('button'); del.innerText = '✕'; del.style.cssText = 'background:#ef4444; color:#fff; border:none; border-radius:4px; padding:6px 12px; cursor:pointer;';
                    del.onclick = async () => { if (!confirm('Удалить навсегда?')) return; await db.collection('projects').doc(proj.id).delete(); try { const f = storage.refFromURL(proj.fileUrl); await f.delete(); } catch(e){} item.remove(); };
                    actions.appendChild(restore); actions.appendChild(del); item.appendChild(actions); grid.appendChild(item);
                });
            } catch (error) { grid.innerHTML = `Ошибка: ${error.message}`; }
        };
        document.getElementById('closeTrashBtn').onclick = () => document.getElementById('trashOverlay').style.display = 'none';

        // 9. 3D КАРТА И РЕЖИССЕР
        function initMap() {
            if (map) return;
            map = L.map('map').setView([55.751244, 37.618423], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            map.pm.addControls({ position: 'topleft' });
        }

        document.getElementById('generate3dBtn').onclick = () => {
            if (!map.pm.getGeomanDrawLayers().length) { alert("Выделите область!"); return; }
            document.getElementById('mapContainer').style.display = 'none';
            document.getElementById('threeContainer').style.display = 'block';
            document.getElementById('directorPanel').style.display = 'flex';
            generate3DScene();
        };

        document.getElementById('backToMapBtn').onclick = () => {
            document.getElementById('threeContainer').style.display = 'none';
            document.getElementById('mapContainer').style.display = 'block';
            if (scene3D) { scene3D.clear(); }
        };

        function generate3DScene() {
            const container = document.getElementById('canvas3d'); container.innerHTML = '';
            scene3D = new THREE.Scene(); scene3D.background = new THREE.Color(0x222222);
            camera3D = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer3D = new THREE.WebGLRenderer({ antialias: true }); renderer3D.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer3D.domElement);

            scene3D.add(new THREE.AmbientLight(0xffffff, 0.6));
            const light = new THREE.DirectionalLight(0xffffff, 0.8); light.position.set(10, 20, 10); scene3D.add(light);

            // Простая комната-коробка (заглушка)
            const geo = new THREE.BoxGeometry(20, 10, 20);
            const mat = new THREE.MeshLambertMaterial({ color: 0x333333, side: THREE.DoubleSide });
            const room = new THREE.Mesh(geo, mat); room.position.y = 5; scene3D.add(room);

            camera3D.position.set(0, 5, 15); camera3D.lookAt(0, 5, 0);

            function animate() { requestAnimationFrame(animate); renderer3D.render(scene3D, camera3D); }
            animate();
        }

        document.getElementById('addActorBtn').onclick = () => {
            objectCounter++;
            const actorGroup = new THREE.Group();
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 2, 16), new THREE.MeshLambertMaterial({ color: 0x10b981 }));
            body.position.y = 1; actorGroup.add(body);
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.6, 16, 16), new THREE.MeshLambertMaterial({ color: 0xffdbac }));
            head.position.y = 2.5; actorGroup.add(head);
            actorGroup.position.set((Math.random() - 0.5) * 10, 0, (Math.random() - 0.5) * 10);
            actorGroup.userData = { id: `Actor_${objectCounter}` };
            scene3D.add(actorGroup); sceneObjects[`Actor_${objectCounter}`] = actorGroup;
        };

        document.getElementById('playSceneBtn').onclick = async function() {
            const prompt = document.getElementById('directorPrompt').value; if (!prompt) return;
            const btn = this; btn.innerText = 'Думает...'; btn.disabled = true;
            try {
                const availableObjects = Object.keys(sceneObjects);
                // Используем Puter.js вместо Cloudflare
                const response = await puter.ai.chat(`Ты режиссер. Объекты: ${availableObjects.join(', ')}. Запрос: "${prompt}". Верни ТОЛЬКО JSON массив действий. Пример: [{"object": "Actor_1", "target": "X:5, Z:5", "duration": 2000}]. Без лишнего текста.`);
                const rawText = response.message?.content || response.text || response;
                
                const cleanJson = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
                const actions = JSON.parse(cleanJson);
                
                actions.forEach(act => {
                    const targetObj = sceneObjects[act.object]; if (!targetObj) return;
                    let targetPos;
                    if (act.target && act.target.includes(':')) {
                        const x = parseFloat(act.target.match(/X:(-?\d+\.?\d*)/)[1]);
                        const z = parseFloat(act.target.match(/Z:(-?\d+\.?\d*)/)[1]);
                        targetPos = { x, z };
                    }
                    if (targetPos) {
                        const startPos = targetObj.position.clone(); const duration = act.duration || 2000; const startTime = Date.now();
                        function animateMove() {
                            const elapsed = Date.now() - startTime; const progress = Math.min(elapsed / duration, 1);
                            targetObj.position.x = startPos.x + (targetPos.x - startPos.x) * progress;
                            targetObj.position.z = startPos.z + (targetPos.z - startPos.z) * progress;
                            if (progress < 1) requestAnimationFrame(animateMove);
                        }
                        animateMove();
                    }
                });
            } catch (error) { alert("Ошибка режиссера: " + error.message); }
            finally { btn.innerText = '▶ Играть'; btn.disabled = false; }
        };
    </script>
</body>
</html>
