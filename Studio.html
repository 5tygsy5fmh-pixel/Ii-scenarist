<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cometa AI Studio</title>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body { margin: 0; padding: 0; background-color: #050505; color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        * { box-sizing: border-box; }
        
        .header { display: flex; align-items: center; justify-content: space-between; padding: 10px 15px; background: #000; border-bottom: 1px solid #222; z-index: 10; }
        .logo { font-weight: 900; font-size: 18px; background: linear-gradient(90deg, #10b981, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-controls { display: flex; gap: 6px; align-items: center; }
        .icon-btn { background: #111; border: 1px solid #333; color: #fff; padding: 8px; border-radius: 50%; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; transition: 0.2s; }
        .icon-btn:hover { background: #222; }
        
        .content-area { flex: 1; background: #0a0a0a; display: flex; flex-direction: column; overflow-y: auto; position: relative; scroll-behavior: smooth; }
        
        /* ==========================================
           КАСТОМНЫЙ ЛОАДЕР (ТВОЯ ИКОНКА)
        ========================================== */
        #mainLoader {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 140px; height: 140px;
            display: none; z-index: 100;
        }
        .loader-track {
            fill: none; stroke: #151515; stroke-width: 8; stroke-linecap: round;
        }
        .loader-anim {
            fill: none; stroke: url(#gradient); stroke-width: 8; stroke-linecap: round;
            /* Длина пути для анимации */
            stroke-dasharray: 350; 
            stroke-dashoffset: 350;
            animation: loadDraw 3.5s linear infinite;
        }
        .loader-text {
            fill: #fff; font-family: 'Inter', sans-serif; font-weight: 900; font-size: 36px; text-anchor: middle; opacity: 0.9;
        }
        @keyframes loadDraw {
            0% { stroke-dashoffset: 350; }
            100% { stroke-dashoffset: 0; }
        }

        /* ЧАТ */
        .chat-container { padding: 15px; display: flex; flex-direction: column; gap: 15px; max-width: 800px; margin: 0 auto; width: 100%; }
        .message-row { display: flex; flex-direction: column; width: 100%; }
        .message-row.user { align-items: flex-end; }
        .message-row.bot { align-items: flex-start; }
        
        .message-bubble { max-width: 85%; padding: 12px 16px; border-radius: 16px; font-size: 15px; line-height: 1.5; position: relative; word-wrap: break-word; }
        .message-row.user .message-bubble { background: #3b82f6; color: #fff; border-bottom-right-radius: 4px; }
        .message-row.bot .message-bubble { background: #222; color: #eee; border-bottom-left-radius: 4px; }
        
        .message-actions { margin-top: 5px; font-size: 12px; color: #888; cursor: pointer; display: flex; gap: 10px; }
        .message-actions span:hover { color: #10b981; }

        .edit-textarea { width: 100%; background: #000; border: 1px solid #10b981; color: #fff; padding: 10px; border-radius: 8px; font-size: 14px; resize: vertical; min-height: 80px; margin-bottom: 5px; }
        .edit-buttons { display: flex; gap: 10px; }
        .btn-small { padding: 5px 10px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; font-size: 12px; }
        .btn-save { background: #10b981; color: #000; }
        .btn-cancel { background: #444; color: #fff; }

        .script-container { padding: 20px; max-width: 800px; margin: 0 auto; width: 100%; display: none; font-size: 16px; line-height: 1.6; color: #ddd; }
        .script-container img { width: 100%; border-radius: 12px; margin: 20px 0; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .script-container p { margin-bottom: 15px; }

        .control-panel { background: #111; border-top: 1px solid #333; padding: 10px 15px; }
        .input-wrapper { display: flex; gap: 10px; align-items: flex-end; max-width: 800px; margin: 0 auto; }
        textarea { flex: 1; height: 50px; background: #000; border: 1px solid #333; border-radius: 12px; color: #fff; padding: 14px; font-size: 15px; resize: none; outline: none; }
        textarea:focus { border-color: #10b981; }
        .send-btn { width: 50px; height: 50px; background: linear-gradient(135deg, #10b981, #059669); border: none; border-radius: 12px; color: #fff; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        
        /* МОДАЛКИ */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: #1a1a2e; border-radius: 16px; padding: 20px; width: 100%; max-width: 450px; max-height: 85vh; overflow-y: auto; border: 1px solid #333; }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 18px; font-weight: bold; }
        .input-field { width: 100%; padding: 12px; background: #000; border: 1px solid #333; border-radius: 8px; color: #fff; margin-bottom: 15px; font-size: 14px; }
        
        /* ЖАНРЫ */
        .genre-category { padding: 14px; background: #111; border-radius: 10px; margin-bottom: 10px; cursor: pointer; border: 1px solid #333; font-size: 15px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .genre-category:hover { border-color: #10b981; background: #1a1a1a; }
        .genre-category.active { border-color: #10b981; color: #10b981; }
        .genre-category::after { content: '▼'; font-size: 10px; transition: 0.3s; }
        .genre-category.active::after { transform: rotate(180deg); }

        .genre-list { display: none; margin-top: -5px; margin-bottom: 15px; padding: 10px; background: #0a0a0a; border-radius: 0 0 10px 10px; border: 1px solid #333; border-top: none; }
        .genre-item { padding: 10px 12px; background: #1a1a1a; border-radius: 6px; margin-bottom: 6px; font-size: 14px; cursor: pointer; color: #ccc; transition: 0.2s; border: 1px solid transparent; }
        .genre-item:hover { background: #222; color: #fff; border-color: #444; }
        .genre-item.selected { background: rgba(16, 185, 129, 0.2); color: #10b981; border-color: #10b981; font-weight: bold; }

        /* ЯЗЫКИ */
        .lang-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .lang-item { padding: 10px; background: #111; border-radius: 8px; cursor: pointer; border: 1px solid #222; font-size: 13px; text-align: center; }
        .lang-item:hover { border-color: #10b981; background: #1a1a1a; }

        .audio-player { display: none; padding: 10px; background: #000; border-top: 1px solid #333; align-items: center; gap: 10px; }
        .audio-player audio { width: 100%; height: 40px; }
        
        .btn-primary { flex: 1; padding: 15px; background: linear-gradient(135deg, #10b981, #059669); border: none; border-radius: 12px; color: #fff; font-size: 15px; font-weight: 800; cursor: pointer; margin-bottom: 10px; }
        .btn-secondary { flex: 1; padding: 12px; background: #333; border: none; border-radius: 12px; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">Cometa AI</div>
        <div class="header-controls">
            <button class="icon-btn" id="openSettingsBtn" title="Настройки ИИ">⚙️</button>
            <button class="icon-btn" id="openGenreBtn" title="Стиль картинок">🎨</button>
            <button class="icon-btn" id="openLangBtn" title="Языки">🌐</button>
            <button class="icon-btn" id="openMusicBtn" title="Фоновая музыка">🎵</button>
        </div>
    </div>

    <div class="content-area" id="contentArea">
        
        <!-- КАСТОМНЫЙ ЛОАДЕР -->
        <svg id="mainLoader" viewBox="0 0 100 100">
            <defs>
                <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#4b74ff" />
                    <stop offset="100%" stop-color="#51d5a7" />
                </linearGradient>
            </defs>
            <!-- Задний фон рамки -->
            <path class="loader-track" d="M 25 10 L 80 10 A 15 15 0 0 1 95 25 L 95 75 A 15 15 0 0 1 80 90 L 25 90 A 15 15 0 0 1 10 75 L 10 25 A 15 15 0 0 1 25 10 Z" />
            <!-- Анимированная линия -->
            <path class="loader-anim" d="M 25 10 L 80 10 A 15 15 0 0 1 95 25 L 95 75 A 15 15 0 0 1 80 90 L 25 90 A 15 15 0 0 1 10 75 L 10 25 A 15 15 0 0 1 25 10 Z" />
            <!-- Текст AI -->
            <text x="50" y="62" class="loader-text">AI</text>
        </svg>

        <div class="chat-container" id="chatContainer"></div>
        <div class="script-container" id="scriptContainer"></div>
    </div>

    <div class="audio-player" id="audioPlayer">
        <audio id="bgMusic" loop></audio>
        <span style="font-size: 12px; color: #10b981;" id="musicTitle">Фон играет</span>
    </div>

    <div class="control-panel">
        <div class="input-wrapper">
            <textarea id="aiPrompt" placeholder="Напиши сообщение..." rows="1" onkeypress="handleEnter(event)"></textarea>
            <button class="send-btn" id="readTextBtn" title="Озвучить" onclick="speakChat()" style="background: #3b82f6;">🔊</button>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <!-- ГЛАВНОЕ МЕНЮ НАСТРОЕК -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header"><span>⚙️ Настройки</span><button onclick="closeModal('settingsModal')" style="background:none;border:none;color:#fff;font-size:20px;">✕</button></div>
            
            <p style="font-size: 13px; color: #aaa; margin-top: 0;">Характер бота (System Prompt):</p>
            <textarea id="systemPromptInput" class="input-field" style="height: 80px;" placeholder="Ты - дерзкий киберпанк-хакер..."></textarea>
            <button class="btn-primary" onclick="saveSettings()">Сохранить характер</button>
            
            <hr style="border-color:#333; margin: 15px 0;">
            
            <p style="font-size: 13px; color: #aaa;">Управление чатом:</p>
            <button class="btn-secondary" onclick="toggleView()" id="toggleViewBtn" style="background: #3b82f6; width: 100%;">📜 Переключить в режим сценария</button>
            <button class="btn-secondary" onclick="clearChat()" style="background: #ef4444; width: 100%;">🗑️ Очистить всю историю</button>
            <button class="btn-secondary" onclick="openRewindModal()" style="background: #f59e0b; color: #000; width: 100%;">⏳ Начать отсюда (Откат)</button>

            <hr style="border-color:#333; margin: 15px 0;">
            
            <p style="font-size: 12px; color: #888;">API Ключ (OpenAI):</p>
            <input type="password" id="apiKeyInput" class="input-field" placeholder="sk-...">
            <button class="btn-primary" onclick="saveApiKey()" style="background:#3b82f6;">Обновить Ключ</button>
        </div>
    </div>

    <div class="modal" id="rewindModal">
        <div class="modal-content">
            <div class="modal-header"><span>⏳ Начать отсюда</span><button onclick="closeModal('rewindModal')" style="background:none;border:none;color:#fff;font-size:20px;">✕</button></div>
            <p style="font-size: 12px; color: #aaa; margin-bottom: 15px;">Всё, что ниже выбранного сообщения, удалится.</p>
            <div id="rewindList" style="display: flex; flex-direction: column; gap: 8px;"></div>
        </div>
    </div>

    <div class="modal" id="genreModal">
        <div class="modal-content">
            <div class="modal-header"><span>🎨 Стиль иллюстраций</span><button onclick="closeModal('genreModal')" style="background:none;border:none;color:#fff;font-size:20px;">✕</button></div>
            <div id="genreContainer"></div>
        </div>
    </div>

    <div class="modal" id="langModal">
        <div class="modal-content">
            <div class="modal-header"><span>🌐 Языки</span><button onclick="closeModal('langModal')" style="background:none;border:none;color:#fff;font-size:20px;">✕</button></div>
            <input type="text" id="langSearch" class="input-field" placeholder="Поиск языка..." oninput="filterLangs()">
            <div id="langList" class="lang-grid"></div>
        </div>
    </div>

    <div class="modal" id="musicModal">
        <div class="modal-content">
            <div class="modal-header"><span>🎧 Фоновая музыка</span><button onclick="closeModal('musicModal')" style="background:none;border:none;color:#fff;font-size:20px;">✕</button></div>
            <input type="file" id="musicInput" accept="audio/*" style="margin-bottom: 15px; color: #aaa;">
            <div id="musicList" style="color: #888;">Музыка не загружена.</div>
        </div>
    </div>

    <script>
        window.onerror = function(msg) { console.warn("Ошибка JS: ", msg); return false; };

        let chatHistory = []; 
        let systemPrompt = localStorage.getItem('cometa_system_prompt') || "Ты полезный ассистент.";
        let selectedGenre = "Случайный";
        let isChatMode = true;
        let lastBotMessageText = "";

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('systemPromptInput').value = systemPrompt;
            document.getElementById('apiKeyInput').value = localStorage.getItem('cometa_api_key') || '';
            if (!localStorage.getItem('cometa_api_key')) document.getElementById('settingsModal').style.display = 'flex';
            
            addMessageToChat('bot', "Привет! Я готов к работе. Открой настройки ⚙️, чтобы задать мой характер, и давай начнем!");
        });

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function saveSettings() {
            systemPrompt = document.getElementById('systemPromptInput').value;
            localStorage.setItem('cometa_system_prompt', systemPrompt);
            alert("Характер ИИ сохранен!");
            closeModal('settingsModal');
        }

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key.length > 10) {
                localStorage.setItem('cometa_api_key', key);
                alert("Ключ сохранен!");
            }
        }
        document.getElementById('openSettingsBtn').onclick = () => document.getElementById('settingsModal').style.display = 'flex';

        function openRewindModal() {
            closeModal('settingsModal');
            const list = document.getElementById('rewindList');
            list.innerHTML = '';
            
            if (chatHistory.length === 0) {
                list.innerHTML = '<div style="color:#888; text-align:center;">История пуста</div>';
            } else {
                chatHistory.forEach((msg, index) => {
                    const div = document.createElement('div');
                    div.className = 'lang-item';
                    const shortText = msg.text.length > 50 ? msg.text.substring(0, 50) + '...' : msg.text;
                    div.innerHTML = `<strong>${msg.role === 'user' ? 'Вы' : 'ИИ'}:</strong> ${shortText}`;
                    div.onclick = () => rewindTo(index);
                    list.appendChild(div);
                });
            }
            document.getElementById('rewindModal').style.display = 'flex';
        }

        async function rewindTo(index) {
            closeModal('rewindModal');
            const msg = chatHistory[index];
            
            if (msg.role === 'user') {
                chatHistory = chatHistory.slice(0, index + 1);
                renderChat();
                sendToAPI(); 
            } else if (msg.role === 'bot') {
                chatHistory = chatHistory.slice(0, index);
                renderChat();
                if (chatHistory.length > 0) sendToAPI(); 
            }
        }

        function renderChat() {
            const container = document.getElementById('chatContainer');
            container.innerHTML = '';
            
            chatHistory.forEach((msg, index) => {
                const row = document.createElement('div');
                row.className = `message-row ${msg.role}`;
                
                const bubble = document.createElement('div');
                bubble.className = 'message-bubble';
                bubble.innerHTML = msg.text.replace(/\n/g, '<br>');
                
                row.appendChild(bubble);
                
                if (index === chatHistory.length - 1) {
                    const actions = document.createElement('div');
                    actions.className = 'message-actions';
                    actions.innerHTML = `<span onclick="editMessage(${index})">✏️ Редактировать</span>`;
                    row.appendChild(actions);
                }
                
                container.appendChild(row);
            });
            
            const contentArea = document.getElementById('contentArea');
            contentArea.scrollTop = contentArea.scrollHeight;
        }

        function addMessageToChat(role, text) {
            chatHistory.push({ role, text });
            if (role === 'bot') lastBotMessageText = text;
            renderChat();
        }

        function editMessage(index) {
            const msg = chatHistory[index];
            const container = document.getElementById('chatContainer');
            const rows = container.querySelectorAll('.message-row');
            const targetRow = rows[index];
            
            targetRow.innerHTML = `
                <textarea class="edit-textarea" id="editInput-${index}">${msg.text}</textarea>
                <div class="edit-buttons">
                    <button class="btn-small btn-save" onclick="saveEditedMessage(${index})">Сохранить</button>
                    <button class="btn-small btn-cancel" onclick="renderChat()">Отмена</button>
                </div>
            `;
        }

        function saveEditedMessage(index) {
            const newText = document.getElementById(`editInput-${index}`).value;
            chatHistory[index].text = newText;
            if (chatHistory[index].role === 'bot') lastBotMessageText = newText;
            renderChat();
        }

        function clearChat() {
            if(confirm("Очистить всю историю чата?")) {
                chatHistory = [];
                lastBotMessageText = "";
                addMessageToChat('bot', "Чат очищен. О чем поговорим?");
                closeModal('settingsModal');
            }
        }

        function handleEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function sendMessage() {
            const input = document.getElementById('aiPrompt');
            const text = input.value.trim();
            if (!text) return;

            addMessageToChat('user', text);
            input.value = '';
            sendToAPI();
        }

        async function sendToAPI() {
            const apiKey = localStorage.getItem('cometa_api_key');
            if (!apiKey) {
                alert("Введите API ключ в настройках (⚙️)!");
                document.getElementById('settingsModal').style.display = 'flex';
                return;
            }

            document.getElementById('mainLoader').style.display = 'block';
            document.getElementById('sendBtn').disabled = true;

            try {
                let messages = [{ role: 'system', content: systemPrompt }];
                chatHistory.forEach(msg => {
                    messages.push({ role: msg.role === 'bot' ? 'assistant' : 'user', content: msg.text });
                });

                const res = await fetch("https://api.openai.com/v1/chat/completions", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                    body: JSON.stringify({ model: "gpt-3.5-turbo", messages: messages })
                });
                
                if (!res.ok) throw new Error("Ошибка API");
                const data = await res.json();
                const botReply = data.choices[0].message.content;
                
                addMessageToChat('bot', botReply);

            } catch (e) {
                alert("Ошибка ИИ: " + e.message);
            } finally {
                document.getElementById('mainLoader').style.display = 'none';
                document.getElementById('sendBtn').disabled = false;
            }
        }

        function speakChat() {
            if (!lastBotMessageText) { alert("Нет текста для озвучки."); return; }
            const bgMusic = document.getElementById('bgMusic');
            let originalVolume = bgMusic.volume;
            if (!bgMusic.paused) bgMusic.volume = 0.1; 

            const utterance = new SpeechSynthesisUtterance(lastBotMessageText);
            utterance.lang = 'ru-RU';
            utterance.onend = () => { if (!bgMusic.paused) bgMusic.volume = originalVolume; };
            utterance.onerror = () => { if (!bgMusic.paused) bgMusic.volume = originalVolume; };
            
            window.speechSynthesis.speak(utterance);
        }

        function toggleView() {
            isChatMode = !isChatMode;
            const chatDiv = document.getElementById('chatContainer');
            const scriptDiv = document.getElementById('scriptContainer');
            const btn = document.getElementById('toggleViewBtn');

            if (isChatMode) {
                btn.innerText = "📜 Переключить в режим сценария";
                chatDiv.style.display = 'flex';
                scriptDiv.style.display = 'none';
            } else {
                btn.innerText = "💬 Вернуться в режим чата";
                chatDiv.style.display = 'none';
                scriptDiv.style.display = 'block';
                generateScriptWithImages();
            }
            closeModal('settingsModal');
        }

        async function generateScriptWithImages() {
            const scriptDiv = document.getElementById('scriptContainer');
            document.getElementById('mainLoader').style.display = 'block';
            scriptDiv.innerHTML = '';
            
            let fullText = "";
            chatHistory.forEach(msg => {
                if (msg.role === 'user') fullText += `**Вы:** ${msg.text}\n\n`;
                else fullText += `${msg.text}\n\n`;
            });

            const paragraphs = fullText.split('\n').filter(p => p.trim().length > 0);
            
            let imgInterval = 0;
            if (paragraphs.length <= 10) imgInterval = 10; 
            else if (paragraphs.length > 10 && paragraphs.length <= 100) imgInterval = 50;
            else if (paragraphs.length > 100) imgInterval = 100;

            let finalHTML = '';
            const stylePrompt = selectedGenre !== "Случайный" ? `, стиль: ${selectedGenre}` : '';

            if (paragraphs.length <= 10) {
                const firstPrompt = paragraphs[0] || "Сцена";
                const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(firstPrompt.substring(0, 100) + stylePrompt)}?width=1024&height=1024&nologo=true`;
                finalHTML += `<img src="${imgUrl}" alt="Обложка">`;
            }

            for (let i = 0; i < paragraphs.length; i++) {
                finalHTML += `<p>${paragraphs[i].replace(/\*\*Вы:\*\*/g, '<strong style="color:#3b82f6;">Вы:</strong>')}</p>`;
                
                if (imgInterval > 0 && (i + 1) % imgInterval === 0 && (i + 1) !== paragraphs.length) {
                    const imgPrompt = paragraphs[i].substring(0, 150) + stylePrompt; 
                    const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(imgPrompt)}?width=1024&height=1024&nologo=true`;
                    finalHTML += `<img src="${imgUrl}" alt="Иллюстрация">`;
                }
            }

            setTimeout(() => { 
                scriptDiv.innerHTML = finalHTML; 
                document.getElementById('mainLoader').style.display = 'none';
            }, 1500);
        }

        const bgMusic = document.getElementById('bgMusic');
        document.getElementById('openMusicBtn').onclick = () => document.getElementById('musicModal').style.display = 'flex';
        document.getElementById('musicInput').onchange = (e) => {
            const file = e.target.files[0];
            if(!file) return;
            bgMusic.src = URL.createObjectURL(file);
            document.getElementById('audioPlayer').style.display = 'flex';
            document.getElementById('musicTitle').innerText = file.name;
            bgMusic.play();
            closeModal('musicModal');
        };

        // ЖАНРЫ
        const genres = {

        function renderGenres() {
            const container = document.getElementById('genreContainer');
            for (const [category, items] of Object.entries(genres)) {
                const catDiv = document.createElement('div'); 
                catDiv.className = 'genre-category'; 
                catDiv.innerText = category;
                
                const listDiv = document.createElement('div'); 
                listDiv.className = 'genre-list';
                
                items.forEach(item => {
                    const itemDiv = document.createElement('div'); 
                    itemDiv.className = 'genre-item'; 
                    itemDiv.innerText = item;
                    if (item === selectedGenre) itemDiv.classList.add('selected');
                    
                    itemDiv.onclick = () => { 
                        selectedGenre = item; 
                        document.querySelectorAll('.genre-item').forEach(el => el.classList.remove('selected'));
                        itemDiv.classList.add('selected');
                        closeModal('genreModal'); 
                        alert("Стиль иллюстраций: " + item); 
                    };
                    listDiv.appendChild(itemDiv);
                });
                
                catDiv.onclick = () => { 
                    const isHidden = listDiv.style.display === 'block' || listDiv.style.display === '';
                    document.querySelectorAll('.genre-list').forEach(el => el.style.display = 'none');
                    document.querySelectorAll('.genre-category').forEach(el => el.classList.remove('active'));
                    
                    if (isHidden) {
                        listDiv.style.display = 'none';
                        catDiv.classList.remove('active');
                    } else {
                        listDiv.style.display = 'block';
                        catDiv.classList.add('active');
                    }
                };
                container.appendChild(catDiv); 
                container.appendChild(listDiv);
            }
        }
        renderGenres();

        function renderLangs(filter = "") {
            const list = document.getElementById('langList');
            list.innerHTML = '';
            // Фильтруем список
            const filtered = allLangs.filter(l => l.n.toLowerCase().includes(filter.toLowerCase()) || l.c.includes(filter.toLowerCase()));
            
            if (filtered.length === 0) {
                list.innerHTML = '<div style="color:#888; text-align:center; grid-column: span 2;">Ничего не найдено</div>';
            } else {
                filtered.forEach(l => {
                    const d = document.createElement('div'); 
                    d.className = 'lang-item'; 
                    d.innerText = l.n;
                    d.onclick = () => { alert("Выбран язык: " + l.n); closeModal('langModal'); };
                    list.appendChild(d);
                });
            }
        }
