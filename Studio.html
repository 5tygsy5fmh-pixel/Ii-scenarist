<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cometa AI Studio</title>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body { margin: 0; padding: 0; background-color: #050505; color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        * { box-sizing: border-box; }

        /* ШАПКА */
        .header { display: flex; align-items: center; justify-content: space-between; padding: 10px 15px; background: #000; border-bottom: 1px solid #222; z-index: 10; }
        .logo { font-weight: 900; font-size: 18px; background: linear-gradient(90deg, #10b981, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-controls { display: flex; gap: 6px; align-items: center; }
        .icon-btn { background: #111; border: 1px solid #333; color: #fff; padding: 8px; border-radius: 50%; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; transition: 0.2s; }
        .icon-btn:hover { background: #222; }
        
        /* ЖЕЛТЫЙ ЭКРАН ВХОДА */
        #loginScreen { display: none; position: fixed; inset: 0; z-index: 2000; background: #fbc02d; align-items: center; justify-content: center; flex-direction: column; overflow: hidden; }
        #loginScreen::before { content: ''; position: absolute; width: 200vw; height: 200vh; background: repeating-conic-gradient(from 0deg, rgba(255,255,255,0.4) 0deg 15deg, transparent 15deg 30deg); animation: rotateRays 30s linear infinite; }
        @keyframes rotateRays { 100% { transform: rotate(360deg); } }
        
        .login-box { position: relative; z-index: 2; width: 260px; height: 260px; background: rgba(255,255,255,0.95); border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; flex-direction: column; text-align: center; padding: 20px; cursor: pointer; }
        .login-box h2 { color: #333; margin: 0 0 10px 0; font-size: 26px; font-weight: 900; }
        .login-box p { color: #555; font-size: 14px; line-height: 1.4; font-weight: 600; }
        .skip-btn { position: absolute; top: 20px; right: 20px; z-index: 2; background: rgba(0,0,0,0.2); color: #000; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 14px; }

        /* ВЕРРИТИ */
        #verityContainer { display: none; position: fixed; z-index: 3000; width: 50px; height: 50px; cursor: grab; touch-action: none; }
        #verityContainer:active { cursor: grabbing; }
        
        .verity-face {
            width: 50px; height: 50px; background: #ffd21e; border-radius: 50%;
            position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: background 0.3s, opacity 0.3s, transform 0.3s, box-shadow 0.3s;
        }
        .verity-eye { width: 6px; height: 6px; background: #000; border-radius: 50%; position: absolute; top: 16px; transition: 0.3s; }
        .verity-eye.left { left: 13px; }
        .verity-eye.right { right: 13px; }
        .verity-mouth { width: 16px; height: 6px; background: #000; border-radius: 0 0 10px 10px; position: absolute; bottom: 12px; transition: height 0.2s; }
        
        .verity-face.angry { background: #ff5252; }
        .verity-face.angry .verity-eye { top: 20px; transform: rotate(20deg); }
        .verity-face.angry .verity-eye.right { transform: rotate(-20deg); }
        .verity-face.angry .verity-mouth { height: 3px; border-radius: 10px 10px 0 0; bottom: 15px; width: 20px; }
        
        .verity-face.blush { background: #ffb8b8; }
        .verity-face.blush::after { content: ''; position: absolute; width: 30px; height: 10px; background: rgba(255,0,0,0.3); border-radius: 50%; bottom: 8px; filter: blur(3px); }
        
        .verity-face.talking .verity-mouth { animation: talk 0.2s infinite alternate; }
        @keyframes talk { 0% { height: 6px; } 100% { height: 14px; } }

        .verity-face.sleeping { opacity: 0.6; transform: scale(0.95); animation: breathe 4s ease-in-out infinite; }
        @keyframes breathe { 0%, 100% { transform: scale(0.95); } 50% { transform: scale(1.0); } }
        
        .verity-face.startled { animation: shake 0.4s; background: #ff5252; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

        .verity-face.typing-pulse { animation: pulse-interest 1.5s infinite; }
        @keyframes pulse-interest { 0% { box-shadow: 0 0 0 0 rgba(255, 210, 30, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(255, 210, 30, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 210, 30, 0); } }
        
        /* КОТ */
        .verity-face.cat-mode { background: #ffb8b8; border-radius: 10px 10px 20px 20px; }
        .verity-face.cat-mode::before, .verity-face.cat-mode::after { content: ''; position: absolute; top: -10px; width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 15px solid #ffb8b8; z-index: -1;}
        .verity-face.cat-mode::before { left: 5px; transform: rotate(-15deg); }
        .verity-face.cat-mode::after { right: 5px; transform: rotate(15deg); }

        /* СБОЙ СИГНАЛА */
        .verity-face.glitch { animation: glitchAnim 0.2s infinite; background: #555; }
        @keyframes glitchAnim { 0% { transform: translate(0); } 20% { transform: translate(-3px, 3px); } 40% { transform: translate(-3px, -3px); } 60% { transform: translate(3px, 3px); } 80% { transform: translate(3px, -3px); } 100% { transform: translate(0); } }

        .verity-face.glow-neutral { box-shadow: 0 0 20px 5px rgba(255, 210, 30, 0.6); }
        .verity-face.glow-blush { box-shadow: 0 0 20px 5px rgba(255, 100, 100, 0.6); }
        .verity-face.glow-angry { box-shadow: 0 0 20px 8px rgba(255, 0, 0, 0.8); }
        .verity-face.glow-noir { box-shadow: 0 0 20px 5px rgba(50, 50, 150, 0.8); }

        .particle { position: absolute; pointer-events: none; font-size: 16px; animation: floatUp 1s ease-out forwards; z-index: 4000; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(0.5); } 100% { opacity: 0; transform: translateY(-40px) scale(1.2); } }

        .verity-controls { position: absolute; top: 55px; left: -35px; display: flex; gap: 8px; opacity: 0; transition: 0.3s; }
        #verityContainer:hover .verity-controls, #verityContainer.active .verity-controls { opacity: 1; }
        .v-btn { width: 30px; height: 30px; background: #111; border: 1px solid #10b981; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; font-size: 14px; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }

        /* ЛОАДЕР */
        .content-area { flex: 1; background: #0a0a0a; display: flex; flex-direction: column; overflow-y: auto; position: relative; scroll-behavior: smooth; }
        #mainLoader { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 140px; height: 140px; display: none; z-index: 100; }
        .loader-track { fill: none; stroke: #151515; stroke-width: 8; stroke-linecap: round; }
        .loader-anim { fill: none; stroke: url(#gradient); stroke-width: 8; stroke-linecap: round; stroke-dasharray: 350; stroke-dashoffset: 350; animation: loadDraw 3.5s linear infinite; }
        .loader-text { fill: #fff; font-family: 'Inter', sans-serif; font-weight: 900; font-size: 36px; text-anchor: middle; opacity: 0.9; }
        @keyframes loadDraw { 0% { stroke-dashoffset: 350; } 100% { stroke-dashoffset: 0; } }

        /* ЧАТ */
        .chat-container { padding: 15px; display: flex; flex-direction: column; gap: 15px; max-width: 800px; margin: 0 auto; width: 100%; }
        .message-row { display: flex; flex-direction: column; width: 100%; }
        .message-row.user { align-items: flex-end; }
        .message-row.bot { align-items: flex-start; }
        .message-bubble { max-width: 85%; padding: 12px 16px; border-radius: 16px; font-size: 15px; line-height: 1.5; position: relative; word-wrap: break-word; }
        .message-row.user .message-bubble { background: #3b82f6; color: #fff; border-bottom-right-radius: 4px; }
        .message-row.bot .message-bubble { background: #222; color: #eee; border-bottom-left-radius: 4px; }
        
        /* ИМЯ ПЕРСОНАЖА В ЧАТЕ */
        .speaker-name { font-size: 11px; margin-bottom: 3px; font-weight: bold; display: block; }

        .message-actions { margin-top: 5px; font-size: 12px; color: #888; cursor: pointer; }
        .message-actions span:hover { color: #10b981; }

        .edit-textarea { width: 100%; background: #000; border: 1px solid #10b981; color: #fff; padding: 10px; border-radius: 8px; font-size: 14px; resize: vertical; min-height: 80px; margin-bottom: 5px; }
        .edit-buttons { display: flex; gap: 10px; }
        .btn-small { padding: 5px 10px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; font-size: 12px; }
        .btn-save { background: #10b981; color: #000; }
        .btn-cancel { background: #444; color: #fff; }

        .script-container { padding: 20px; max-width: 800px; margin: 0 auto; width: 100%; display: none; font-size: 16px; line-height: 1.6; color: #ddd; }
        .script-container img { width: 100%; border-radius: 12px; margin: 20px 0; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .script-container p { margin-bottom: 15px; }

        /* ПАНЕЛЬ УПРАВЛЕНИЯ И ВВОД */
        .control-panel { background: #111; border-top: 1px solid #333; padding: 10px 15px; }
        .input-wrapper { display: flex; gap: 10px; align-items: flex-end; max-width: 800px; margin: 0 auto; position: relative;}
        
        .reset-btn { position: absolute; left: 10px; top: 15px; background: none; border: none; color: #666; font-size: 16px; cursor: pointer; z-index: 5; }
        .reset-btn:hover { color: #fff; }

        textarea { flex: 1; height: 50px; background: #000; border: 1px solid #333; border-radius: 12px; color: #fff; padding: 14px 14px 14px 35px; font-size: 15px; resize: none; outline: none; }
        .send-btn { width: 50px; height: 50px; background: linear-gradient(135deg, #10b981, #059669); border: none; border-radius: 12px; color: #fff; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* МОДАЛКИ */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 4000; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(5px); transition: background 0.5s; }
        /* НОВОЕ: Динамический фон для студии */
        .modal-content { background: #1a1a2e; border-radius: 16px; padding: 20px; width: 100%; max-width: 450px; max-height: 85vh; overflow-y: auto; border: 1px solid #333; transition: background 0.5s, border-color 0.5s; }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 18px; font-weight: bold; }
        .input-field { width: 100%; padding: 12px; background: #000; border: 1px solid #333; border-radius: 8px; color: #fff; margin-bottom: 15px; font-size: 14px; }
        
        .genre-category { padding: 14px; background: #111; border-radius: 10px; margin-bottom: 10px; cursor: pointer; border: 1px solid #333; font-size: 15px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
        .genre-list { display: none; margin-top: -5px; margin-bottom: 15px; padding: 10px; background: #0a0a0a; border-radius: 0 0 10px 10px; border: 1px solid #333; border-top: none; }
        .genre-item { padding: 10px 12px; background: #1a1a1a; border-radius: 6px; margin-bottom: 6px; font-size: 14px; cursor: pointer; color: #ccc; }
        .genre-item.selected { background: rgba(16, 185, 129, 0.2); color: #10b981; border-color: #10b981; font-weight: bold; }

        .lang-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .lang-item { padding: 10px; background: #111; border-radius: 8px; cursor: pointer; border: 1px solid #222; font-size: 13px; text-align: center; }
        .lang-item:hover { border-color: #10b981; }

        .audio-player { display: none; padding: 10px; background: #000; border-top: 1px solid #333; align-items: center; gap: 10px; }
        .btn-primary { flex: 1; padding: 15px; background: linear-gradient(135deg, #10b981, #059669); border: none; border-radius: 12px; color: #fff; font-size: 15px; font-weight: 800; cursor: pointer; margin-bottom: 10px; }
        .btn-secondary { flex: 1; padding: 12px; background: #333; border: none; border-radius: 12px; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 10px; }

        /* ПАНЕЛЬ ЭФИРА И СТУДИЯ */
        .panel-section { margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .panel-section h4 { margin: 0 0 8px 0; color: #aaa; font-size: 14px; }
        .trigger-row { display: flex; gap: 5px; margin-bottom: 5px; }
        .trigger-row input { flex: 1; background: #333; border: 1px solid #555; color: #fff; padding: 6px; border-radius: 4px; font-size: 12px; }
        .add-trigger-btn { background: #ff9800; color: #000; border: none; cursor: pointer; padding: 0 10px; border-radius: 4px; font-weight: bold; }
        .q-btn { background: #1a1a1a; border: 1px solid #333; color: #ccc; padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; margin: 2px; }
        .s-btn { background: #222; border: 1px solid #444; padding: 4px 8px; border-radius: 6px; font-size: 16px; cursor: pointer; margin: 2px; }

        /* НОВОЕ: СТИЛИ СТУДИИ (ЧИСТЫЕ КРУЖКИ) */
        .character-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(65px, 1fr)); gap: 15px; margin-bottom: 15px; margin-top: 10px; }
        .char-avatar { 
            width: 65px; height: 65px; 
            border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: 900; 
            color: #000; 
            cursor: pointer; 
            transition: transform 0.2s, box-shadow 0.2s; 
            position: relative; 
            font-size: 11px; 
            text-align: center;
            padding: 0 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            line-height: 1.1;
        }
        .char-avatar:hover { transform: scale(1.1); box-shadow: 0 0 15px rgba(255,255,255,0.2); }
        .char-avatar.active { border: 3px solid #fff; box-shadow: 0 0 20px currentColor; }
    </style>
</head>
<body>

    <div id="loginScreen">
        <button class="skip-btn" onclick="closeLoginScreen()">Пропустить</button>
        <div class="login-box" onclick="handleDoubleTap(event)">
            <h2>Cometa AI</h2>
            <p>Коснитесь экрана дважды, чтобы призвать своего ИИ-помощника Verity</p>
        </div>
    </div>

    <div id="verityContainer" style="top: 70%; left: 80%;">
        <div class="verity-face" id="verityFace">
            <div class="verity-eye left"></div>
            <div class="verity-eye right"></div>
            <div class="verity-mouth"></div>
        </div>
        <div class="verity-controls">
            <div class="v-btn" onclick="startVoiceInput()" title="Голос">🎤</div>
            <div class="v-btn" onclick="openVerityChat()" title="Текст">💬</div>
            <div class="v-btn" onclick="playRadio()" title="Радио">📻</div>
        </div>
    </div>

    <div class="header">
        <div class="logo">Cometa AI</div>
        <div class="header-controls">
            <button class="icon-btn" id="openBroadcastSettingsBtn" title="Студия и Настройки">⚙️</button>
            <button class="icon-btn" id="openLangBtn">🌐</button>
            <button class="icon-btn" id="loginBtn" style="width: auto; padding: 0 10px; border-radius: 20px; font-weight: bold;">Войти</button>
        </div>
    </div>

    <div class="content-area" id="contentArea">
        <svg id="mainLoader" viewBox="0 0 100 100">
            <defs>
                <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#4b74ff" /><stop offset="100%" stop-color="#51d5a7" />
                </linearGradient>
            </defs>
            <path class="loader-track" d="M 25 10 L 80 10 A 15 15 0 0 1 95 25 L 95 75 A 15 15 0 0 1 80 90 L 25 90 A 15 15 0 0 1 10 75 L 10 25 A 15 15 0 0 1 25 10 Z" />
            <path class="loader-anim" d="M 25 10 L 80 10 A 15 15 0 0 1 95 25 L 95 75 A 15 15 0 0 1 80 90 L 25 90 A 15 15 0 0 1 10 75 L 10 25 A 15 15 0 0 1 25 10 Z" />
            <text x="50" y="62" class="loader-text">AI</text>
        </svg>

        <div class="chat-container" id="chatContainer"></div>
        <div class="script-container" id="scriptContainer"></div>
    </div>

    <div class="audio-player" id="audioPlayer">
        <audio id="bgMusic" loop></audio>
        <span style="font-size: 12px; color: #10b981;" id="musicTitle">Фон играет</span>
        <button onclick="stopRadio()" style="background:none; border:none; color:#fff; cursor:pointer;">⏸</button>
    </div>

    <div class="control-panel">
        <div class="input-wrapper">
            <button class="reset-btn" onclick="document.getElementById('aiPrompt').value = ''; document.getElementById('aiPrompt').focus();" title="Очистить">🔄</button>
            <textarea id="aiPrompt" placeholder="Напиши сообщение..." rows="1" onkeypress="handleEnter(event)" oninput="handleTyping()"></textarea>
            <button class="send-btn" onclick="speakChat()" style="background: #3b82f6;">🔊</button>
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <!-- ПАНЕЛЬ НАСТРОЕК И СТУДИИ -->
    <div class="modal" id="broadcastSettingsModal">
        <div class="modal-content" id="studioModalContent">
            <div class="modal-header"><span>⚙️ Настройки эфира</span><button onclick="closeModal('broadcastSettingsModal')" style="background:none;border:none;color:#fff;font-size:20px;">✕</button></div>
            
            <div class="panel-section">
                <h4>🎙️ Студия: Персонажи</h4>
                <div id="characterList" class="character-grid"></div>
                <button class="q-btn" onclick="addNewCharacter()" style="width:100%; margin-top:10px;">➕ Добавить друга</button>
            </div>

            <div class="panel-section">
                <h4>Реакции и фишки</h4>
                <label style="display:block; margin-bottom:5px; font-size:13px;"><input type="checkbox" id="enableCatMode" checked> Режим кота (3 клика)</label>
                <label style="display:block; margin-bottom:5px; font-size:13px;"><input type="checkbox" id="enableGlitch" checked> Сбой эфира (рандомный)</label>
                <label style="display:block; margin-bottom:5px; font-size:13px;"><input type="checkbox" id="enableCoffeeCycle"> Угостить кофе (раз в N минут)</label>
                <label style="font-size:12px; color:#888;">Интервал (минут): <input type="number" id="coffeeInterval" value="5" style="width:50px; background:#000; color:#fff; border:1px solid #333;"></label>
            </div>

            <div class="panel-section">
                <h4>Триггер-фразы (Как в Алисе)</h4>
                <div class="trigger-row">
                    <input type="text" id="triggerInput" placeholder="Если скажут...">
                    <input type="text" id="responseInput" placeholder="Ответить...">
                    <button class="add-trigger-btn" onclick="addTrigger()">+</button>
                </div>
                <div id="triggersList" style="max-height:100px; overflow-y:auto; font-size:12px; margin-top:5px;"></div>
            </div>

            <div class="panel-section">
                <h4>Быстрые промпты</h4>
                <button class="q-btn" onclick="insertPrompt('threeAngles')">🎭 3 угла</button>
                <button class="q-btn" onclick="insertPrompt('radioPlay')">🎙️ Радиоспектакль</button>
                <button class="q-btn" onclick="insertPrompt('minecraft')">⛏️ Minecraft</button>
                <button class="q-btn" onclick="insertPrompt('tiktok')">📱 TikTok</button>
            </div>

            <div class="panel-section">
                <h4>Звуковая палитра</h4>
                <button class="s-btn" onclick="addSound('🌧️ дождь')">🌧️</button>
                <button class="s-btn" onclick="addSound('🚪 скрип двери')">🚪</button>
                <button class="s-btn" onclick="addSound('🎸 гитарный рифф')">🎸</button>
                <button class="s-btn" onclick="addSound('🥁 ударные')">🥁</button>
            </div>

            <button class="btn-primary" onclick="saveBroadcastSettings()" style="background: linear-gradient(135deg, #f59e0b, #ef4444);">Сохранить настройки</button>
        </div>
    </div>

    <!-- МОДАЛКИ ЯЗЫКОВ -->
    <div class="modal" id="langModal">
        <div class="modal-content">
            <div class="modal-header"><span>🌐 Языки</span><button onclick="closeModal('langModal')" style="background:none;border:none;color:#fff;font-size:20px;">✕</button></div>
            <input type="text" id="langSearch" class="input-field" placeholder="Поиск языка..." oninput="filterLangs()">
            <div id="langList" class="lang-grid"></div>
        </div>
    </div>
    
    <div class="modal" id="verityChatModal">
        <div class="modal-content" style="background: #2a2a2a;">
            <div class="modal-header"><span>💬 Чат с Verity</span><button onclick="closeModal('verityChatModal')" style="background:none;border:none;color:#fff;font-size:20px;">✕</button></div>
            <div id="verityChatHistory" style="height: 200px; overflow-y: auto; background: #111; padding: 10px; border-radius: 10px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px;">
                <div style="font-size: 12px; color: #888;">Задай мне вопрос или попроси идею!</div>
            </div>
            <div style="display: flex; gap: 5px;">
                <input type="text" id="verityInput" class="input-field" style="margin-bottom:0;" placeholder="Написать Verity...">
                <button class="btn-primary" style="margin-bottom:0; padding: 10px;" onclick="sendVerityText()">➤</button>
            </div>
        </div>
    </div>

    <script>

        function startDrag(e) {
            isDragging = false;
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;

            offsetX = clientX - verityContainer.getBoundingClientRect().left;
            offsetY = clientY - verityContainer.getBoundingClientRect().top;
            
            document.addEventListener('mousemove', drag);
            document.addEventListener('touchmove', drag, {passive: false});
            document.addEventListener('mouseup', stopDrag);
            document.addEventListener('touchend', stopDrag);
        }
        
        function drag(e) {
            e.preventDefault();
            isDragging = true;
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            verityContainer.style.left = (clientX - offsetX) + 'px';
            verityContainer.style.top = (clientY - offsetY) + 'px';
        }
        
        function stopDrag() {
            document.removeEventListener('mousemove', drag);

        function playJingle() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.2);
                osc.frequency.exponentialRampToValueAtTime(660, ctx.currentTime + 0.4);
                
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.8);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start();
                osc.stop(ctx.currentTime + 0.8);
            } catch(e) { console.warn("Джингл не сработал"); }
        }

        // --- ГОЛОС ---
        function speakVerity(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = selectedLanguage === 'ru' ? 'ru-RU' : (selectedLanguage === 'en' ? 'en-US' : selectedLanguage); 
                
                const hour = new Date().getHours();
                const isNight = hour >= 23 || hour < 6;
                
                if (isNight) {
                    utterance.pitch = 0.8; utterance.volume = 0.4; utterance.rate = 0.9;
                } else {
                    // Настраиваем тон под возраст и пол активного персонажа
                    if (activeChar.ageGroup === 'child') utterance.pitch = 1.6;
                    else if (activeChar.gender === 'female') utterance.pitch = 1.3;
                    else utterance.pitch = 1.0;
                }

                utterance.onstart = () => {
                    verityFace.classList.add('talking');
                    setGlow('glow-neutral');
                    verityFace.style.transform = `rotate(${Math.random() > 0.5 ? 5 : -5}deg)`;
                };
                utterance.onend = () => {
                    verityFace.classList.remove('talking');
                    setGlow(null);
                    verityFace.style.transform = 'rotate(0deg)';
                };
                utterance.onerror = () => {
                    verityFace.classList.remove('talking');
                    setGlow(null);
                    verityFace.style.transform = 'rotate(0deg)';
                };
                window.speechSynthesis.speak(utterance);
            }
        }

            const recognition = new SpeechRecognition();
            recognition.lang = selectedLanguage === 'ru' ? 'ru-RU' : (selectedLanguage === 'en' ? 'en-US' : selectedLanguage);
            recognition.interimResults = false;
            
            recognition.onstart = () => { speakVerity("Я слушаю..."); resetVerityIdle(); };
            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                processVerityRequest(text);

            recognition.start();

        // --- ЛОГИКА ОТВЕТА (С УЧЕТОМ ПОЛА И ВОЗРАСТА) ---
        async function processVerityRequest(text) {
            const chatHistoryBox = document.getElementById('verityChatHistory');
            chatHistoryBox.scrollTop = chatHistoryBox.scrollHeight;
            const loadingId = 'loading-' + Date.now();
            chatHistoryBox.innerHTML += `<div id="${loadingId}" style="font-size:12px; color:#aaa; font-style:italic;">Verity думает...</div>`;
            chatHistoryBox.scrollTop = chatHistoryBox.scrollHeight;

            const customResponse = checkTriggers(text);
            if (customResponse) {
                document.getElementById(loadingId).remove();
                chatHistoryBox.innerHTML += `<div style="background:#444; padding:8px; border-radius:8px; align-self:flex-start; font-size:13px; color:#fff; max-width:80%;">${customResponse}</div>`;
                speakVerity(customResponse);
                return;
            }

            const apiKey = localStorage.getItem('cometa_api_key');
            if (!apiKey) {
                document.getElementById(loadingId).remove();
                speakVerity("Я бы с радостью ответила, но хозяин не дал мне API ключ. Добавь его в настройках (⚙️)!");
                return;
            }

            try {
                const traits = getBehaviorTraits(activeChar);
                const systemMsg = `${activeChar.prompt} Особенности речи и поведения: ${traits} ВАЖНО: Отвечай строго на языке: ${selectedLanguageName}.`;

                const res = await fetch("https://api.openai.com/v1/chat/completions", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                    body: JSON.stringify({ 
                        model: "gpt-3.5-turbo", 
                        messages: [
                            { role: 'system', content: systemMsg },
                            { role: 'user', content: text }
                        ] 
                    })
                });
                const data = await res.json();
                const reply = data.choices[0].message.content;
                
                document.getElementById(loadingId).remove();
                chatHistoryBox.innerHTML += `<div style="background:#444; padding:8px; border-radius:8px; align-self:flex-start; font-size:13px; color:#fff; max-width:80%;">${reply}</div>`;
                chatHistoryBox.scrollTop = chatHistoryBox.scrollHeight;
                
                speakVerity(reply);
                verityFace.classList.add('blush'); setGlow('glow-blush');
                setTimeout(() => { verityFace.classList.remove('blush'); setGlow(null); }, 2000);
                
            } catch(e) { 
                document.getElementById(loadingId).remove();
                verityFace.classList.add('startled');
                speakVerity("Ой, кажется, я запуталась в проводах... Дай мне пару секунд, я всё пересоберу.");
                setTimeout(() => verityFace.classList.remove('startled'), 2000);
            }
        }

        // --- ОСНОВНОЙ ЧАТ ---
        document.getElementById('openLangBtn').onclick = () => { 
            document.getElementById('langSearch').value = ''; renderLangs(); document.getElementById('langModal').style.display = 'flex'; 
        };

        function renderChat() {
            const container = document.getElementById('chatContainer');
            container.innerHTML = '';
            chatHistory.forEach((msg, index) => {
                const row = document.createElement('div');
                row.className = `message-row ${msg.role}`;
                const bubble = document.createElement('div');
                bubble.className = 'message-bubble';
                
                if (msg.role === 'bot' && msg.speaker) {
                    bubble.innerHTML = `<span class="speaker-name" style="color:${msg.color}">${msg.speaker}</span>${msg.text.replace(/\n/g, '<br>')}`;
                } else {
                    bubble.innerHTML = msg.text.replace(/\n/g, '<br>');
                }
                
                row.appendChild(bubble);
                if (index === chatHistory.length - 1) {
                    const actions = document.createElement('div');
                    actions.className = 'message-actions';
                    actions.innerHTML = `<span onclick="editMessage(${index})">✏️ Редактировать</span>`;
                    row.appendChild(actions);
                }
                container.appendChild(row);
            });
            document.getElementById('contentArea').scrollTop = document.getElementById('contentArea').scrollHeight;
        }

        function addMessageToChat(role, text, speaker = null, color = null) { 
            chatHistory.push({ role, text, speaker, color }); 
            if(role === 'bot') lastBotMessageText = text; 
            renderChat(); 
        }

        function editMessage(index) {
            const msg = chatHistory[index];
            const rows = document.getElementById('chatContainer').querySelectorAll('.message-row');
            rows[index].innerHTML = `<textarea class="edit-textarea" id="editInput-${index}">${msg.text}</textarea><div class="edit-buttons"><button class="btn-small btn-save" onclick="saveEditedMessage(${index})">Сохранить</button><button class="btn-small btn-cancel" onclick="renderChat()">Отмена</button></div>`;
        }

        function saveEditedMessage(index) { 
            chatHistory[index].text = document.getElementById('editInput-'+index).value; 
            if(chatHistory[index].role === 'bot') lastBotMessageText = chatHistory[index].text; 
            renderChat(); 
        }
        
        function handleEnter(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }

        function sendMessage() {
            const input = document.getElementById('aiPrompt');
            const text = input.value.trim();
            if (!text) return;

            if (text === text.toUpperCase() && text.length > 3 || text.split('!').length > 2) {
                verityFace.classList.add('startled');
                speakVerity("Тише, я же прямо тут!");
                setTimeout(() => verityFace.classList.remove('startled'), 1000);
            }
            resetVerityIdle();

            const customResponse = checkTriggers(text);
            if (customResponse) {
                addMessageToChat('user', text);
                input.value = '';
                setTimeout(() => {
                    addMessageToChat('bot', customResponse, activeChar.name, activeChar.color);
                    speakVerity(customResponse);
                }, 500);
                return; 
            }

            addMessageToChat('user', text);
            input.value = '';
            sendToAPI();
        }

        async function sendToAPI() {
            const apiKey = localStorage.getItem('cometa_api_key');
            if (!apiKey) { alert("Введите API ключ в настройках!"); return; }

            document.getElementById('mainLoader').style.display = 'block';
            if(verityFace) {
                verityFace.style.transform = 'rotate(-5deg)';
                setGlow('glow-neutral');
            }
            
            try {
                const traits = getBehaviorTraits(activeChar);
                let systemMsg = `${activeChar.prompt} Особенности речи: ${traits} ВАЖНО: Отвечай на языке: ${selectedLanguageName}.`;
                let messages = [{ role: 'system', content: systemMsg }];
                chatHistory.forEach(msg => messages.push({ role: msg.role === 'bot' ? 'assistant' : 'user', content: msg.text }));

                const res = await fetch("https://api.openai.com/v1/chat/completions", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                    body: JSON.stringify({ model: "gpt-3.5-turbo", messages: messages })
                });
                
                if (!res.ok) throw new Error("Ошибка API");
                const data = await res.json();
                const reply = data.choices[0].message.content;
                
                addMessageToChat('bot', reply, activeChar.name, activeChar.color);

                // ШАНС НА ПЕРЕБИВАНИЕ (20%)
                if (Math.random() < 0.2 && characters.length > 1) {
                    setTimeout(() => triggerInterruption(), 2000);
                }

            } catch (e) { 
                if(verityContainer.style.display === 'block') {
                    verityFace.classList.add('startled');
                    speakVerity("Ой, кажется, я запуталась в проводах... Дай мне пару секунд, я всё пересоберу.");
                    setTimeout(() => verityFace.classList.remove('startled'), 2000);
                } else {
                    alert("Ошибка ИИ: " + e.message);
                }
            } 
            finally { 
                document.getElementById('mainLoader').style.display = 'none'; 
                if(verityFace) { verityFace.style.transform = 'rotate(0deg)'; setGlow(null); }
            }
        }

        // --- НОВОЕ: ПЕРЕБИВАНИЕ С УЧЕТОМ ХАРАКТЕРА ---
        async function triggerInterruption() {
            const others = characters.filter(c => c.id !== activeChar.id);
            if(others.length === 0) return;
            
            const interrupter = others[Math.floor(Math.random() * others.length)];
            const apiKey = localStorage.getItem('cometa_api_key');
            if(!apiKey) return;

            const oldColor = verityFace.style.background;
            verityFace.style.background = interrupter.color;
            verityFace.style.transform = 'scale(0.9)';
            setTimeout(() => verityFace.style.transform = 'scale(1)', 100);

            try {
                const traits = getBehaviorTraits(interrupter);
                const res = await fetch("https://api.openai.com/v1/chat/completions", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                    body: JSON.stringify({ 
                        model: "gpt-3.5-turbo", 
                        messages: [
                            { role: 'system', content: `${interrupter.prompt} Твои особенности: ${traits} Только что ответил ${activeChar.name}. Вставь короткую реплику (1 предложение), чтобы прокомментировать это. Не начинай с "Я думаю".` },
                            { role: 'user', content: "..." }
                        ] 
                    })
                });
                const data = await res.json();
                const reply = data.choices[0].message.content;
                
                addMessageToChat('bot', reply, interrupter.name, interrupter.color);
                speakVerity(reply);
                
            } catch(e) { console.warn("Перебивание не удалось"); }

            setTimeout(() => { verityFace.style.background = oldColor; }, 3000);
        }

        function speakChat() { if(lastBotMessageText) speakVerity(lastBotMessageText); }

        // --- СПИСОК ЯЗЫКОВ ---
        const allLangs = [{ c: 'ru', n: 'Русский' }, { c: 'en', n: 'English' }, { c: 'uk', n: 'Українська' }, { c: 'de', n: 'Deutsch' }, { c: 'fr', n: 'Français' }, { c: 'es', n: 'Español' }, { c: 'zh', n: '简体中文' }, { c: 'ja', n: '日本語' }, { c: 'ko', n: '한국어' }, { c: 'pl', n: 'Polski' }, { c: 'tr', n: 'Türkçe' }, { c: 'pt', n: 'Português' }, { c: 'en_pt', n: 'Pirate Speak' }, { c: 'en_ws', n: 'Shakespearean' }, { c: 'en_ud', n: 'Upside Down' }, { c: 'lol', n: 'LOLCAT' }, { c: 'tlh', n: 'Klingon' }, { c: 'qya', n: 'Elvish (Quenya)' }, { c: 'sjn', n: 'Sindarin' }];
        function renderLangs(filter = "") {
            const list = document.getElementById('langList');
            list.innerHTML = '';
            const filtered = allLangs.filter(l => l.n.toLowerCase().includes(filter.toLowerCase()) || l.c.includes(filter.toLowerCase()));
            filtered.forEach(l => {
                const d = document.createElement('div'); d.className = 'lang-item'; d.innerText = l.n;
                d.onclick = () => { 
                    selectedLanguage = l.c; selectedLanguageName = l.n;
                    localStorage.setItem('cometa_language', l.c); localStorage.setItem('cometa_language_name', l.n);
                    alert("Язык изменен на: " + l.n); closeModal('langModal'); 
                    if(verityContainer.style.display === 'block') speakVerity("Язык изменен! Теперь я говорю на " + l.n);
                };
                list.appendChild(d);
            });
        }
        function filterLangs() { renderLangs(document.getElementById('langSearch').value); }
        renderLangs();

        // Инициализация при загрузке
        window.addEventListener('DOMContentLoaded', () => {
            updateCoffeeCycle();
            addMessageToChat('bot', "Привет! Я Cometa AI. Настрой меня в ⚙️ и давай начнем!");
        });
    </script>
</body>
</html>
