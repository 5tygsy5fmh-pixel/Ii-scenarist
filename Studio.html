<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Studio PRO</title>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
    
    <!-- Puter.js для видео -->
    <script src="https://js.puter.com/v2/"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body { margin: 0; padding: 0; background-color: #050505; color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        * { box-sizing: border-box; }
        
        /* Шапка */
        .header { display: flex; align-items: center; justify-content: space-between; padding: 10px 15px; background: #000; border-bottom: 1px solid #222; z-index: 10; }
        .logo { font-weight: 900; font-size: 16px; background: linear-gradient(90deg, #10b981, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-controls { display: flex; gap: 8px; align-items: center; }
        .icon-btn { background: #111; border: 1px solid #333; color: #fff; padding: 8px; border-radius: 50%; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; }
        
        /* Зона предпросмотра */
        .preview-area { flex: 1; background: #0a0a0a; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .preview-placeholder { text-align: center; color: #444; font-size: 14px; font-weight: 600; padding: 20px; }
        
        /* Панель управления */
        .control-panel { background: #111; border-top: 1px solid #333; display: flex; flex-direction: column; }
        .tools { display: flex; padding: 10px; gap: 10px; overflow-x: auto; border-bottom: 1px solid #222; }
        .tools::-webkit-scrollbar { display: none; }
        .tool-btn { flex: 0 0 auto; background: #1a1a1a; border: 1px solid #333; color: #aaa; padding: 10px 15px; border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
        .tool-btn.active { background: rgba(16, 185, 129, 0.1); border-color: #10b981; color: #10b981; }
        
        .input-area { padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        textarea { width: 100%; height: 60px; background: #000; border: 1px solid #333; border-radius: 12px; color: #fff; padding: 12px; font-size: 14px; resize: none; outline: none; }
        textarea:focus { border-color: #10b981; }
        
        .action-buttons { display: flex; gap: 10px; }
        .btn-primary { flex: 1; padding: 15px; background: linear-gradient(135deg, #10b981, #059669); border: none; border-radius: 12px; color: #fff; font-size: 15px; font-weight: 800; cursor: pointer; }
        .btn-primary:active { transform: scale(0.98); }
        .btn-primary:disabled { opacity: 0.7; }
        
        /* Модальные окна (Языки и Музыка) */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: #1a1a2e; border-radius: 16px; padding: 20px; width: 100%; max-width: 400px; max-height: 80vh; overflow-y: auto; border: 1px solid #333; }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 18px; font-weight: bold; }
        .lang-item { padding: 12px; background: #111; border-radius: 8px; margin-bottom: 8px; cursor: pointer; border: 1px solid #222; }
        .lang-item:hover { border-color: #10b981; }
        
        /* Плеер */
        .audio-player { display: none; padding: 10px; background: #000; border-top: 1px solid #333; align-items: center; gap: 10px; }
        .audio-player audio { width: 100%; height: 40px; }

        .loader { display: none; width: 30px; height: 30px; border: 3px solid #333; border-top: 3px solid #10b981; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Шапка -->
    <div class="header">
        <div class="logo">STUDIO PRO</div>
        <div class="header-controls">
            <button class="icon-btn" id="openLangBtn" title="Языки">🌐</button>
            <button class="icon-btn" id="openMusicBtn" title="Музыка">🎵</button>
            <button class="icon-btn" id="openGalleryBtn" style="display: none;" title="Галерея">📁</button>
            <button class="user-btn" id="loginBtn" style="background: #111; border: 1px solid #333; padding: 8px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer;">Войти</button>
        </div>
    </div>

    <!-- Модалка Языков -->
    <div class="modal" id="langModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>🌐 Выберите язык</span>
                <button onclick="document.getElementById('langModal').style.display='none'" style="background:none;border:none;color:#fff;font-size:20px;cursor:pointer;">✕</button>
            </div>
            <div id="langList"></div>
        </div>
    </div>

    <!-- Модалка Музыки -->
    <div class="modal" id="musicModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>🎵 Плейлист</span>
                <button onclick="document.getElementById('musicModal').style.display='none'" style="background:none;border:none;color:#fff;font-size:20px;cursor:pointer;">✕</button>
            </div>
            <input type="file" id="musicInput" accept="audio/*" style="margin-bottom: 15px; color: #aaa;">
            <div id="musicList" style="color: #888;">Музыка не загружена.</div>
        </div>
    </div>

    <!-- Плеер -->
    <div class="audio-player" id="audioPlayer">
        <audio id="bgMusic" loop></audio>
        <span style="font-size: 12px; color: #10b981;" id="musicTitle">Музыка играет</span>
    </div>

    <!-- Зона предпросмотра -->
    <div class="preview-area" id="previewArea">
        <div class="preview-placeholder" id="previewText">Здесь появится ваша сцена</div>
        <div class="loader" id="mainLoader"></div>
        <video id="videoPlayer" style="display:none; width:100%; height:100%; object-fit:contain;" controls></video>
        <img id="imageResult" style="display:none; width:100%; height:100%; object-fit:contain; padding: 10px;">
        
        <div style="display: flex; gap: 10px; margin-top: 10px;" id="actionArea" style="display: none;">
            <button id="saveBtn" class="btn-primary" style="display:none; width: 150px; padding: 10px;">💾 Сохранить</button>
            <button id="readTextBtn" class="btn-primary" style="display:none; width: 150px; padding: 10px; background: #3b82f6;">🔊 Озвучить</button>
        </div>
    </div>

    <!-- Панель управления -->
    <div class="control-panel">
        <div class="tools">
            <button class="tool-btn active" onclick="switchTool('script', this)">✍️ Сценарий</button>
            <button class="tool-btn" onclick="switchTool('image', this)">🖼️ Фото</button>
            <button class="tool-btn" onclick="switchTool('video', this)">🎬 Видео</button>
        </div>

        <div class="input-area">
            <textarea id="aiPrompt" placeholder="Напишите идею..."></textarea>
            <div class="action-buttons">
                <button class="btn-primary" id="generateBtn">Сгенерировать</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. НАСТРОЙКИ FIREBASE
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyAUIrQTOW_aDL6ziFVpXerHf6pPD6waRI8",
            authDomain: "fake-strim.firebaseapp.com",
            projectId: "fake-strim",
            storageBucket: "fake-strim.firebasestorage.app",
            messagingSenderId: "838988558430",
            appId: "1:838988558430:web:579a441e92556fb4d384cf"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const storage = firebase.storage();
        const db = firebase.firestore();

        // ==========================================
        // 2. СИСТЕМА ЯЗЫКОВ
        // ==========================================
        const languages = [
            { code: 'en', name: 'English' }, { code: 'ru', name: 'Русский' },
            { code: 'uk', name: 'Українська' }, { code: 'de', name: 'Deutsch' },
            { code: 'fr', name: 'Français' }, { code: 'es', name: 'Español' },
            { code: 'zh', name: '简体中文' }, { code: 'ja', name: '日本語' },
            { code: 'ko', name: '한국어' }, { code: 'pl', name: 'Polski' },
            { code: 'tr', name: 'Türkçe' }, { code: 'pt', name: 'Português' }
        ];

        const i18n = {
            en: { script: "✍️ Script", image: "🖼️ Image", video: "🎬 Video", gen: "Generate", thinking: "AI Arena thinking...", save: "💾 Save", read: "🔊 Read", placeholder: "Enter idea..." },
            ru: { script: "✍️ Сценарий", image: "🖼️ Фото", video: "🎬 Видео", gen: "Сгенерировать", thinking: "Арена ИИ думает...", save: "💾 Сохранить", read: "🔊 Озвучить", placeholder: "Напишите идею..." },
            uk: { script: "✍️ Сценарій", image: "🖼️ Фото", video: "🎬 Відео", gen: "Згенерувати", thinking: "Арена ШІ думає...", save: "💾 Зберегти", read: "🔊 Озвучити", placeholder: "Напишіть ідею..." }
            // Остальные языки будут использовать английский как fallback для простоты
        };

        let currentLang = localStorage.getItem('studioLang') || 'ru';

        function applyLang() {
            const dict = i18n[currentLang] || i18n['en'];
            document.querySelectorAll('.tool-btn')[0].innerText = dict.script;
            document.querySelectorAll('.tool-btn')[1].innerText = dict.image;
            document.querySelectorAll('.tool-btn')[2].innerText = dict.video;
            document.getElementById('generateBtn').innerText = dict.gen;
            document.getElementById('aiPrompt').placeholder = dict.placeholder;
            document.getElementById('saveBtn').innerText = dict.save;
            document.getElementById('readTextBtn').innerText = dict.read;
        }

        // Отрисовка меню языков
        const langListEl = document.getElementById('langList');
        languages.forEach(l => {
            const div = document.createElement('div');
            div.className = 'lang-item';
            div.innerText = l.name;
            if(l.code === currentLang) div.style.borderColor = '#10b981';
            div.onclick = () => {
                currentLang = l.code;
                localStorage.setItem('studioLang', l.code);
                applyLang();
                document.getElementById('langModal').style.display = 'none';
            };
            langListEl.appendChild(div);
        });

        document.getElementById('openLangBtn').onclick = () => document.getElementById('langModal').style.display = 'flex';
        applyLang();

        // ==========================================
        // 3. МУЗЫКА (АУДИО-ПЛЕЕР И DUCKING)
        // ==========================================
        const bgMusic = document.getElementById('bgMusic');
        const audioPlayer = document.getElementById('audioPlayer');
        const musicInput = document.getElementById('musicInput');

        document.getElementById('openMusicBtn').onclick = () => document.getElementById('musicModal').style.display = 'flex';

        musicInput.onchange = (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const url = URL.createObjectURL(file);
            bgMusic.src = url;
            audioPlayer.style.display = 'flex';
            document.getElementById('musicTitle').innerText = file.name;
            document.getElementById('musicList').innerText = "Загружено: " + file.name;
            bgMusic.play();
            document.getElementById('musicModal').style.display = 'none';
        };

        // УМНОЕ ОТКЛЮЧЕНИЕ МУЗЫКИ ПРИ ЧТЕНИИ ТЕКСТА (Ducking)
        let currentSpeakingText = "";
        
        function speakText() {
            if (!currentSpeakingText) return;
            if ('speechSynthesis' in window) {
                // Сохраняем текущую громкость музыки и делаем её тише
                const originalVolume = bgMusic.volume;
                bgMusic.volume = 0.1; 

                const utterance = new SpeechSynthesisUtterance(currentSpeakingText);
                utterance.lang = currentLang === 'ru' ? 'ru-RU' : (currentLang === 'uk' ? 'uk-UA' : 'en-US');
                
                // Когда текст прочитан, возвращаем громкость
                utterance.onend = () => { bgMusic.volume = originalVolume; };
                utterance.onerror = () => { bgMusic.volume = originalVolume; };
                
                window.speechSynthesis.speak(utterance);
            } else {
                alert("Браузер не поддерживает озвучку.");
            }
        }

        document.getElementById('readTextBtn').onclick = speakText;

        // ==========================================
        // 4. АВТОРИЗАЦИЯ
        // ==========================================
        document.getElementById('loginBtn').onclick = () => {
            if (auth.currentUser) auth.signOut();
            else {
                const provider = new firebase.auth.GoogleAuthProvider();
                auth.signInWithPopup(provider).catch(e => alert(e.message));
            }
        };

        auth.onAuthStateChanged(user => {
            const btn = document.getElementById('loginBtn');
            const galleryBtn = document.getElementById('openGalleryBtn');
            if (user) {
                btn.innerText = user.displayName ? user.displayName.split(' ')[0] : 'Выйти';
                btn.style.background = '#10b981';
                galleryBtn.style.display = 'flex';
            } else {
                btn.innerText = 'Войти';
                btn.style.background = '#111';
                galleryBtn.style.display = 'none';
            }
        });

        // ==========================================
        // 5. ГЕНЕРАЦИЯ
        // ==========================================
        let currentTool = 'script';
        const WORKER_URL = "https://твой-воркер.workers.dev"; // ВСТАВЬ СВОЙ URL

        function switchTool(tool, btn) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            document.getElementById('videoPlayer').style.display = 'none';
            document.getElementById('imageResult').style.display = 'none';
            document.getElementById('saveBtn').style.display = 'none';
            document.getElementById('readTextBtn').style.display = 'none';
            document.getElementById('previewText').style.display = 'block';
            document.getElementById('previewText').innerHTML = "Здесь появится ваша сцена";
        }

        document.getElementById('generateBtn').onclick = async function() {
            const prompt = document.getElementById('aiPrompt').value;
            if (!prompt) { alert("Введите текст!"); return; }

            document.getElementById('mainLoader').style.display = 'block';
            document.getElementById('previewText').style.display = 'none';
            document.getElementById('videoPlayer').style.display = 'none';
            document.getElementById('imageResult').style.display = 'none';
            document.getElementById('saveBtn').style.display = 'none';
            document.getElementById('readTextBtn').style.display = 'none';
            
            const dict = i18n[currentLang] || i18n['en'];
            this.innerText = dict.thinking;
            this.disabled = true;

            // --- СЦЕНАРИЙ ---
            if (currentTool === 'script') {
                try {
                    const response = await fetch(WORKER_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ prompt: prompt, toolType: 'script' })
                    });
                    const data = await response.json();
                    currentSpeakingText = data.text;
                    
                    document.getElementById('previewText').style.display = 'block';
                    document.getElementById('previewText').innerHTML = `<div style="text-align:left; font-size:14px; line-height:1.6; color: #ddd; overflow-y:auto; max-height: 100%; padding: 15px;">${data.text.replace(/\n/g, '<br>')}</div>`;
                    document.getElementById('readTextBtn').style.display = 'block';
                } catch (error) {
                    alert("Ошибка: " + error.message);
                    document.getElementById('previewText').style.display = 'block';
                } finally {
                    document.getElementById('mainLoader').style.display = 'none';
                    this.innerText = dict.gen;
                    this.disabled = false;
                }
            } 
            // --- ФОТО ---
            else if (currentTool === 'image') {
                const encodedPrompt = encodeURIComponent(prompt);
                const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=1024&height=1024&nologo=true&seed=${Math.floor(Math.random() * 100000)}`;
                const imgElement = document.getElementById('imageResult');
                
                imgElement.onload = () => {
                    document.getElementById('mainLoader').style.display = 'none';
                    imgElement.style.display = 'block';
                    document.getElementById('saveBtn').style.display = 'block';
                    this.innerText = dict.gen;
                    this.disabled = false;
                };
                imgElement.onerror = () => {
                    alert("Ошибка загрузки картинки.");
                    document.getElementById('mainLoader').style.display = 'none';
                    document.getElementById('previewText').style.display = 'block';
                    this.innerText = dict.gen;
                    this.disabled = false;
                };
                imgElement.src = imageUrl;
            }
            // --- ВИДЕО ---
            else if (currentTool === 'video') {
                try {
                    const encodedPrompt = encodeURIComponent(prompt);
                    const baseImageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=1024&height=1024&nologo=true&seed=${Math.floor(Math.random() * 100000)}`;
                    const img = new Image(); img.crossOrigin = "Anonymous"; 
                    
                    img.onload = async () => {
                        try {
                            const canvas = document.createElement('canvas');
                            canvas.width = 1920; canvas.height = 1080;
                            const ctx = canvas.getContext('2d');
                            ctx.imageSmoothingEnabled = true; ctx false.imageSmoothingQuality = 'high';
                           ;
 ctx.drawImage(img,                0, 0, canvas.width }
, canvas.height);
                            
                                       const videoElement = await puter.ai.txt2vid(prompt, {
                                model: "google/veo-2.0", input_reference: canvas.toDataURL('image/jpeg', 0.95), duration: 5, size: "1280x720" 
                            });

                            const videoPlayer = document.getElementById('videoPlayer');
                            videoPlayer.src = videoElement.src;
                            videoPlayer.style.display = 'block';
                            videoPlayer.play();
                            
                            document.getElementById('mainLoader').style.display = 'none';
                            document.getElementById('saveBtn').style.display = 'block';
                            document.getElementById('generateBtn').innerText = dict.gen;
                            document.getElementById('generateBtn').disabled = false;
                        } catch (innerError) { throw new Error("Ошибка видео: " + innerError.message); }
                    };
                    img.onerror = () => { throw new Error("Ошибка загрузки картинки."); };
                    img.src = baseImageUrl;
                } catch (error) {
                    alert(error.message);
                    document.getElementById('mainLoader').style.display = 'none';
                    document.getElementById('previewText').style.display = 'block';
                    this.innerText = dict.gen;
                    this.disabled = }
        };

        // ==========================================
        // 6. СОХРАНЕНИЕ
        // ==========================================
        document.getElementById('saveBtn').onclick = async function() {
            const user = auth.currentUser;
            if (!user) { alert("Войдите в аккаунт!"); return; }

            const btn = this; const originalText = btn.innerText;
            btn.innerText = 'Сохранение...'; btn.disabled = true;

            try {
                let fileUrl = ''; let fileExtension = ''; let contentType = currentTool; let blob;

                if (currentTool === 'image') {
                    fileUrl = document.getElementById('imageResult').src;
                    fileExtension = 'jpg';
                    blob = await (await fetch(fileUrl)).blob();
                } else if (currentTool === 'video') {
                    fileUrl = document.getElementById('videoPlayer').src;
                    fileExtension = 'mp4';
                    blob = await (await fetch(fileUrl)).blob();
                }

                const filename = `ai_${Date.now()}.${fileExtension}`;
                const snapshot = await storage.ref(`users/${user.uid}/${filename}`).put(blob);
                const downloadURL = await snapshot.ref.getDownloadURL();

                await db.collection('projects').add({
                    userId: user.uid, type: contentType, format: fileExtension,
                    prompt: document.getElementById('aiPrompt').value, fileUrl: downloadURL,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(), isDeleted: false 
                });

                btn.innerText = '✅ Сохранено!';
                setTimeout(() => { btn.innerText = originalText; btn.disabled = false; }, 2000);
            } catch (error) {
                alert("Ошибка: " + error.message);
                btn.innerText = originalText; btn.disabled = false;
            }
        };
    </script>
</body>
</html>
