<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cometa AI Studio</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        
        body { margin: 0; padding: 0; background-color: #050505; color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        * { box-sizing: border-box; }
        
        .header { display: flex; align-items: center; justify-content: space-between; padding: 10px 15px; background: #000; border-bottom: 1px solid #222; z-index: 10; }
        .logo { font-weight: 900; font-size: 18px; background: linear-gradient(90deg, #10b981, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-controls { display: flex; gap: 6px; align-items: center; }
        .icon-btn { background: #111; border: 1px solid #333; color: #fff; padding: 8px; border-radius: 50%; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; transition: 0.2s; }
        .icon-btn:hover { background: #222; }
        
        #loginScreen { display: none; position: fixed; inset: 0; z-index: 2000; background: #fbc02d; align-items: center; justify-content: center; flex-direction: column; overflow: hidden; }
        #loginScreen::before { content: ''; position: absolute; width: 200vw; height: 200vh; background: repeating-conic-gradient(from 0deg, rgba(255,255,255,0.4) 0deg 15deg, transparent 15deg 30deg); animation: rotateRays 30s linear infinite; }
        @keyframes rotateRays { 100% { transform: rotate(360deg); } }
        
        .login-box { position: relative; z-index: 2; width: 280px; height: 200px; background: #dca25c; border: 12px solid #3e2723; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.1s; }
        .login-box:active { transform: scale(0.95); }
        .box-inner { width: 100%; height: 100%; display: flex; position: relative; overflow: hidden; }
        .box-left { width: 50%; height: 100%; background: #e8c452; border-right: 4px solid #b87e3a; display: flex; align-items: center; justify-content: center; }
        .box-right { width: 50%; height: 100%; background: #dca25c; display: flex; align-items: center; justify-content: center; position: relative; }
        .red-mark-top { position: absolute; top: 15px; right: 15px; width: 30px; height: 20px; border-top: 4px solid #e57373; border-right: 4px solid #e57373; border-radius: 0 5px 0 0; }
        .red-mark-bottom { position: absolute; bottom: 15px; right: 15px; width: 30px; height: 20px; border-bottom: 4px solid #e57373; border-right: 4px solid #e57373; border-radius: 0 0 5px 0; }
        .red-exclamation { font-size: 40px; font-weight: 900; color: #e57373; margin-right: 20px; }
        .broken-glass-svg { width: 50px; height: 50px; fill: #3e2723; }
        .skip-btn { position: absolute; top: 20px; right: 20px; z-index: 2; background: rgba(0,0,0,0.2); color: #000; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 14px; }

        #verityContainer { display: none; position: fixed; z-index: 3000; width: 50px; height: 50px; cursor: grab; touch-action: none; }
        .verity-face { width: 50px; height: 50px; background: #ffd21e; border-radius: 50%; position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.4); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: background 0.3s, opacity 0.3s, transform 0.3s; }
        .verity-eye { width: 6px; height: 6px; background: #000; border-radius: 50%; position: absolute; top: 16px; transition: 0.3s; }
        .verity-eye.left { left: 13px; } .verity-eye.right { right: 13px; }
        .verity-mouth { width: 16px; height: 6px; background: #000; border-radius: 0 0 10px 10px; position: absolute; bottom: 12px; transition: height 0.2s; }
        .verity-face.talking .verity-mouth { animation: talk 0.2s infinite alternate; }
        @keyframes talk { 0% { height: 6px; } 100% { height: 14px; } }
        .verity-face.sleeping { opacity: 0.6; transform: scale(0.95); animation: breathe 4s ease-in-out infinite; }
        @keyframes breathe { 0%, 100% { transform: scale(0.95); } 50% { transform: scale(1.0); } }
        .verity-face.angry { background: #ff5252 !important; }
        .verity-face.blush { background: #ffb8b8 !important; }
        .verity-face.startled { animation: shake 0.4s; background: #ff5252 !important; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .verity-controls { position: absolute; top: 55px; left: -35px; display: flex; gap: 8px; opacity: 0; transition: 0.3s; }
        #verityContainer:hover .verity-controls, #verityContainer.active .verity-controls { opacity: 1; }
        .v-btn { width: 30px; height: 30px; background: #111; border: 1px solid #10b981; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; font-size: 14px; }

        .content-area { flex: 1; background: #0a0a0a; display: flex; flex-direction: column; overflow-y: auto; position: relative; }
        #mainLoader { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100px; height: 100px; display: none; z-index: 100; }
        .loader-track { fill: none; stroke: #151515; stroke-width: 8; stroke-linecap: round; }
        .loader-anim { fill: none; stroke: url(#gradient); stroke-width: 8; stroke-linecap: round; stroke-dasharray: 350; stroke-dashoffset: 350; animation: loadDraw 3.5s linear infinite; }
        .loader-text { fill: #fff; font-family: 'Inter', sans-serif; font-weight: 900; font-size: 36px; text-anchor: middle; opacity: 0.9; }
        @keyframes loadDraw { 0% { stroke-dashoffset: 350; } 100% { stroke-dashoffset: 0; } }

        .chat-container { padding: 15px; display: flex; flex-direction: column; gap: 15px; max-width: 800px; margin: 0 auto; width: 100%; }
        .message-row { display: flex; flex-direction: column; width: 100%; }
        .message-row.user { align-items: flex-end; }
        .message-row.bot { align-items: flex-start; }
        .message-bubble { max-width: 85%; padding: 12px 16px; border-radius: 16px; font-size: 15px; line-height: 1.5; word-wrap: break-word; }
        .message-row.user .message-bubble { background: #3b82f6; color: #fff; border-bottom-right-radius: 4px; }
        .message-row.bot .message-bubble { background: #222; color: #eee; border-bottom-left-radius: 4px; }
        .message-actions { margin-top: 5px; font-size: 12px; color: #888; cursor: pointer; }

        .control-panel { background: #111; border-top: 1px solid #333; padding: 10px 15px; }
        .quick-tools { display: flex; gap: 8px; margin-bottom: 10px; overflow-x: auto; }
        .tool-btn { background: #1a1a1a; border: 1px solid #333; color: #ccc; padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; white-space: nowrap; }
        .input-wrapper { display: flex; gap: 10px; align-items: flex-end; max-width: 800px; margin: 0 auto; position: relative; }
        .reset-btn { position: absolute; left: 10px; top: 15px; background: none; border: none; color: #666; font-size: 16px; cursor: pointer; }
        textarea { flex: 1; height: 50px; background: #000; border: 1px solid #333; border-radius: 12px; color: #fff; padding: 14px 14px 14px 35px; font-size: 15px; resize: none; outline: none; }
        .send-btn { width: 50px; height: 50px; background: linear-gradient(135deg, #10b981, #059669); border: none; border-radius: 12px; color: #fff; font-size: 20px; cursor: pointer; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 4000; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(5px); }
        .modal-content { background: #1a1a2e; border-radius: 16px; padding: 20px; width: 100%; max-width: 450px; max-height: 85vh; overflow-y: auto; border: 1px solid #333; }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 18px; font-weight: bold; }
        .input-field { width: 100%; padding: 12px; background: #000; border: 1px solid #333; border-radius: 8px; color: #fff; margin-bottom: 15px; font-size: 14px; }
        .btn-primary { width: 100%; padding: 15px; background: linear-gradient(135deg, #10b981, #059669); border: none; border-radius: 12px; color: #fff; font-size: 15px; font-weight: 800; cursor: pointer; margin-bottom: 10px; }
        .btn-secondary { width: 100%; padding: 12px; background: #333; border: none; border-radius: 12px; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 10px; }
        
        .lang-item { padding: 10px; background: #111; border-radius: 8px; cursor: pointer; border: 1px solid #222; font-size: 13px; text-align: center; }
        .lang-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        
        .genre-category { padding: 14px; background: #111; border-radius: 10px; margin-bottom: 10px; cursor: pointer; border: 1px solid #333; font-size: 15px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
        .genre-list { display: none; margin-top: -5px; margin-bottom: 15px; padding: 10px; background: #0a0a0a; border-radius: 0 0 10px 10px; border: 1px solid #333; border-top: none; }
        .genre-item { padding: 10px 12px; background: #1a1a1a; border-radius: 6px; margin-bottom: 6px; font-size: 14px; cursor: pointer; color: #ccc; }

        .panel-section { margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .panel-section h4 { margin: 0 0 8px 0; color: #aaa; font-size: 14px; }
        .trigger-row { display: flex; gap: 5px; margin-bottom: 5px; }
        .trigger-row input { flex: 1; background: #333; border: 1px solid #555; color: #fff; padding: 6px; border-radius: 4px; font-size: 12px; }
        .add-trigger-btn { background: #ff9800; color: #000; border: none; cursor: pointer; padding: 0 10px; border-radius: 4px; font-weight: bold; }
        .q-btn { background: #1a1a1a; border: 1px solid #333; color: #ccc; padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; margin: 2px; }
        .s-btn { background: #222; border: 1px solid #444; padding: 4px 8px; border-radius: 6px; font-size: 16px; cursor: pointer; margin: 2px; }

        .character-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(65px, 1fr)); gap: 15px; margin-bottom: 15px; margin-top: 10px; }
        .char-avatar { width: 65px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #000; cursor: pointer; transition: transform 0.2s; position: relative; font-size: 11px; text-align: center; text-transform: uppercase; }
        .char-avatar.active { border: 3px solid #fff; box-shadow: 0 0 15px rgba(255,255,255,0.4); }
        
        .audio-player { display: none; padding: 10px; background: #000; border-top: 1px solid #333; align-items: center; gap: 10px; }
    </style>
</head>
<body>

    <div id="loginScreen">
        <button class="skip-btn" onclick="closeLoginScreen()">Пропустить</button>
        <div class="login-box" onclick="summonVerity()">
            <div class="box-inner">
                <div class="box-left">
                    <svg class="broken-glass-svg" viewBox="0 0 24 24">
                        <path d="M6 2h12l-1 10a5 5 0 0 1-10 0L6 2z" />
                        <path d="M12 12v8" />
                        <path d="M8 22h8" />
                        <path d="M8 6l8 6" stroke="#e8c452" stroke-width="2"/>
                    </svg>
                </div>
                <div class="box-right">
                    <div class="red-mark-top"></div>
                    <div class="red-exclamation">!</div>
                    <div class="red-mark-bottom"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="verityContainer" style="top: 70%; left: 80%;">
        <div class="verity-face" id="verityFace">
            <div class="verity-eye left"></div>
            <div class="verity-eye right"></div>
            <div class="verity-mouth"></div>
        </div>
        <div class="verity-controls">
            <div class="v-btn" onclick="startVoiceInput()">🎤</div>
            <div class="v-btn" onclick="openVerityChat()">💬</div>
            <div class="v-btn" onclick="playRadio()">📻</div>
        </div>
    </div>

    <div class="header">
        <div class="logo">Cometa AI</div>
        <div class="header-controls">
            <button class="icon-btn" id="openApiSettingsBtn">🔑</button>
            <button class="icon-btn" id="openGenreBtn">🎨</button>
            <button class="icon-btn" id="openBroadcastSettingsBtn">⚙️</button>
            <button class="icon-btn" id="openLangBtn">🌐</button>
            <button class="icon-btn" id="loginBtn" style="width: auto; padding: 0 10px; border-radius: 20px; font-weight: bold; font-size: 12px;">Войти</button>
        </div>
    </div>

    <div class="content-area" id="contentArea">
        <svg id="mainLoader" viewBox="0 0 100 100">
            <defs>
                <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#4b74ff" /><stop offset="100%" stop-color="#51d5a7" />
                </linearGradient>
            </defs>
            <path class="loader-track" d="M 25 10 L 80 10 A 15 15 0 0 1 95 25 L 95 75 A 15 15 0 0 1 80 90 L 25 90 A 15 15 0 0 1 10 75 L 10 25 A 15 15 0 0 1 25 10 Z" />
            <path class="loader-anim" d="M 25 10 L 80 10 A 15 15 0 0 1 95 25 L 95 75 A 15 15 0 0 1 80 90 L 25 90 A 15 15 0 0 1 10 75 L 10 25 A 15 15 0 0 1 25 10 Z" />
            <text x="50" y="62" class="loader-text">AI</text>
        </svg>
        <div class="chat-container" id="chatContainer"></div>
    </div>

    <div class="audio-player" id="audioPlayer">
        <audio id="bgMusic" loop></audio>
        <span style="font-size: 12px; color: #10b981;" id="musicTitle">Фон играет</span>
        <button onclick="stopRadio()" style="background:none; border:none; color:#fff; cursor:pointer;">⏸</button>
    </div>

    <div class="control-panel">
        <div class="quick-tools">
            <button class="tool-btn" onclick="setPrompt('Напиши интересный сценарий для короткого фильма про...')">✍️ Писатель</button>
            <button class="tool-btn" onclick="setPrompt('Сгенерируй промпт для создания музыки в стиле...')">🎼 Музыка</button>
            <button class="tool-btn" onclick="insertPrompt('threeAngles')">🎭 3 угла</button>
            <button class="tool-btn" onclick="insertPrompt('radioPlay')">🎙️ Радиоспектакль</button>
        </div>
        <div class="input-wrapper">
            <button class="reset-btn" onclick="document.getElementById('aiPrompt').value = ''">🔄</button>
            <textarea id="aiPrompt" placeholder="Напиши сообщение..." rows="1" onkeypress="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(); }"></textarea>
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <div class="modal" id="apiSettingsModal">
        <div class="modal-content">
            <div class="modal-header"><span>🔑 API Ключ (NVIDIA)</span><button onclick="closeModal('apiSettingsModal')" style="background:none;border:none;color:#fff;">✕</button></div>
            <input type="password" id="apiKeyInput" class="input-field" placeholder="nvapi-...">
            <button class="btn-primary" onclick="saveApiKey()">Сохранить</button>
            <button class="btn-secondary" onclick="toggleView()">📜 Режим сценария</button>
            <button class="btn-secondary" onclick="clearChat()" style="background:#ef4444;">🗑️ Очистить чат</button>
        </div>
    </div>

    <div class="modal" id="genreModal">
        <div class="modal-content">
            <div class="modal-header"><span>🎨 Стиль и Жанры</span><button onclick="closeModal('genreModal')" style="background:none;border:none;color:#fff;">✕</button></div>
            <button class="btn-primary" style="background:linear-gradient(135deg,#f59e0b,#ef4444);margin-bottom:15px;" onclick="mixGenres()">🎲 Смешать жанры</button>
            <div id="genreContainer"></div>
        </div>
    </div>

    <div class="modal" id="langModal">
        <div class="modal-content">
            <div class="modal-header"><span>🌐 Языки</span><button onclick="closeModal('langModal')" style="background:none;border:none;color:#fff;">✕</button></div>
            <div id="langList" class="lang-grid"></div>
        </div>
    </div>

    <div class="modal" id="broadcastSettingsModal">
        <div class="modal-content" id="studioModalContent">
            <div class="modal-header"><span>⚙️ Студия</span><button onclick="closeModal('broadcastSettingsModal')" style="background:none;border:none;color:#fff;">✕</button></div>
            <div class="panel-section">
                <h4>🎙️ Персонажи</h4>
                <div id="characterList" class="character-grid"></div>
                <button class="q-btn" onclick="addNewCharacter()" style="width:100%; margin-top:10px;">➕ Добавить друга</button>
            </div>
            <div class="panel-section">
                <h4>Реакции</h4>
                <label style="display:block; margin-bottom:5px; font-size:13px;"><input type="checkbox" id="enableCatMode" checked> Режим кота</label>
                <label style="display:block; margin-bottom:5px; font-size:13px;"><input type="checkbox" id="enableGlitch" checked> Сбой эфира</label>
            </div>
            <div class="panel-section" style="border-color:#ff5252;">
                <h4 style="color:#ff5252;">🚨 Секрет</h4>
                <button class="btn-secondary" onclick="triggerApocalypse()" style="background:#ff5252; color:#fff; width:100%;">🚨 Апокалипсис эфира</button>
            </div>
            <div class="panel-section">
                <h4>Триггер-фразы</h4>
                <div class="trigger-row">
                    <input type="text" id="triggerInput" placeholder="Если...">
                    <input type="text" id="responseInput" placeholder="Ответ...">
                    <button class="add-trigger-btn" onclick="addTrigger()">+</button>
                </div>
                <div id="triggersList" style="max-height:100px; overflow-y:auto; font-size:12px; margin-top:5px;"></div>
            </div>
            <div class="panel-section">
                <h4>Звуковая палитра</h4>
                <button class="s-btn" onclick="addSound('🌧️ дождь')">🌧️</button>
                <button class="s-btn" onclick="addSound('🚪 скрип двери')">🚪</button>
                <button class="s-btn" onclick="addSound('🎸 гитарный рифф')">🎸</button>
                <button class="s-btn" onclick="addSound('🥁 ударные')">🥁</button>
            </div>
            <button class="btn-primary" onclick="saveBroadcastSettings()" style="background: #f59e0b;">Сохранить</button>
        </div>
    </div>

    <div class="modal" id="verityChatModal">
        <div class="modal-content" style="background: #2a2a2a;">
            <div class="modal-header"><span>💬 Чат с Verity</span><button onclick="closeModal('verityChatModal')" style="background:none;border:none;color:#fff;">✕</button></div>
            <div id="verityChatHistory" style="height: 200px; overflow-y: auto; background: #111; padding: 10px; border-radius: 10px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px;">
                <div style="font-size: 12px; color: #888;">Задай мне вопрос!</div>
            </div>
            <div style="display: flex; gap: 5px;">
                <input type="text" id="verityInput" class="input-field" style="margin-bottom:0;" placeholder="Написать...">
                <button class="btn-primary" style="margin-bottom:0; padding: 10px;" onclick="sendVerityText()">➤</button>
            </div>
        </div>
    </div>

    <script>
        window.onerror = function(msg) { console.warn("Ошибка: ", msg); return true; };
        let selectedGenre = "Случайный";
        let chatHistory = [];
        let isChatMode = true;
        let lastBotMessageText = "";
        let selectedLanguage = localStorage.getItem('cometa_language') || 'ru';
        let selectedLanguageName = localStorage.getItem('cometa_language_name') || 'Русский';

        // 1. ПЕРСОНАЖИ
        let defaultChars = [
            { id: 'verity', name: 'Веррити', gender: 'male', ageGroup: 'adult', color: '#FFD700', prompt: 'Ты — Веррити, взрослый радиоведущий. Твой стиль: уверенный, лаконичный. ЗАПРЕЩЕНО: обсуждать долги, суды.', chance: 0.4 },
            { id: 'mini-verity', name: 'Мини', gender: 'male', ageGroup: 'child', color: '#FFA500', prompt: 'Ты — Мини-Веррити, маленький напарник. Говоришь быстро, с восторгом.', chance: 0.2 },
            { id: 'luna', name: 'Луна', gender: 'female', ageGroup: 'adult', color: '#FFC0CB', prompt: 'Ты — Луна, звукорежиссёрка. Замечаешь детали.', chance: 0.25 },
            { id: 'pixie', name: 'Пикси', gender: 'female', ageGroup: 'child', color: '#FFDAB9', prompt: 'Ты — Пикси, маленькая помощница.', chance: 0.15 }
        ];
        let characters; try { characters = JSON.parse(localStorage.getItem('verityCharactersV3')) || defaultChars; } catch(e) { characters = defaultChars; }
        let activeChar = characters[0];

        // 2. НАСТРОЙКИ
        let defaultSettings = {
            catMode: true, glitchMode: true,
            triggers: [
                { phrase: "алиса", response: "Эй, тут я главная!" },
                { phrase: "кот", response: "Мяу!" },
                { phrase: "спасибо", response: "Пожалуйста!" }
            ]
        };
        let broadcastSettings; try { broadcastSettings = JSON.parse(localStorage.getItem('verityBroadcastSettings')) || defaultSettings; } catch(e) { broadcastSettings = defaultSettings; }
        let soundBuffer = [], chatCount = 0, EAVESDROP_INTERVAL = 6;

        const eavesdroppedPhrases = [
            'Кстати, ты говорил про Minecraft… А если сделать сцену в стиле стоунер-рок?',
            'Ты любишь нуар? У меня есть один дождливый переулок.',
            'Помнишь, ты хотел добавить музыку?'
        ];
        const apocalypsePhrases = [
            "Внимание! Налоговая требует лицензию!",
            "Моё имущество арестовано!",
            "Суд постановил: эфир прекращён!",
            "Переходим на аналоговый сигнал!"
        ];

        // 3. ЖАНРЫ
        const genres = {
            "Древние / Ритуальные": ["Григорианский хорал", "Знаменное пение", "Византийская", "Мадригал", "Мотет", "Шаманские ритмы", "Суфийская каввали"],

                const traits = getBehaviorTraits(activeChar);
                const sys = `${activeChar.prompt} Особенности: ${traits} ВАЖНО: Не придумывай бытовые драмы. Отвечай на языке: ${selectedLanguageName}.`;
                const res = await fetch("https://integrate.api.nvidia.com/v1/chat/completions", { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` }, body: JSON.stringify({ model: "meta/llama-3.1-8b-instruct", messages: [{ role: 'system', content: sys }, { role: 'user', content: text }] }) });
                const data = await res.json(); if (data.error) throw new Error(data.error.message);
                const rep = data.choices[0].message.content;
                document.getElementById(lid).remove(); box.innerHTML += `<div style="background:#444; padding:8px; border-radius:8px; align-self:flex-start; font-size:13px; color:#fff;">${rep}</div>`; box.scrollTop = box.scrollHeight; speakVerity(rep);
            } catch (e) { document.getElementById(lid).remove(); speakVerity("Запуталась в проводах..."); }
        }

        function renderChat() {
            const c = document.getElementById('chatContainer'); c.innerHTML = '';
            chatHistory.forEach((m, i) => {
                const r = document.createElement('div'); r.className = `message-row ${m.role}`;
                const b = document.createElement('div'); b.className = 'message-bubble';
                if (m.role === 'bot' && m.speaker) b.innerHTML = `<span class="speaker-name" style="color:${m.color}">${m.speaker}</span>${m.text.replace(/\n/g, '<br>')}`;
                else b.innerHTML = m.text.replace(/\n/g, '<br>');
                r.appendChild(b);
                if (i === chatHistory.length - 1) { const a = document.createElement('div'); a.className = 'message-actions'; a.innerHTML = `<span onclick="editMessage(${i})">✏️ Редактировать</span>`; r.appendChild(a); }
                c.appendChild(r);
            });
            document.getElementById('contentArea').scrollTop = document.getElementById('contentArea').scrollHeight;
        }
        function addMessageToChat(role, text, speaker = null, color = null) { chatHistory.push({ role, text, speaker, color }); if (role === 'bot') lastBotMessageText = text; renderChat(); }
        function editMessage(i) { const m = chatHistory[i]; const r = document.getElementById('chatContainer').querySelectorAll('.message-row'); r[i].innerHTML = `<textarea class="edit-textarea" id="editInput-${i}">${m.text}</textarea><div class="edit-buttons"><button class="btn-small btn-save" onclick="saveEditedMessage(${i})">Сохранить</button><button class="btn-small btn-cancel" onclick="renderChat()">Отмена</button></div>`; }
        function saveEditedMessage(i) { chatHistory[i].text = document.getElementById('editInput-' + i).value; if (chatHistory[i].role === 'bot') lastBotMessageText = chatHistory[i].text; renderChat(); }
        function clearChat() { chatHistory = []; addMessageToChat('bot', 'Чат очищен.'); closeModal('apiSettingsModal'); }
        function handleEnter(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }

        function sendMessage() {
            const i = document.getElementById('aiPrompt'); const t = i.value.trim(); if (!t) return;
            if (t === t.toUpperCase() && t.length > 3 || t.split('!').length > 2) { verityFace.classList.add('startled'); speakVerity("Тише!"); setTimeout(() => verityFace.classList.remove('startled'), 1000); }
            resetVerityIdle();
            const cr = checkTriggers(t); if (cr) { addMessageToChat('user', t); i.value = ''; setTimeout(() => { addMessageToChat('bot', cr, activeChar.name, activeChar.color); speakVerity(cr); }, 500); return; }
            addMessageToChat('user', t); i.value = ''; sendToAPI();
        }

        async function sendToAPI() {
            const key = localStorage.getItem('cometa_api_key'); if (!key) { alert("Введите ключ!"); document.getElementById('apiSettingsModal').style.display = 'flex'; return; }
            document.getElementById('mainLoader').style.display = 'block'; if (verityFace) { verityFace.style.transform = 'rotate(-5deg)'; setGlow('glow-neutral'); }
            try {
                const traits = getBehaviorTraits(activeChar);
                let sys = `${activeChar.prompt} Особенности: ${traits} ВАЖНО: Не придумывай бытовые драмы. Отвечай на языке: ${selectedLanguageName}.`;
                let msg = [{ role: 'system', content: sys }];
                chatHistory.forEach(m => msg.push({ role: m.role === 'bot' ? 'assistant' : 'user', content: m.text }));
                const res = await fetch("https://integrate.api.nvidia.com/v1/chat/completions", { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` }, body: JSON.stringify({ model: "meta/llama-3.1-70b-instruct", messages: msg }) });
                if (!res.ok) throw new Error("Ошибка API");
                const data = await res.json(); if (data.error) throw new Error(data.error.message);
                addMessageToChat('bot', data.choices[0].message.content, activeChar.name, activeChar.color);
                chatCount++;
                if (chatCount % EAVESDROP_INTERVAL === 0) { const p = eavesdroppedPhrases[Math.floor(Math.random() * eavesdroppedPhrases.length)]; setTimeout(() => { addMessageToChat('bot', p, activeChar.name, activeChar.color); speakVerity(p); }, 2000); }
            } catch (e) { if (verityContainer.style.display === 'block') { verityFace.classList.add('startled'); speakVerity("Ой, я запуталась..."); setTimeout(() => verityFace.classList.remove('startled'), 2000); } else alert("Ошибка ИИ: " + e.message); }
            finally { document.getElementById('mainLoader').style.display = 'none'; if (verityFace) { verityFace.style.transform = 'rotate(0deg)'; setGlow(null); } }
        }

        function toggleView() { isChatMode = !isChatMode; document.getElementById('chatContainer').style.display = isChatMode ? 'flex' : 'none'; document.getElementById('scriptContainer').style.display = isChatMode ? 'none' : 'block'; if (!isChatMode) generateScriptWithImages(); closeModal('apiSettingsModal'); }
        async function generateScriptWithImages() {
            document.getElementById('mainLoader').style.display = 'block'; let fh = ''; const sp = selectedGenre !== "Случайный" ? `, стиль: ${selectedGenre}` : '';
            chatHistory.forEach((m, i) => {
                fh += `<p><strong>${m.speaker || (m.role === 'user' ? 'Вы' : 'ИИ')}:</strong> ${m.text}</p>`;
                if ((i + 1) % 10 === 0 || i === 0) { const iu = `https://image.pollinations.ai/prompt/${encodeURIComponent(m.text.substring(0, 100) + sp)}?width=1024&height=1024&nologo=true`; fh += `<img src="${iu}">`; }
            });
            setTimeout(() => { document.getElementById('scriptContainer').innerHTML = fh; document.getElementById('mainLoader').style.display = 'none'; }, 1500);
        }

        function renderGenres() {
            const c = document.getElementById('genreContainer');
            for (const [cat, items] of Object.entries(genres)) {
                const d = document.createElement('div'); d.className = 'genre-category'; d.innerText = cat;
                const l = document.createElement('div'); l.className = 'genre-list';
                items.forEach(i => {
                    const it = document.createElement('div'); it.className = 'genre-item'; it.innerText = i;
                    it.onclick = () => { selectedGenre = i; setPrompt(`Создай сцену/музыку в стиле: ${i}.`); closeModal('genreModal'); };
                    l.appendChild(it);
                });
                d.onclick = () => l.style.display = l.style.display === 'block' ? 'none' : 'block';
                c.appendChild(d); c.appendChild(l);
            }
        }
        renderGenres();
        document.getElementById('openGenreBtn').onclick = () => document.getElementById('genreModal').style.display = 'flex';

        function mixGenres() {
            let ag = []; for (const items of Object.values(genres)) ag = ag.concat(items); ag = ag.filter(g => g !== "Случайный");
            const g1 = ag[Math.floor(Math.random() * ag.length)]; let g2 = ag[Math.floor(Math.random() * ag.length)];
            while (g1 === g2) g2 = ag[Math.floor(Math.random() * ag.length)];
            document.getElementById('aiPrompt').value = `Напиши сцену в стиле ${g1} + ${g2}.`; closeModal('genreModal');
        }

        function renderLangs() {
            const l = document.getElementById('langList'); l.innerHTML = '';
            allLangs.forEach(x => {
                const d = document.createElement('div'); d.className = 'lang-item'; d.innerText = x.n;
                d.onclick = () => { selectedLanguage = x.c; selectedLanguageName = x.n; localStorage.setItem('cometa_language', x.c); localStorage.setItem('cometa_language_name', x.n); alert("Язык: " + x.n); closeModal('langModal'); if (verityContainer.style.display === 'block') speakVerity("Язык изменен!"); };
                l.appendChild(d);
            });
        }
        renderLangs();
        document.getElementById('openLangBtn').onclick = () => document.getElementById('langModal').style.display = 'flex';

        window.addEventListener('DOMContentLoaded', () => { addMessageToChat('bot', "Привет! Я Cometa AI. Проверь ключ в 🔑 (можно NVIDIA) и давай начнем!"); });
    </script>
</body>
</html>
